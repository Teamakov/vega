тным.","source":"Ялом, «Групповая психотерапия», гл. 6, прозрачность терапевта и её воздействие на группу, с. 232-234 - по конспекту","quote":"Автор считает его беспочвенным: члены группы любопытны, но хотят, чтобы терапевт оставался неведанным и властным.","by_record":false,"h":"f177cb04"},{"id":"m2-ya-06-03","module":2,"topic":"Ловушки прозрачности","kind":"знание","question":"Какое место Ялом отводит прозрачности и самораскрытию терапевта?","options":["Главная задача терапевта - быть откровенным и аутентичным","Терапевту лучше оставаться безликим, чтобы не мешать переносу","Это средство, подчинённое ответственности и задачам группы"],"correct":2,"why_not":["Ялом пишет прямо: «главной задачей терапевта не является откровенность или аутентичность». Кредо «Будь собой» как организующий принцип он называет тиранией, а не свободой.","Вера в безликого терапевта держится на идее, что главное - разрешить перенос. Ялом считает другие лечебные факторы не менее значимыми, а прозрачный терапевт выигрывает в гибкости.",null],"explanation":"Самораскрытие терапевта полезно, когда задаёт пример и помогает участникам сверить впечатления с реальностью. Ялом советует спрашивать себя, на какой стадии группа и нужен ли ей сейчас такой пример. Терапевт, по его словам, - не стержень терапии, а «повивальная бабка» группы.","source":"Ялом, «Групповая психотерапия», гл. 6, ловушки прозрачности терапевта, с. 238-242 - по конспекту","quote":"прозрачность - средство, а не цель; она подчинена ответственности и задаче терапевта по поддержанию группы","by_record":false,"h":"32b50465"},{"id":"m2-ya-07-01","module":2,"topic":"Групповая девиантность","kind":"знание","question":"Почему, по Ялому, пациент становится девиантом - изолированным участником, который не вписывается в терапевтическую группу?","options":["Из-за необычного стиля жизни или тяжёлого прошлого, которое группа не принимает","Из-за своего межличностного поведения на встречах","Из-за того, что отличается от остальных возрастом, семейным положением или происхождением"],"correct":1,"why_not":["Ялом пишет, что нет такого девиантного прошлого, которое не могла бы принять группа с терапевтическими нормами. Бывшая проститутка и бывшая наркоманка в его группах девиантами не стали.",null,"Почти каждый в группе чем-то исключителен: самый молодой, единственный холостой, единственный азиат. Девиантность - это отличие по признакам, важным для участия в работе группы."],"explanation":"Будущих девиантов, по Ялому, нетрудно увидеть уже на интервью: они отрицают проблемы и объясняют плохое самочувствие телом или внешними обстоятельствами. Для отбора важна девиантность относительно целей конкретной группы.","source":"Ялом, «Групповая психотерапия», гл. 7, групповая девиантность, с. 253-259 - по конспекту","quote":"пациенты становятся девиантами из-за межличностного поведения на встречах, а не из-за девиантного стиля жизни или прошлого","by_record":false,"h":"b6454495"},{"id":"m2-ya-07-02","module":2,"topic":"Дискомфорт и готовность к группе","kind":"знание","question":"Как, по Ялому, связаны сила дискомфорта пациента и его готовность платить цену за участие в группе?","options":["Криволинейно: и при слишком слабом, и при чрезмерном дискомфорте группа мало подходит","Прямо: чем сильнее страдание, тем выше мотивация и тем больше пользы от группы","Обратно: легче всего эту цену платят те, кто страдает меньше остальных"],"correct":0,"why_not":[null,"Ялом прямо пишет, что связь не линейная. Пациенты с исключительно высоким дискомфортом так подавлены тревогой, что цели группы кажутся им не связанными с их проблемами.","Пациенты со слишком низким дискомфортом, наоборот, как правило, не желают платить цену за членство."],"explanation":"Цена членства - время, деньги, силы, а ещё тревога, фрустрация и смущение. Высокую цену могут быть готовы платить пациенты со сравнительно высоким дискомфортом, если верят, что группа поможет.","source":"Ялом, «Групповая психотерапия», гл. 7, удовлетворяет ли группа потребности личности, с. 267-269 - по конспекту","quote":"«Отношение между испытываемым дискомфортом и возможностью групповой терапии не линейное, оно криволинейное»","by_record":false,"h":"c54d3311"},{"id":"m2-ya-08-01","module":2,"topic":"Прогноз поведения в группе","kind":"знание","question":"Как, по Ялому, точнее всего предсказать, как человек поведёт себя в будущей терапевтической группе?","options":["Опереться на диагноз по руководству психиатрической ассоциации","Понаблюдать за ним во временной группе из других кандидатов","Прогнать стандартные тесты: Роршах, MMPI, TAT"],"correct":1,"why_not":["По свидетельству большинства групповых терапевтов, психиатрический диагноз не может определять межличностное поведение: два человека с тревожными реакциями могут вести себя в группе совершенно по-разному.",null,"Стандартные тесты, по конспекту, потерпели неудачу в прогнозе группового поведения, с единственным незначительным исключением."],"explanation":"Общий принцип главы: чем ближе условия отбора к реальной группе, тем точнее прогноз. Самый многообещающий метод - наблюдать кандидатов в отборочных группах, а если средств нет - вести интервью с упором на то, как человек строит отношения.","source":"Ялом, «Групповая психотерапия», гл. 8, прогностическая ценность специализированных процедур, с. 288 - по конспекту","quote":"Общий принцип: чем ближе условия отбора к реальной групповой ситуации, тем точнее прогноз.","by_record":false,"h":"2e104a5f"},{"id":"m2-ya-08-02","module":2,"topic":"Гетерогенность и гомогенность состава","kind":"знание","question":"Какое рабочее правило состава группы Ялом выводит из клинических наблюдений?","options":["Гомогенность по конфликтам и гетерогенность по силе «эго»","Гомогенность по симптомам: так группа быстрее сплотится и поддержит","Гетерогенность по линии конфликтов и гомогенность по силе «эго»"],"correct":2,"why_not":["Это правило наоборот. Разные конфликты создают полезный диссонанс, а большой разброс по уязвимости тормозит группу: самый уязвимый пациент наложит рамки на остальных.","Гомогенным группам действительно приписывают быструю сплочённость, но клиницисты считают, что такие группы остаются на поверхностном уровне и мало меняют характер.",null],"explanation":"Изменению предшествует диссонанс, поэтому людям полезно встретить в группе другие конфликты и другие способы их решать. Но без достаточной силы «эго» - душевной устойчивости - пользы от диссонанса не будет, поэтому по ней участники должны быть близки.","source":"Ялом, «Групповая психотерапия», гл. 8, клинические наблюдения за формированием группы, с. 291 - по конспекту","quote":"Но без адекватной силы «эго» пользы от диссонанса не будет, следовательно - «гетерогенность по линии конфликтов и гомогенность по силе \"эго\"»","by_record":false,"h":"e02a247a"},{"id":"m2-ya-08-03","module":2,"topic":"Итог главы о составе группы","kind":"знание","question":"Во что, по итоговому выводу главы о составе группы, терапевту лучше вложить время и силы?","options":["В отбор пациентов и их подготовку до начала терапии","В подбор участников под свободные роли в группе","В максимальное разнообразие состава по возрасту и статусу"],"correct":0,"why_not":[null,"Идею «какая роль в группе свободна» предлагал Бах. Ялом пишет, что пока нет удовлетворительной системы эталонов, этот вопрос мало помогает, а силы на искусное распределение ролей себя не оправдывают.","Разнообразие полезно, но сплочённость ограничивает его степень: слишком большая разница ведёт к отклонению и угрожает сплочённости."],"explanation":"Состав сильно влияет на характер группы, но тратить силы на тонкий баланс состава при нынешних знаниях, по Ялому, не оправдано. Он советует ориентироваться на совместимость и сплочённость, то есть на то, сможет ли группа держаться вместе, а силы направлять на отбор и подготовку.","source":"Ялом, «Групповая психотерапия», гл. 8, обзор состава групп, с. 302 - по конспекту","quote":"Время и силы на искусное распределение ролей и баланс не оправдывают себя при нынешних знаниях; лучше направить их на отбор и предтерапевтическую подготовку","by_record":false,"h":"2e5f9bef"},{"id":"m2-ya-09-01","module":2,"topic":"Встречи вне группы","kind":"знание","question":"Как Ялом советует говорить с будущими участниками об их встречах друг с другом вне группы?","options":["Запретить такие встречи правилом, чтобы не возникали подгруппы","Не запрещать, но всё важное из них обсуждать в группе","Поощрять встречи: группа и есть место, где строят дружбу"],"correct":1,"why_not":["Ялом считает запрещающие правила бесполезными: участники всё равно встретятся, но не захотят об этом говорить, а вредит терапии как раз соглашение об умолчании.",null,"Ялом пишет обратное: группа учит строить близкие, длительные отношения, но сама их не строит, это не встреча для дружеского общения."],"explanation":"Лучше дать информацию, чем спускать правила сверху. Если участники встретились вне группы, они обязаны обсудить самое яркое из этой встречи на сессии, чтобы тайная связь не мешала открытости.","source":"Ялом, «Групповая психотерапия», гл. 9, система подготовки, с. 324 - по конспекту","quote":"если участники встречаются вне группы, они обязаны обсуждать самые яркие аспекты встречи в группе. Запрещающие правила бесполезны","by_record":false,"h":"9c85efc0"},{"id":"m2-ya-09-02","module":2,"topic":"Размер группы","kind":"знание","question":"Какой размер психотерапевтической группы Ялом называет идеальным?","options":["Восемь-девять человек, больше амбулаторные терапевты не берут","От двенадцати до шестнадцати, как в тренингах сенситивности","Около семи человек, допустимо от пяти до десяти"],"correct":2,"why_not":["Восемь-девять - верхний предел у большинства амбулаторных терапевтов, и столько набирают на старте, потому что один-два человека обычно уходят после первых встреч. Идеал - около семи.","Такой размер обычен для тренингов сенситивности. Работа там ещё возможна, но времени на проблемы каждого не хватает.",null],"explanation":"Нижний предел задан тем, что при двух-трёх участниках группа перестаёт работать как группа и терапевт уходит в индивидуальную работу. Верхний - временем: чем больше людей, тем меньше внимания проблемам каждого.","source":"Ялом, «Групповая психотерапия», гл. 9, размер группы, с. 315 - по конспекту","quote":"Идеальный размер психотерапевтической группы - около семи человек, допускается количество от пяти до десяти участников","by_record":false,"h":"9af4b819"},{"id":"m2-ya-10-01","module":2,"topic":"Стадии развития группы","kind":"знание","question":"Шутц описал главный вопрос каждой стадии развития группы. Какой вопрос встаёт на второй стадии - стадии конфликта?","options":["«Внутри или снаружи»","«Близко или далеко»","«На вершине или на дне»"],"correct":2,"why_not":["Это вопрос первой стадии: участников заботят принятие, границы группы и то, найдут ли они в ней своё место.","Это вопрос третьей стадии, когда группа сплачивается и решает, насколько близкими быть друг с другом.",null],"explanation":"На второй стадии внимание переходит к доминированию, контролю и власти: каждый ищет свой объём влияния, растёт критика, в том числе к ведущему, постепенно складывается иерархия.","source":"Ялом, «Групповая психотерапия», гл. 10, вторая стадия: конфликт, доминирование, сопротивление, с. 338 - по конспекту","quote":"Если первый центральный вопрос - «внутри или снаружи», то следующий - «на вершине или на дне»","by_record":false,"h":"f8b22fd8"},{"id":"m2-ya-10-02","module":2,"topic":"Малочисленная встреча","kind":"знание","question":"На встречу пришли только двое участников. Как в такой ситуации поступает Ялом?","options":["Проводит встречу, не уходя от отношений в группе","Отменяет встречу, пока не соберутся хотя бы трое","Проводит, но работает с каждым как на личном приёме"],"correct":0,"why_not":[null,"Так делают другие терапевты. Ялом никогда не отменяет встречу: участники должны знать, что группа всегда есть, стабильна и надёжна.","Это ловушка микрогрупп, о которой предупреждает Ялом: терапевт переключается на внутренние процессы, как в индивидуальной терапии, и забывает о межличностных."],"explanation":"Надёжность группы сама поддерживает посещаемость. В примере главы встреча с двумя пациентами прошла как групповая: обсуждали отсутствующих и чувства друг к другу и к терапевту, и она оказалась важной для обоих.","source":"Ялом, «Групповая психотерапия», гл. 10, посещаемость и пунктуальность, с. 354 - по конспекту","quote":"Ялом поощряет посещение, но никогда не отменяет встречу, какой бы малочисленной ни была группа","by_record":false,"h":"b2f2d22d"},{"id":"m2-ya-10-03","module":2,"topic":"Когда вводить новичка","kind":"знание","question":"Когда, по Ялому, самое благоприятное время привести в группу нового участника?","options":["Когда группа достигла высокого доверия и сплочённости","В период стагнации, когда группе нужны новые стимулы","В разгар конфликта, чтобы новичок разрядил напряжение"],"correct":1,"why_not":["Ялом приводит это как пример неблагоприятного момента: группа достигла высокой сплочённости и доверия, и участнику предстоит впервые поделиться важным секретом. Группа может не принять новичка и переключиться на противостояние ему.",null,"Кризис и активные междоусобные войны - тоже неблагоприятное время: группа может не принять новичка и переключиться на противостояние ему."],"explanation":"Многие группы в застое сами чувствуют потребность в новых стимулах и поддерживают терапевта, когда он приводит новичков. Ялом при этом не затягивает с пополнением: маленькие группы со временем становятся ещё меньше.","source":"Ялом, «Групповая психотерапия», гл. 10, пополнение группы новыми участниками, с. 356 - по конспекту","quote":"Самый благоприятный период для нового члена - период стагнации группы","by_record":false,"h":"93e4a685"},{"id":"m2-ya-11-01-r","module":2,"topic":"Просьба сохранить тайну","kind":"знание","question":"Участник, у которого завязались отношения с кем-то из группы вне сессий, просит терапевта о личной встрече и о том, чтобы остальные ничего не узнали. Что советует Ялом?","options":["Пообещать тайну: так пациент сохранит доверие и расскажет больше","Потребовать прекратить эти отношения, раз они мешают группе","Не обещать тайны, но действовать в интересах пациентов"],"correct":2,"why_not":["Ялом предупреждает: терапевт, пообещавший конфиденциальность, становится частью сговора, который ему же невыгоден.","По Ялому, терапевт своим указом не может предотвратить ни подгруппы, ни сексуальные отношения в группе. Вслед за Вулфом он пишет: такие пары сближаются независимо от запретов, а затем появляются вина перед терапевтом и желание скрыть подробности.",null],"explanation":"Ялом советует никогда не обещать сохранять тайну, а заверить пациента, что терапевт подойдёт к вопросу профессионально и будет действовать в интересах пациентов. Обещание сделало бы его участником сговора, а разрушительно для группы как раз умалчивание вокруг подгрупп.","source":"Ялом, «Групповая психотерапия», гл. 11, образование подгрупп, терапевтические соображения, с. 373 - по конспекту","quote":"Давший обещание конфиденциальности становится частью невыгодного ему сговора. Совет: «никогда не обещать сохранять конфиденциальность», а заверить, что терапевт будет подходить к вопросу с профессиональной точки зрения и действовать в интересах пациентов.","by_record":false,"h":"e6d1f1e3"},{"id":"m2-ya-11-02","module":2,"topic":"Источники вражды в группе","kind":"знание","question":"Что Ялом называет самым распространённым источником вражды между участниками терапевтической группы?","options":["Соперничество за внимание терапевта и особую роль","Реакцию зеркального отражения","Различие взглядов из-за разного жизненного опыта"],"correct":1,"why_not":["Соперничество входит в перечень источников вражды, но самым распространённым Ялом его не называет.",null,"Это тоже один из источников враждебности, например между поколениями или между либералами и консерваторами, но не самый частый."],"explanation":"Человек годами подавляет в себе черту, которой стыдится, а встретив её в другом, чувствует сильную и необъяснимую неприязнь. Так Винсент, скрывавший своё итальянское происхождение, не выносил другого участника-итальянца, который сохранил ценности своей этнической группы.","source":"Ялом, «Групповая психотерапия», гл. 11, конфликт в терапевтической группе, с. 387 - по конспекту","quote":"форма паратаксического искажения и наиболее распространённый источник вражды в терапевтических группах","by_record":false,"h":"96b7b63e"},{"id":"m2-ya-11-03","module":2,"topic":"Мера самораскрытия","kind":"знание","question":"Как Ялом описывает связь между уровнем самораскрытия и умением строить отношения?","options":["Криволинейно: и слишком слабое, и слишком сильное говорят о проблемах","Прямо: чем больше и раньше раскрываешься, тем лучше результат","Важна только тема: о прошлом говорить полезнее, чем о чувствах к участникам"],"correct":0,"why_not":[null,"Ялом называет грубейшей ошибкой мысль, что абсолютное и непрерывное самораскрытие ещё лучше. Те, кто исповедуется рано и беспорядочно, часто досрочно бросают терапию.","Наоборот: из всего, что раскрывают в групповой терапии, наибольшее значение часто имеют актуальные чувства к другим людям."],"explanation":"Скрытный человек не встречает ответной откровенности и вряд ли будет по-настоящему принят. Но чрезмерное раскрытие тоже вредит: человек испытывает стыд, пугает тех, кто не готов ответить тем же, и часто уходит.","source":"Ялом, «Групповая психотерапия», гл. 11, самораскрытие как свидетельство недостаточной приспособляемости, с. 397 - по конспекту","quote":"слишком слабое или слишком сильное самораскрытие свидетельствует о недостаточной приспособляемости в межличностных отношениях","by_record":false,"h":"92c0a01e"},{"id":"m2-ya-11-04","module":2,"topic":"Участник решил уйти","kind":"знание","question":"Участник на восьмой встрече объявляет, что уходит из группы. Что, по опыту Ялома, разумнее всего сделать?","options":["Уговорить его прийти ещё на одно собрание и обсудить уход со всеми","Надавить: объяснить, что уход подведёт группу и ведущего","Провести с ним несколько личных бесед о причинах стресса"],"correct":2,"why_not":["В исследовании Ялома каждого первого выбывшего из девяти групп уговаривали прийти ещё на одно собрание, и это ни разу не предотвратило уход.","Если терапевт паникует и давит, пациент воспримет это как просьбу сделать что-то для терапевта или группы и обязательно уйдёт.",null],"explanation":"На последнем собрании уходящий говорит осторожно и защищается, пользы никому нет. На личной беседе точная интерпретация может удержать: в примере главы терапевт показал отчуждённому пациенту, что тот бежит от близости, как и в жизни, и пациент вернулся и постепенно достиг значительных результатов.","source":"Ялом, «Групповая психотерапия», гл. 11, завершение терапии: неуспешный пациент, с. 403 - по конспекту","quote":"Наиболее разумно - провести с потенциальным выбывающим несколько индивидуальных бесед о причинах группового стресса","by_record":false,"h":"bb933d29"},{"id":"m2-ya-12-01","module":2,"topic":"Монополист","kind":"знание","question":"Ялом называет двусторонний подход к монополисту наиболее эффективным. С какими двумя сторонами работает терапевт?","options":["С монополистом и с группой, которая это допускает","С монополистом в группе и с ним же на личных сеансах","С его поведением сейчас и с его причинами в прошлом"],"correct":0,"why_not":[null,"Двусторонний подход у Ялома не про личные сеансы: монополист находится в равновесии с группой, которая поощряет его поведение, поэтому работать надо и с ней.","Ялом советует обратное: искать причину в начале терапии мало пользы, гораздо больший эффект даёт внимание к тому, как пациент проявляет себя в группе и как на это реагируют другие."],"explanation":"Монополист не существует в вакууме: группа терпит его, потому что он избавляет остальных от необходимости участвовать и раскрываться. Терапевт спрашивает группу, почему она это допускает, а монополисту помогает увидеть, что потоком слов он держит людей на расстоянии.","source":"Ялом, «Групповая психотерапия», гл. 12, монополист, терапевтические соображения, с. 416 - по конспекту","quote":"терапевт должен принять в рассмотрение и монополиста, и группу, которая позволяла себя монополизировать","by_record":false,"h":"33c2b0e2"},{"id":"m2-ya-12-02","module":2,"topic":"Молчаливый участник","kind":"знание","question":"Что Ялом говорит о пользе групповой терапии для участника, который всё время молчит?","options":["Он получает не меньше других, узнавая себя в активных участниках","Молчание нейтрально, его лучше не трогать, пока человек не созреет","Молчание - проблема: такому участнику группа крайне редко помогает"],"correct":2,"why_not":["Некоторые скрытные пациенты действительно получают что-то через идентификацию, но в целом, по данным Ялома, чем активнее и влиятельнее пациент, тем больше у него шансов выздороветь.","Ялом пишет, что молчание никогда не бывает безмолвным, и советует не давать пациенту полностью изолироваться, вовлекая его через комментарии к его невербальным реакциям.",null],"explanation":"Чем больше человек говорит, тем сильнее его вовлечённость и тем больше его ценят остальные, а в итоге и он сам. Если через три месяца участие остаётся минимальным, прогноз, по опыту Ялома, неутешителен.","source":"Ялом, «Групповая психотерапия», гл. 12, молчаливый пациент, с. 424 - по конспекту","quote":"Молчаливый пациент - проблемный пациент; крайне редко групповая терапия приносит ему пользу","by_record":false,"h":"a6a512c6"},{"id":"m2-ya-12-03","module":2,"topic":"Отвергающий помощь нытик","kind":"знание","question":"Какую ошибку в работе с «отвергающим помощь нытиком» Ялом называет грубой?","options":["Держать фокус на обратной связи о том, как он действует на людей","Показывать ему свою фрустрацию и раздражение","Называть его паттерн простым описательным ярлыком"],"correct":1,"why_not":["Это Ялом как раз советует: когда группа сплочена, терапевт сосредотачивается на обратной связи так же, как с монополистом.",null,"Ялом пишет, что лёгкие описательные ярлыки, вроде игры «Почему бы вам не - да, но» у Берна, делают процесс понятнее и доступнее."],"explanation":"Такой участник просит помощи, а затем отвергает любую. Если ответить ему той же монетой, порочный круг замкнётся: он получит оправдание своей злости и подтверждение, что никто его не понимает.","source":"Ялом, «Групповая психотерапия», гл. 12, отвергающий помощь нытик, методы работы, с. 442 - по конспекту","quote":"Грубая ошибка - демонстрировать пациенту свою фрустрацию и негодование: «оплата той же монетой» замкнёт порочный круг","by_record":false,"h":"536cf8df"},{"id":"m2-ya-13-01","module":2,"topic":"Ко-терапия","kind":"знание","question":"Какую форму ко-терапии, то есть работы двух ведущих в одной группе, Ялом считает целесообразной?","options":["Старший ведущий и младший в роли ученика","Два ведущих в совершенно равном положении","Формально равные ведущие с очень разным мастерством"],"correct":1,"why_not":["Ялом пишет, что формат ученичества даёт напряжённость и неясность, кто руководит группой. Если опыт разный, каждому нужно спокойно чувствовать себя и коллегой, и учителем, и учеником.",null,"Партнёрство номинально равных, но разных по компетенции и чуткости терапевтов, по Ялому, почти неизменно создаёт сложности: группа замечает натянутость уже через несколько встреч."],"explanation":"Успех группы во многом зависит от выбора партнёра и равенства положения. Ко-терапевтам важно после каждой сессии хотя бы 15 минут обсуждать встречу и поведение друг друга.","source":"Ялом, «Групповая психотерапия», гл. 13, ко-терапевты, с. 461 - по конспекту","quote":"Любая другая форма ко-терапии, отличающаяся от той, где два терапевта находятся в совершенно равном положении, нецелесообразна","by_record":false,"h":"b5d65a60"},{"id":"m2-ya-13-02","module":2,"topic":"Встреча без ведущего","kind":"знание","question":"Зачем, по Ялому, группе иногда встречаться без терапевта?","options":["Чтобы группа училась отвечать за себя и приносила новые темы","Чтобы сэкономить время терапевта, когда специалистов не хватает","Чтобы проверить, готова ли группа вообще обходиться без ведущего"],"correct":0,"why_not":[null,"Дефицит профессионалов - одна из причин появления самоуправляемых групп, которые весь срок работают без ведущего. Альтернативные встречи - дополнение к обычной терапии с другими целями.","Встреча без ведущего у Ялома дополняет работу с терапевтом, а темы с неё потом прорабатывают вместе с ним. Группы без ведущего на весь срок - отдельная форма."],"explanation":"Участники часто боятся таких встреч: что группа уйдёт от задачи или потеряет контроль над эмоциями. Ялом считает многие страхи надуманными, отражением зависимой позиции, поэтому встречи без ведущего и полезны: люди лучше чувствуют свою автономию и ответственность.","source":"Ялом, «Групповая психотерапия», гл. 13, встреча без ведущего, с. 469 - по конспекту","quote":"Две основные цели альтернативной сессии: повысить групповое и персональное чувство ответственности и самостоятельности; способствовать появлению новых важных тем для последующей проработки с терапевтом.","by_record":false,"h":"ecdbbd70"},{"id":"m2-ya-13-03","module":2,"topic":"Структурированные упражнения","kind":"знание","question":"Что проект Либермана, Ялома и Майлза показал о ведущих, которые использовали много структурированных упражнений?","options":["Их считали компетентнее, но результаты у их групп были ниже","Их группы добились лучших и более стойких перемен, чем у других","Их оценивали ниже, зато группы в итоге менялись сильнее"],"correct":0,"why_not":[null,"Наоборот: у интенсивно тренировавшихся групп было меньше высоких результатов, больше негативных, а позитивные изменения были менее стабильны.","Участники оценивали таких ведущих выше: они были популярнее, их считали компетентнее и эффективнее."],"explanation":"Упражнения, то есть заданные ведущим действия, быстро вовлекают в выражение чувств и создают впечатление, что ведущий владеет ситуацией. Но группа платит дорогой ценой: обходит важные задачи развития и не становится самостоятельной.","source":"Ялом, «Групповая психотерапия», гл. 13, структурированные упражнения, с. 490 - по конспекту","quote":"Ведущие, использовавшие много упражнений, были популярнее, их считали более компетентными и эффективными. Но результат у интенсивно тренировавшихся групп был ниже","by_record":false,"h":"e5795fbb"},{"id":"m2-ya-14-01","module":2,"topic":"Первая Т-группа","kind":"знание","question":"Как в 1946 году в Коннектикуте открыли эмпирическое научение - обучение на собственном опыте в группе?","options":["Левин заранее спланировал обратную связь как главный метод","Участники попросились на вечерние разборы наблюдателей","Это вывод из эксперимента Левина с тремя стилями руководства"],"correct":1,"why_not":["По конспекту, открытие было случайным: участники узнали о вечерних обсуждениях и попросили разрешения присутствовать, а сотрудники решили пустить их в порядке эксперимента.",null,"Эксперимент с авторитарным, демократическим и попустительским руководством - отдельная классическая работа Левина с Липпитом и Уайтом. Эмпирическое научение открыли иначе."],"explanation":"Наблюдатели записывали, как ведут себя участники, и вечером обсуждали это с ведущими. Когда участников пустили на эти разборы и разрешили отвечать, эффект оказался поразительным: люди учатся эффективнее всего, исследуя отношения, в которые сами вовлечены.","source":"Ялом, «Групповая психотерапия», гл. 14, первая Т-группа, с. 502-503 - по конспекту","quote":"эмпирическое научение открыли случайно - когда участникам разрешили слушать и обсуждать наблюдения исследователей об их собственном поведении","by_record":false,"h":"51c6f607"},{"id":"m2-ya-14-02","module":2,"topic":"Окно Джогари","kind":"знание","question":"В окне Джогари, которое объясняли участникам Т-групп, какую область личности уменьшает обратная связь?","options":["Тайную: известное мне, но неизвестное другим","Слепую: неизвестное мне, но известное другим","Бессознательную: неизвестное ни мне, ни другим"],"correct":1,"why_not":["Тайную территорию уменьшает самораскрытие: человек сам рассказывает то, чего другие о нём не знают.",null,"Бессознательное «Я» в традиционных Т-группах было запретной зоной, работать с ним цели не было."],"explanation":"Цель Т-группы - расширить общедоступную область, известную и мне, и другим. Обратная связь показывает человеку то, что видят другие, но не видит он сам, а самораскрытие открывает другим его тайное.","source":"Ялом, «Групповая психотерапия», гл. 14, эволюция Т-групп, окно Джогари, с. 507-510 - по конспекту","quote":"Цель Т-группы - увеличить клетку A, уменьшая B (слепые пятна) через обратную связь и C (тайное) через самораскрытие.","by_record":false,"h":"db54df4e"},{"id":"m2-ya-14-03","module":2,"topic":"Функции ведущего","kind":"знание","question":"Какие две функции ведущего в исследовании групп встреч связаны с результатом прямо: чем больше, тем лучше?","options":["Эмоциональная стимуляция и исполнительная функция","Забота и эмоциональная стимуляция","Забота и смысловая атрибуция"],"correct":2,"why_not":["Эти две функции связаны с результатом по правилу золотой середины: и избыток, и недостаток снижают пользу.","Забота подходит, но эмоциональная стимуляция полезна только в меру: слабая даёт вялую группу, сильная - перегруженную эмоциями атмосферу.",null],"explanation":"Смысловая атрибуция - это объяснение: ведущий помогает перевести чувства и переживания в мысли и объясняет происходящее. Лучших результатов добивались ведущие с щедрой заботой и объяснением и умеренными стимуляцией и управлением.","source":"Ялом, «Групповая психотерапия», гл. 14, результаты исследования групп встреч, с. 521 - по конспекту","quote":"Чем выше уровень заботы и смысловой атрибуции, тем выше позитивность результата","by_record":false,"h":"e0d527c5"},{"id":"m2-ya-14-04","module":2,"topic":"Риск и польза в группе","kind":"знание","question":"Что исследование групп встреч показало о связи риска и пользы?","options":["Высокий результат требует высокого риска","Риск не связан с ростом, пользу давали безопасные группы","Риск оказался небольшим, травм почти не было"],"correct":1,"why_not":["Именно эту установку групп встреч Ялом по данным исследования называет мифом.",null,"Наоборот, риск назван значительным: 16 из 210 участников (8%) пережили психологическую травму с последствиями, которые сохранялись и через полгода."],"explanation":"По данным исследования, установку, что высокий результат требует высокого риска, пришлось пересмотреть: риск в группах встреч значителен, но платой за рост он не был - продуктивными оказались безопасные группы.","source":"Ялом, «Групповая психотерапия», гл. 14, сходство обучающих условий, с. 534-537 - по конспекту","quote":"риск в группе встреч значителен и не связан с позитивным ростом». Продуктивными были безопасные группы","by_record":false,"h":"6b8d3d54"},{"id":"m2-ya-15-01","module":2,"topic":"Супервизия новичков","kind":"знание","question":"Что показало исследование двенадцати непрофессионалов, которые вели группы в психиатрической больнице?","options":["Обе половины выросли одинаково: главное - сама практика","Без супервизора росли быстрее, потому что учились сами","С супервизией росли, без неё часть навыков утратили"],"correct":2,"why_not":["Вывод исследования прямо противоположный: «опыта в чистом виде недостаточно».","Неподготовленные через шесть месяцев не выросли, а утратили часть первичных навыков. Ялом добавляет, что без руководства первые ошибки закрепляются повторением.",null],"explanation":"Половина ведущих работала с супервизором и прошла курс группового лидерства, половина - нет. Наблюдатели, не знавшие, кто есть кто, оценили их в начале и через полгода: росли только те, у кого было руководство.","source":"Ялом, «Групповая психотерапия», гл. 15, руководство (супервизорство), с. 552 - по конспекту","quote":"подготовленные совершенствовались, неподготовленные через полгода утратили часть первичных навыков","by_record":false,"h":"3b993b90"},{"id":"m2-ya-15-02","module":2,"topic":"Ведущий обучающей группы","kind":"знание","question":"Кто, по Ялому, лучше подходит на роль ведущего обучающей группы для стажёров-терапевтов?","options":["Опытный специалист, который не будет оценивать стажёров","Старший преподаватель программы: его авторитет задаёт серьёзность","Мастер узкого метода, например гештальта или ТА"],"correct":0,"why_not":[null,"Свой опыт в двойной роли Ялом оценивает как весьма ограниченный успех: заверений в конфиденциальности или нейтралитете недостаточно, когда ведущий ещё и оценивает.","Первый групповой опыт, по Ялому, не должен быть высокоспециализированным методом: такие подходы нацелены на работу один на один и не дают базовых представлений о групповой динамике."],"explanation":"Ведущий - ролевая модель, ему нужны высокие профессиональные качества и большой групповой опыт. Группа работает эффективнее, если он не входит в число старших сотрудников и не будет оценивать участников.","source":"Ялом, «Групповая психотерапия», гл. 15, должен ли ведущий быть рядовым или старшим сотрудником, с. 559 - по конспекту","quote":"группа эффективнее, если ведущий не входит в число старших сотрудников и не будет оценивать студентов","by_record":false,"h":"6e8f8d22"},{"id":"m3-zh-01","module":3,"topic":"Желание как активность","kind":"знание","question":"Как авторы «Жизни вместе с желанием» предлагают смотреть на желание, если говорить строго о процессе?","options":["Как на постоянное свойство человека, вроде рук или ног","Как на активность, которую мы совершаем, поэтому оно меняется","Как на биологический драйв, который лучше всего виден по его объектам"],"correct":1,"why_not":["Авторы прямо отвергают такой взгляд: у человека нет «желания» в том смысле, как у него есть руки или ноги.",null,"Биологически основанные драйвы и объекты желаний авторы сознательно оставляют в стороне. Их интересует сам процесс желания."],"explanation":"С точки зрения процесса желание - не вещь, а действие, как прикосновение или ходьба, поэтому оно постоянно меняется. Взгляд на желание как на «событие» или запас энергии авторы тоже признают верным - в своём контексте.","source":"Джозеф Мельник, Соня Невис, Глория Мельник, «Жизнь вместе с желанием», вступление","quote":"Желание - это активность. Это то, что мы совершаем, как прикасаемся или идем. Как следствие, желание постоянно меняется.","by_record":false,"h":"1418e3f8"},{"id":"m3-zh-02","module":3,"topic":"Касабланка: Рик и Ильза","kind":"знание","question":"Чем, по авторам, заканчивается история желания Рика в финале «Касабланки»?","options":["Он гасит любовь к Ильзе и перестаёт о ней тосковать","Он становится безучастным, чтобы боль оставалась переносимой","Он живёт с неутолённой любовью как с дорогой сердцу потерей"],"correct":2,"why_not":["Авторы подчёркивают обратное: взаимное желание Рика и Ильзы фактически остаётся неизменным, Рик учится с ним жить.","Таким Рик был в середине истории, хозяином кафе в Касабланке: старался казаться равнодушным и вкладывал всю энергию в сдерживание желания. В финале он больше не безучастный.",null],"explanation":"Узнав правду о том, почему Ильза ушла, Рик смог зрело выбрать между двумя несовместимыми желаниями. Неутолённая любовь не исчезла, но перестала искажать его характер и разрушать жизнь.","source":"Джозеф Мельник, Соня Невис, Глория Мельник, «Жизнь вместе с желанием», раздел «Ильза и Рик: история желания»","quote":"Теперь Рик может играть роль в Сопротивлении и жить с неутоленной любовью, не только справляясь с ней, но и ассимилируя ее как дорогую сердцу потерю","by_record":false,"h":"82e17391"},{"id":"m3-zh-03","module":3,"topic":"Как возникают желания","kind":"знание","question":"Что, по авторам, нужно ребёнку, чтобы у него вообще могли возникнуть желания?","options":["Растущая способность отделять себя от окружающего мира","Сильные импульсы, которыми ребёнок ведом с самого рождения","Абстрактные цели, которые появляются к подростковому возрасту"],"correct":0,"why_not":[null,"Импульсами ведомы младенцы, и сложные желания для них почти не существуют: они и есть свои потребности. Для возникновения желаний, по авторам, нужна способность отделять себя от мира.","Абстрактные желания - следующая ступень. К подростковому возрасту уже существующие желания становятся шире, а не впервые появляются."],"explanation":"Пока младенец почти не ощущает себя отдельным от среды, он живёт простыми потребностями. Когда мир начинает делиться на «я» и «не я», появляются желающий и объект желания, а вместе с ними желание.","source":"Джозеф Мельник, Соня Невис, Глория Мельник, «Жизнь вместе с желанием», развитие желания: от простых желаний к сложным","quote":"Эта возрастающая способность к дифференциации необходима для нормального детского развития. Она также требуется для возникновения желаний.","by_record":false,"h":"d3881caa"},{"id":"m3-zh-04","module":3,"topic":"Мэри Энн: эволюция простого желания","kind":"знание","question":"Мэри Энн в детстве часами разглядывала конфеты в витрине и обещала себе, что вырастет и купит сколько захочет. Что она делает с красивыми конфетами теперь, когда может себе это позволить?","options":["Покупает помногу и ест, как обещала себе в детстве у витрины","Обычно дарит друзьям, а сама редко ест больше одной","Перестала покупать и не вспоминает ту витрину"],"correct":1,"why_not":["Авторы пишут, что теперь она может есть сколько хочет, но редко это делает.",null,"Она любит рассказывать друзьям историю о магазине конфет и в эти моменты будто снова соединяется с давней жаждой."],"explanation":"Простое детское желание со временем изменилось. Авторы не дают одного ответа почему: может, она превратила страсть в подарки другим, а может, лёгкая доступность конфет изменила само желание.","source":"Джозеф Мельник, Соня Невис, Глория Мельник, «Жизнь вместе с желанием», случай Мэри Энн","quote":"когда она действительно покупает красивые конфеты, то обычно дарит их друзьям, редко съедая больше чем одну.","by_record":false,"h":"8539e043"},{"id":"m3-zh-05","module":3,"topic":"Джон: противоречивые желания","kind":"знание","question":"Джон пять лет успешно руководил организацией, которая раздавала еду бедным, и внезапно уволился. Как авторы объясняют, что с ним произошло?","options":["Он нарушил первый же из пяти принципов и сдержал слово уйти на следующий день","Организация провалила миссию, и он ушёл вслед за провалом","Его мораль вступила в конфликт с нуждой добывать деньги для бедных"],"correct":2,"why_not":["Джон нарушил не один, а три из пяти принципов и при этом долго оставался на посту. Он и сам не мог объяснить почему.","Организация, наоборот, процветала, поэтому люди и были поражены его уходом.",null],"explanation":"Противоречивые желания, по авторам, не живут в равновесии, а борются за первенство. У Джона победило чувство нравственности, но потенциально большой ценой для других, и он ушёл в меньшей ясности, чем начинал.","source":"Джозеф Мельник, Соня Невис, Глория Мельник, «Жизнь вместе с желанием», случай Джона","quote":"Его потребность в следовании моральным ориентирам вступила в конфликт с необходимостью изыскивать деньги для бедных.","by_record":false,"h":"a29f22f9"},{"id":"m3-zh-06","module":3,"topic":"Культурные рамки желания","kind":"знание","question":"Какую ошибку западной культуры в обращении с желанием называют авторы?","options":["Акцент на объекте желания, а не на самом процессе желания","Чрезмерный интерес к желанию как к живому изменчивому процессу","Запрет двигаться к желанию: учат только воздержанию"],"correct":0,"why_not":[null,"Авторы пишут обратное: в нашей культуре нас не учат интересоваться желанием как процессом с его динамической жизнью.","Западная культура, по авторам, учит «танцу из двух движений»: двигаться либо к желанию, либо от него. Воздержание - только одно из этих движений."],"explanation":"Мы учимся проецировать желания на мир и добиваться их, а удовлетворение ждём в момент победы. Авторы считают, что то, как мы живём с желаниями и учимся у них, не менее важно, чем успех или неудача.","source":"Джозеф Мельник, Соня Невис, Глория Мельник, «Жизнь вместе с желанием», культурные рамки","quote":"большую роль играют объекты желания, а не постоянный процесс этого желания. Мы совершаем ошибку, делая акцент на фигуре, при этом значительно игнорируя фон.","by_record":false,"h":"9f6f6218"},{"id":"m3-zh-07","module":3,"topic":"Гештальт 60-70-х и желание","kind":"знание","question":"В чём авторы видят ошибку популярной гештальт-терапии 1960-70-х годов в работе с желанием?","options":["В упоре на прошлое и на приспособление к жизни, какая она есть","В выделении узкой фигуры, хотя переменам нужен богатый фон","В требовании воздерживаться от аппетитов и следовать правилам"],"correct":1,"why_not":["Акцент на прошлое и ценность приспособления к жизни, какая она есть, - это черты психоанализа из соседней статьи «Оптимизм» Джозефа Мельника и Сони Невис: с ним столкнулись основатели гештальта. А в этой статье сказано, что Перлз придавал большое значение проживанию жизни в настоящем.",null,"Воздержание и набор интроецированных правил авторы описывают в культуре исцеления, например в двенадцати шагах АА. Гештальт 60-х, напротив, делал упор на удовлетворение краткосрочных желаний."],"explanation":"Тогдашняя модель была простой: осознал потребность, мобилизовал энергию, удовлетворил и перешёл к следующей. Авторы пишут, что долгосрочные изменения требуют большего - развития богатого фона, то есть всего, что остаётся за пределами текущей фигуры внимания.","source":"Джозеф Мельник, Соня Невис, Глория Мельник, «Жизнь вместе с желанием», гештальт-терапия 60-х и 70-х годов","quote":"Если оглянуться назад, то было ошибочно выделять узкую фигуру для достижения хорошего психологического здоровья. Сейчас мы понимаем, что долгосрочные изменения требуют гораздо большего.","by_record":false,"h":"a967eb44"},{"id":"m3-zh-08","module":3,"topic":"Сложные желания","kind":"знание","question":"Как, по авторам, гештальт-подход в полном виде, а не только в практике 60-70-х, учит обходиться со сложными желаниями?","options":["Отыграть потребность здесь и сейчас, снять напряжение и прийти к закрытию","Дать ясную инструкцию, двигаться ли к желанию или прочь от него","Осознавать сам процесс желания, не стремясь достичь или избежать"],"correct":2,"why_not":["Это модель 60-х: снизить напряжение и достичь закрытия. Авторы пишут, что для сложных желаний завершение - в лучшем случае упрощение, а в худшем миф.","Авторы подчёркивают, что эта перспектива не даёт инструкций, двигаться ли навстречу жажде или прочь от неё. Она учит по-другому видеть желания.",null],"explanation":"Сложные желания возвращаются снова и снова, и закрыть их раз и навсегда не выходит. Гештальт-подход, созданный не только Перлзом, но и Гудманом, Левином и Бубером, по авторам, ближе к восточному взгляду: быть осознанным и заинтересованным в самом процессе желания.","source":"Джозеф Мельник, Соня Невис, Глория Мельник, «Жизнь вместе с желанием», сложные желания","quote":"Мы учимся быть осознанными и заинтересованными в самом процессе желания - не в его достижении или избегании.","by_record":false,"h":"e1477511"},{"id":"m3-zh-09","module":3,"topic":"Джейн: преобразованное желание","kind":"знание","question":"Джейн 15 лет тоскует о близости, которой нет в её браке. Как авторы описывают место этой тоски в её жизни сейчас?","options":["Тоска стала частью фона: она принята, но не в центре внимания","Тоска ушла, и обделённой Джейн себя больше не чувствует","Тоска стала главной фигурой, вокруг которой строится каждый день"],"correct":0,"why_not":[null,"На вопрос, чувствует ли она себя обделённой, авторы отвечают: «громкое да». Утратил актуальность другой вопрос - была бы её жизнь лучше, если бы близость с мужем наладилась.","Авторы прямо пишут, что это не вся она и не центр её повседневного внимания."],"explanation":"Джейн испробовала всё, что допускали её моральные границы, и стала искать заботу у друзей. Тоска осталась, но стала ассимилированной, то есть принятой и частично переработанной частью её самой, «колючей ниткой» в ткани жизни.","source":"Джозеф Мельник, Соня Невис, Глория Мельник, «Жизнь вместе с желанием», случай Джейн","quote":"Можно сказать, что ее тоска стала частью того, кто она; тем, что гештальтисты называют фоном","by_record":false,"h":"9f1250c4"},{"id":"m3-zh-10","module":3,"topic":"Джим: угасшее желание","kind":"знание","question":"Джим с юности считал свою обсессивность плохой и мечтал стать спонтанным. Что изменилось в этом желании в ходе терапии?","options":["Он переделал характер и стал спонтанным, как хотела жена","Он увидел плюсы своего стиля, и желание стать другим ослабло","Он нашёл круг людей, ценящих его стиль, и риск срыва миновал"],"correct":1,"why_not":["Авторы описывают обратное: Джим оставил желание быть спонтанным и подружился со своей одержимостью. Дальше он, по авторам, может ценить плюсы своего стиля и понемногу менять себя: чуть меньше тревоги, чуть больше спонтанности.",null,"Такой системы поддержки у него, в отличие от Джейн, ещё нет. Поэтому авторы пишут, что он рискует вернуться к отвращению к себе."],"explanation":"Джим понял, что обсессивность помогает ему как юристу и уравновешивает импульсивность жены. Замечая полярности, то есть связь противоположных черт, он увидел минусы спонтанности и плюсы обсессивности, и желание быть другим стало уменьшаться.","source":"Джозеф Мельник, Соня Невис, Глория Мельник, «Жизнь вместе с желанием», случай Джима","quote":"Это позволило ему оставить свое желание быть спонтанным и подружиться со своей одержимостью.","by_record":false,"h":"ea7f3bb7"},{"id":"m3-zh-11","module":3,"topic":"Джордж: желание и сожаление","kind":"знание","question":"Джордж неделю решал, остаться ли с первой любовью, которую встретил через 25 лет. Что его поразило за эти дни?","options":["Что это лишь флирт с прошлым, ради которого и ходят на встречи выпускников","Что верный выбор снимет сожаление, если только решиться на него","Что потерей обернётся любое движение к ней или от неё, и даже бездействие"],"correct":2,"why_not":["Флирт с прошлым был в начале вечера. Потом, вопреки обычному, они стали общаться в настоящем: он увидел, какой она стала за эти годы.","Джордж понимает, что пожалеет в обоих случаях: и если они будут вместе, и если нет. Любое решение принесёт и радость, и печаль.",null],"explanation":"Дело было не в выборе между «к» и «от», удовлетворением и разочарованием. Джордж осознал, что потеря неизбежна при любом шаге, а если ничего не делать, своё сделает время, и назвал своё чувство «горько-сладким».","source":"Джозеф Мельник, Соня Невис, Глория Мельник, «Жизнь вместе с желанием», случай Джорджа","quote":"Он был поражен осознанием, что любое движение к ней или от нее, позитивное или негативное, приведет к потере.","by_record":false,"h":"763bfe68"},{"id":"m3-zh-12","module":3,"topic":"Окончания: ассимиляция","kind":"знание","question":"Что, по разделу «Окончания», даёт человеку возможность двигаться дальше?","options":["Достижение желания или неудача, если они как следует ассимилированы","Только достижение: удовлетворённая потребность уходит в фон, и приходит новая","Отказ хотеть: чем меньше желаний, тем свободнее человек"],"correct":0,"why_not":[null,"Так выглядит парадигма гештальта 60-х, которую авторы считают узкой. Здесь они пишут, что двигаться дальше можно и после неудачи.","Авторы пишут обратное: желание - наш биологический императив организации опыта, «мы должны хотеть»."],"explanation":"Ассимиляция - переработка опыта, после которой он становится частью тебя. После неё, по авторам, фон обогащается и мы становимся мудрее, а итогом, как они надеются, становится более сложное и зрелое переживание себя и других.","source":"Джозеф Мельник, Соня Невис, Глория Мельник, «Жизнь вместе с желанием», окончания","quote":"Достижение желания или неудача в достижении желания - одно из двух, должным образом ассимилированное - дает нам возможность двигаться дальше.","by_record":false,"h":"0b7d01ed"},{"id":"m3-op-02","module":3,"topic":"Полюса: оптимизм и пессимизм","kind":"знание","question":"Как Джозеф Мельник и Соня Невис описывают пессимизм в сравнении с оптимизмом?","options":["Пессимизму человек учится, а с оптимизмом уже рождается","Сужает, а не расширяет, и смотрит в прошлое, а не в будущее","Это вредная ориентация, и в здоровой жизни ей не место"],"correct":1,"why_not":["Авторы пишут, что мы рождаемся с обеими тенденциями: со способностью тянуться к неизвестному и с полярной ей тенденцией пессимизма.",null,"По авторам, обе ориентации имеют свои подходящие места в жизни каждого. Исключительно оптимистичную позицию они называют в лучшем случае наивной."],"explanation":"Оптимизм и пессимизм - два полюса одной оси. Пессимистический процесс напряжённый, а не расслабленный, трусливый, а не мужественный, и обращён к прошлому.","source":"Джозеф Мельник, Соня Невис, «Оптимизм», раздел «Оптимизм/пессимизм»","quote":"Вместо того, чтобы расширять, пессимистический процесс сужает. Он напряженный, а не расслабленный, трусливый, а не мужественный, ориентированный на прошлое, а не на будущее.","by_record":false,"h":"7170445b"},{"id":"m3-op-03","module":3,"topic":"Фокус на хорошем функционировании","kind":"знание","question":"Авторы 25 лет учили парной и семейной терапии в кейп-кодской программе. Какой поворот в работе с клиентами они называют революционным?","options":["Показать людям, что они делают не так, чтобы они сами себя исправили","Замечать негатив и перефразировать его в положительную сторону","Замечать признаки хорошего функционирования и поддерживать их"],"correct":2,"why_not":["Это как раз то убеждение, которое авторам пришлось поставить под сомнение: будто, узнав о своих ошибках, люди сами себя исправят.","В сноске авторы прямо оговаривают: они имеют в виду не это, а переориентацию на веру в то, что люди всегда делают всё лучшее, что в их силах.",null],"explanation":"Клиенты подробно рассказывают о плохом и вскользь о хорошем. Авторы научились поворачивать внимание к тому, что у людей уже получается: помочь им осознать, что они делают, и взять за это ответственность - часто всё, что нужно для положительных изменений.","source":"Джозеф Мельник, Соня Невис, «Оптимизм», бэкграунд авторов","quote":"Вместо этого мы научились фокусироваться на признаках хорошего функционирования и поддерживать их","by_record":false,"h":"0a5769ae"},{"id":"m3-op-04","module":3,"topic":"Дамасио: тело и мышление","kind":"знание","question":"Авторы приводят данные Дамасио о связи тела и мышления. Каким становится мышление, когда состояние тела сдвигается к болезненному?","options":["Медленным и склонным к повторению","Быстрым, живым и богатым на идеи","Более реалистичным и точным в оценках"],"correct":0,"why_not":[null,"Так Дамасио описывает мышление при позитивном, приятном состоянии тела.","Реалистичность и точность - вывод Селигмана о пессимистах, который авторы приводят в сноске. К данным Дамасио о теле это не относится."],"explanation":"Отсюда, по авторам, «жестокая шутка»: неприятное тянется долго и забирает внимание, а приятное пролетает незаметно. Поэтому положительные эмоции трудно достичь и удержать.","source":"Джозеф Мельник, Соня Невис, «Оптимизм», психотерапия: создание оптимизма","quote":"медленными движениями и повторением, когда состояние тела движется в сторону болезненной части","by_record":false,"h":"5aa98778"},{"id":"m3-op-05","module":3,"topic":"Психотерапия как создание оптимизма","kind":"знание","question":"Почему, по авторам, занятие психотерапией оптимистично по самому определению?","options":["Клиенты приходят с крепкой верой, что им обязательно помогут","Её цель - среда, где клиент видит новые возможности","Терапевт быстро уводит клиента от боли к надежде"],"correct":1,"why_not":["Авторы пишут обратное: оптимизм клиентов к началу терапии обычно хрупкий, и многие втайне верят, что им нельзя помочь.",null,"Авторы ставят это как вопрос терапевту к себе: не обращаемся ли мы слишком быстро к надежде, отводя клиента от законной боли и печали из-за контрпереноса - своих чувств в ответ на клиента."],"explanation":"Терапия подпитывается верой, что всё может быть по-другому и лучше. Первый способ терапевта поддержать оптимизм - присутствовать при всём, что возникает, и не отстраняться: так создаётся «безопасная чрезвычайная ситуация», где боль встречает поддержку.","source":"Джозеф Мельник, Соня Невис, «Оптимизм», психотерапия: создание оптимизма","quote":"Первоочередной целью является создание среды, наполненной возможностями, в которой клиент, исследуя свой мир, может сосредоточиться на новых возможностях. Таким образом, по определению, занятие психотерапией является оптимистическим.","by_record":false,"h":"7946915b"},{"id":"m3-op-06","module":3,"topic":"Западная психотерапия и психоанализ","kind":"знание","question":"До гуманистического движения западная психотерапия была сосредоточена на негативном. Какой проблеск оптимизма авторы всё же видят в традиционном психоанализе?","options":["Человек не формируется окончательно и может перестроиться в любом возрасте","Внимание к росту, компетентности и самореализации вместо диагноза","Понимая прошлое, можно изменить будущее"],"correct":2,"why_not":["Традиционный психоанализ, по авторам, считает наоборот: мы почти полностью формируемся к пяти годам, а остаток жизни приспосабливаемся к этому.","Эти слова вошли в терапевтическую литературу с гуманистическим движением, которое сменило «археологический» подход психоанализа.",null],"explanation":"Психоанализ даёт не много надежд, но в историческом контексте он бросил вызов вере в то, что история - это всегда судьба. Понимание прошлого, по нему, помогает легче приспособиться к неопределённому будущему.","source":"Джозеф Мельник, Соня Невис, «Оптимизм», западная психотерапия","quote":"Мы можем изменить будущее, понимая прошлое.","by_record":false,"h":"e52d369f"},{"id":"m3-op-07","module":3,"topic":"Позитивная психология: жизнестойкость","kind":"знание","question":"Среди направлений позитивной психологии авторы выделяют изучение жизнестойкости. Что обнаружили Вернер и Смит, наблюдая детей из неблагополучных семей?","options":["Больше 40 процентов функционируют нормально, ещё 10 процентов - выше среднего","Около 10 процентов функционируют нормально, остальные несут след неблагополучия","Неудачи в юности у этих детей, как правило, ведут к неудачам в зрелости"],"correct":0,"why_not":[null,"10 процентов в исследовании - это те, кто набирает баллов даже больше среднего, сверх 40 процентов нормально функционирующих.","Исследователи обнаружили обратное: неудачи подростков и молодых людей, как правило, не приводили к неудачам в более поздние годы, многие стали сильнее."],"explanation":"Жизнестойкость - способность выстоять в неблагоприятных обстоятельствах. Этот взгляд изучает не то, что ведёт к срыву, а качества людей и среды, которые помогают справиться: например, поддерживающего взрослого рядом.","source":"Джозеф Мельник, Соня Невис, «Оптимизм», позитивная психология","quote":"более 40 процентов детей, которые происходят из неблагополучных семей ... функционируют нормально","by_record":false,"h":"9a4c3d00"},{"id":"m3-op-08","module":3,"topic":"Оптимисты и пессимисты","kind":"знание","question":"Как, по исследованиям Селигмана, пессимисты объясняют себе свою боль?","options":["Боль временна, и виноваты в ней отчасти обстоятельства и другие","Плохое продлится долго, и отвечают за него прежде всего сами","Боль - часть общего поля, а не только их личное дело"],"correct":1,"why_not":["Так, по Селигману, рассуждают оптимисты: их боль временна, а вина хотя бы частично на обстоятельствах и других.",null,"Авторы пишут, что у пессимистов индивидуальная перспектива, а не перспектива поля."],"explanation":"Главный вывод Селигмана: оптимизм - не врождённая неизменная черта, ему можно учиться. Оптимизм и пессимизм он называет «привычками мышления», а пессимизм связывает с беспомощностью и застреванием.","source":"Джозеф Мельник, Соня Невис, «Оптимизм», оптимисты и пессимисты","quote":"Отличительной чертой пессимизма является вера в то, что плохие события будут длиться долго. ... Пессимисты считают, что они в первую очередь несут ответственность за свою боль и страдания.","by_record":false,"h":"293455d5"},{"id":"m3-op-09","module":3,"topic":"Теория Селигмана глазами гештальта","kind":"знание","question":"Авторы во многом согласны с Селигманом, но считают, что его теорию стоит расширить. Чего ей, по их мнению, не хватает?","options":["Внимания к окружающему полю: отношениям, семье, обществу","Опоры на исследования: она интуитивна, но плохо доказана","Интереса к тому, как человек ведёт «разговор с собой»"],"correct":0,"why_not":[null,"Авторы пишут, что его подход опирается на широкий фундамент исследований. Простоту и интуитивность они называют его достоинством.","Здесь авторы с Селигманом согласны: как и его, их интересует, как каждый человек ведёт «разговор с собой»."],"explanation":"Поле - это вся среда вокруг человека, в которой он живёт. По авторам, теория Селигмана мало учитывает эмоции, среду здесь и сейчас, отношения с равными, семьёй, обществом и терапевтом.","source":"Джозеф Мельник, Соня Невис, «Оптимизм», теория Селигмана","quote":"Короче говоря, он недооценивает важность окружающего поля.","by_record":false,"h":"7e80d325"},{"id":"m3-op-10","module":3,"topic":"Пессимистический стиль в гештальте","kind":"знание","question":"Как гештальт-подход, по авторам, смотрит на «пессимистический стиль» человека?","options":["Как на когнитивное искажение, которое надо заменить реалистичными мыслями","Как на патологическую попытку избежать контакта с миром","Как на лучшее возможное решение для определённых условий поля"],"correct":2,"why_not":["Это ближе к подходу Селигмана. Авторы пишут, что гештальтисты смотрят не на когнитивное искажение, а на весь эмоциональный и физический процесс.","Сопротивление, или стиль контакта, гештальт считает здоровым: это не патологическая попытка избежать контакта, а способ, который когда-то был лучшим для жизни в своём окружении.",null],"explanation":"Убеждение «плохое случается со мной» когда-то могло защищать человека от уязвимости и ложной надежды. Проблемой такой стиль становится, когда остаётся привычным вне того контекста, где был полезен.","source":"Джозеф Мельник, Соня Невис, «Оптимизм», оптимизм и гештальт-терапия","quote":"Таким образом, мы рассматриваем «пессимистический стиль» как наилучшее возможное решение для определенных условий поля.","by_record":false,"h":"e57ab96c"},{"id":"m3-op-11","module":3,"topic":"Неопределённость","kind":"знание","question":"Как гештальт-подход, по авторам, относится к неопределённости?","options":["Как к помехе росту, которую процессный взгляд сводит к минимуму","Как к факту жизни: неопределённость и есть сама жизнь","Как к тому, что терапевт снимает, найдя причину и следствие"],"correct":1,"why_not":["Авторы пишут обратное: приверженность процессной перспективе - это приверженность неопределённости, будущее при ней открыто и полно непредсказуемых возможностей.",null,"Подход гештальтистов, по авторам, не основан на причинах и последствиях: ситуацию нельзя контролировать и нельзя заставить что-то произойти."],"explanation":"Все ситуации новые и требуют хотя бы маленькой творческой адаптации - подстройки к среде. Будущее нельзя знать точно, поэтому оно всегда удивительно, если только обратить внимание.","source":"Джозеф Мельник, Соня Невис, «Оптимизм», практические последствия","quote":"Гештальт воспринимает неопределенность как факт жизни. ... Мало того, что жизнь наполнена неопределенностью, неопределенность - это сама жизнь.","by_record":false,"h":"f20a3da5"},{"id":"m3-op-12","module":3,"topic":"Агрессия как позитивная сила","kind":"знание","question":"Как гештальтисты, по статье «Оптимизм», понимают агрессию?","options":["Как позитивную силу: действие, с которым мы движемся в будущее","Как реакцию «бей или беги», плохо подходящую современному миру","Как то, что гасит оптимизм, поэтому её лучше сдерживать"],"correct":0,"why_not":[null,"«Бей или беги» - физиологическая программа, которую авторы считают плохо подходящей для мира постоянных стимулов. Агрессию как позитивную силу они описывают отдельно.","Авторы приводят обратную мысль эволюционных психологов: это слишком большой оптимизм гасит нашу агрессивность и мешает мобилизоваться против угрозы."],"explanation":"Агрессия здесь - это действие, которое строит настоящее и переводит его в прошлое, пока мы движемся вперёд. Веру в движение с этой энергией в неизвестное будущее авторы называют сущностью гештальт-подхода.","source":"Джозеф Мельник, Соня Невис, «Оптимизм», практические последствия","quote":"Гештальтисты принимают концепцию агрессии как позитивной силы. Агрессия - это действие, которое помогает нам строить настоящее и перемещать настоящее в прошлое по мере того, как мы движемся в будущее.","by_record":false,"h":"66c98bdb"},{"id":"m3-zp-01","module":3,"topic":"Невроз «послезавтра»","kind":"знание","question":"На сессии говорили о неврозе «послезавтра»: человек надеется, что всё изменится само. В чём назвали суть этого невроза?","options":["В привычке снова и снова замечать то, что в системе «хорошо развито»","В экзистенциальной тревоге, которую человек проживает в полную силу","В невозможности опереться на то, что есть, и порадоваться этому"],"correct":2,"why_not":["Это, наоборот, основная задача работы с «хорошо развитым»: многократно обращать на него внимание, чтобы увидеть в нём опору и ресурс.","На сессии говорили обратное: люди избегают экзистенциальной тревоги и заменяют её маленькой, но «хорошей» тревогой.",null],"explanation":"Вместо того чтобы видеть то, что есть, человек живёт надеждой на будущие перемены: «он изменится», «он подтянется». Задача, по записи, - заметить то, что есть, и научиться на это опираться.","source":"Запись сессии 17.04.2026, раздел про невроз «послезавтра»","quote":"Суть невроза - невозможность опереться на то, что есть, и возрадоваться этому.","by_record":true,"h":"7e337a20"},{"id":"m3-zp-02","module":3,"topic":"Смолток и контрактинг","kind":"знание","question":"Перед работой консультантов с системой на сессии советовали проводить контрактинг. Чем он, по сути, является?","options":["Инструктажем о предстоящей работе, который снижает тревогу","Переговорами, в которых участники меняют правила под себя","Лёгким человеческим разговором, где люди помечают территории"],"correct":0,"why_not":[null,"На сессии подчёркивали: это не полноценное соглашение, где можно что-то изменить или договориться. Как инструктаж в самолёте - правила не обсуждают, но знание снижает тревогу.","Это смолток - короткое человеческое общение перед работой. Он помогает разрядить эмоции, обозначить статусы и обменяться информацией."],"explanation":"Консультанты заранее рассказывают, что будет: участники поговорят, консультанты отойдут, потом прервут, поделятся одним наблюдением и спросят отклик. Такая предсказуемость действует противотревожно.","source":"Запись сессии 17.04.2026, раздел про смолток и контрактинг","quote":"Это не полноценное соглашение, где можно что-то изменить или договориться. Это скорее предупреждение о том, что будет происходить, и имеет мощный противотревожный эффект.","by_record":true,"h":"e96c011d"},{"id":"m3-zp-03","module":3,"topic":"Работа консультантов: поддерживающая интервенция","kind":"знание","question":"На сессии рассказали случай: около часа участницы встречи топ-менеджеров кричали друг на друга. Одна фраза консультанта изменила динамику. Какая?","options":["«Давайте говорить по очереди, иначе мы ничего не успеем»","«Как же вы неравнодушны к общему делу!»","«Похоже, у вас глубокий конфликт, давайте его вскроем»"],"correct":1,"why_not":["Консультант не пытался остановить крики директивно. Он назвал происходящее, но в поддерживающем ключе.",null,"На сессии говорили, что консультант не должен «вскрывать» глубинные проблемы. Его задача - помочь системе принять своё «хорошо развитое» в позитивном смысле."],"explanation":"Консультант увидел в хаотичной энергии страсть и заинтересованность в компании и назвал это без осуждения. Участницы затихли, а вторая часть сессии, вдвое короче первой, прошла продуктивно.","source":"Запись сессии 17.04.2026, раздел про особенности работы консультантов","quote":"не пытался их остановить директивно. Он назвал то, что происходит, но не в осуждающем, а в поддерживающем ключе.","by_record":true,"h":"d272931d"},{"id":"m3-zp-04","module":3,"topic":"Принципы работы с системой","kind":"знание","question":"Какой главный принцип работы консультанта с парой или малой группой в кейп-кодской модели назвали на сессии?","options":["Разобрать содержание претензий: кто прав, а кто виноват","Разобрать с каждым участником его личную проблему","Заинтересовать систему самой собой"],"correct":2,"why_not":["Это названо ошибкой: попытка разрулить отношения через содержание конфликтов обречена на провал. Первый принцип - не работать с содержанием и не давать советов, как надо.","Второй принцип говорит обратное: работать с системой, а не с отдельными людьми, держать фокус на динамике пары, тройки или группы.",null],"explanation":"Цель - чтобы участники начали думать о «мы»: что мы делаем и как это работает. Когда консультант предлагает некритикующие объяснения того, ради чего сложилось то, что есть, система воспринимает это как поддержку.","source":"Запись сессии 17.04.2026, раздел про принципы работы с системой","quote":"В работе с малыми группами (пары, тройки, четверки) в гештальт-подходе (особенно в кейп-код модели) главный принцип - заинтересовать систему самой собой.","by_record":true,"h":"895b1b6d"},{"id":"m4-ne-01-01","module":4,"topic":"Фигура и фон: ригидность восприятия","kind":"знание","question":"Эдвин Невис пересказывает находку датского психолога Рубина о фигуре и фоне. Что происходит со сформированной фигурой?","options":["Она быстро тускнеет и уходит в фон, освобождая место новой","Она сопротивляется изменениям: люди скорее видят прежнее","Она распадается на части, и человек начинает видеть отдельные элементы"],"correct":1,"why_not":["Фигура тускнеет, когда внимание уходит на другое, как в примере с паутиной. Но это разрушение фигуры, а находка Рубина - про устойчивость уже сложившейся фигуры.",null,"Про части Невис пишет другое: человек сначала видит целое, например квадрат, и лишь потом может «разложить» его на четыре линии. Находка Рубина - об устойчивости сложившейся фигуры."],"explanation":"Фигура - то, что выделяется на фоне и притягивает внимание. Сложившаяся фигура держится: позднее люди видят примерно то же, что и раньше, поэтому на знакомое трудно взглянуть свежим взглядом.","source":"Эдвин Невис, «Организационное консультирование», гл. 1, ранние исследования зрительного восприятия","quote":"Фактически, как показал датский психолог Рубин, сформированные фигуры склонны сопротивляться изменениям. Позднее люди скорее увидят примерно то, что видели ранее","by_record":false,"h":"949287dd"},{"id":"m4-ne-01-02","module":4,"topic":"Закон прегнантности и замкнутость","kind":"знание","question":"Принцип замкнутости Эдвин Невис считает особым проявлением закона прегнантности. Какую задачу организационного консультирования он с ним связывает?","options":["Помогать людям замечать мелкие неровности, которые психика сглаживает","Помогать людям отпустить прошлое, чтобы опираться только на настоящее","Помогать людям справляться с незавершёнными ситуациями"],"correct":2,"why_not":["Опыты Коффки и Келера, где небольшая неровность не замечается, Невис приводит как иллюстрацию прегнантности, но задачей консультанта это не называет.","Прошлое, по Левину, действует через то, как его осознают сейчас. Ясное осознавание настоящего помогает понять, как лучше использовать прошлые навыки, а не отказаться от них.",null],"explanation":"Прегнантность - стремление психики к «хорошей», простой и законченной форме. Люди не успокаиваются, пока не завершат начатое, а незавершённая фигура остаётся «незавершённой ситуацией», поэтому консультант помогает с такими ситуациями справляться.","source":"Эдвин Невис, «Организационное консультирование», гл. 1, закон прегнантности","quote":"один из наиболее важных аспектов организационного консультирования состоит в том, чтобы помочь людям научиться справляться с незавершенными ситуациями, в которых они увязли или чувствуют себя заблокированными.","by_record":false,"h":"a9e42737"},{"id":"m4-ne-01-03","module":4,"topic":"Ложное разрешение","kind":"знание","question":"Группа менеджеров улучшает методы производства, чтобы поднять качество продукта, а реальная проблема в плохом сырье. Как Эдвин Невис называет то, что с группой произойдёт?","options":["Инсайт: группа внезапно увидит связь, как обезьяна Келера","Преждевременное, ложное разрешение: задача лишь кажется решённой","Устойчивый гештальт: застывшая фигура из прошлого опыта"],"correct":1,"why_not":["Инсайтом Келер назвал момент, когда обезьяна научилась скреплять палки, чтобы достать банан, - это настоящее решение. В примере с сырьём правильный ответ исключён самой постановкой задачи.",null,"Устойчивыми гештальтами Перлз называл фигуры из прошлого, которые делают восприятие жёстким. В примере с сырьём Невис говорит о другом: поле устроено так, что правильный ответ невозможен."],"explanation":"Если неверно определить проблему, группа может решить, что задача закрыта и обучение завершено. Но потом она будет испытывать напряжение и дискомфорт, потому что качество так и не изменилось.","source":"Эдвин Невис, «Организационное консультирование», гл. 1, включение в модель мотивационно-деятельностной сферы","quote":"Мы можем отнести данную проблему к случаю преждевременного и ложного разрешения.","by_record":false,"h":"cf314e16"},{"id":"m4-ne-02-01","module":4,"topic":"Контакт в цикле","kind":"знание","question":"Менеджер несколько раз пытается сблизиться с коллегой и понимает, что тот хочет формальных отношений на расстоянии. Был ли здесь контакт, по Эдвину Невису?","options":["Не был: потребность в близости осталась неудовлетворённой","Пока нет: до контакта нужна фаза разрешения и завершения","Был: он узнал, как обстоят дела, а это и есть контакт"],"correct":2,"why_not":["Невис разбирает именно этот пример: неправильно было бы сказать «Я не смог до нее достучаться» и считать, что контакта не было. Контакт - знание своих возможностей, а не достижение желаемого.","В цикле разрешение идёт после контакта: это извлечение смысла из уже случившегося контакта и признание, что ситуация закончена.",null],"explanation":"Контакт в цикле - это не получить желаемое, а узнать, что возможно. Невис формулирует так: контакт есть наложение возможного на желаемое, и любой контакт приносит знание о том, как обстоят дела.","source":"Эдвин Невис, «Организационное консультирование», гл. 2, действие и контакт","quote":"Контакт определяется как знание своих возможностей, а не как достижение желаемого.","by_record":false,"h":"e2f880ff"},{"id":"m4-ne-02-02","module":4,"topic":"Интерактивный цикл","kind":"знание","question":"В интерактивном цикле у каждого члена группы свой темп осознавания и энергии. Что Эдвин Невис считает критерием того, что группа интегрировалась?","options":["Единодушие: к концу все думают и чувствуют одинаково","Схождение в конце: сделана наилучшая из возможных единица работы","Одновременный старт: все замечают проблему в одно и то же время"],"correct":1,"why_not":["Невис пишет прямо: критерием интеграции не могут служить слияние или единодушие.",null,"На рисунке идеального цикла у четверых участников разные стартовые позиции и скорость осознавания, и Невис не считает это сбоем."],"explanation":"Интерактивный цикл - цикл контакта в группе, где у каждого свой ритм. Различия могут оставаться, но в точке завершения люди снова сходятся: знают и принимают, что наилучшая из возможных единица работы сделана.","source":"Эдвин Невис, «Организационное консультирование», гл. 2, гештальтистский цикл взаимодействия","quote":"Критерием интеграции не может служить их слияние или единодушие. ... в их повторном схождении в точке завершения","by_record":false,"h":"bcc963d7"},{"id":"m4-ne-02-03","module":4,"topic":"Единица работы","kind":"знание","question":"Эдвин Невис требует, чтобы каждая встреча с клиентом была завершённой единицей работы. Что должно быть у системы в конце такой встречи?","options":["Ясность, что сделано, что нет и к чему система пока не готова","Принятое всеми решение и план, которые закрывают проблему целиком","Высокая энергия, чтобы сразу перейти к следующей задаче"],"correct":0,"why_not":[null,"Невис не требует решить проблему целиком: единица работы может закончиться признанием, что к чему-то система пока не готова.","В конце цикла энергия, наоборот, спадает: фигура разрушается, интерес угасает, и так освобождается место для нового осознавания."],"explanation":"Единица работы - отрезок с началом и концом, будь то час или три дня. В конце участники подводят итог и называют смысл сделанного для системы, даже если часть проблемы осталась.","source":"Эдвин Невис, «Организационное консультирование», гл. 2, завершение единиц работы","quote":"существует ясное представление о том, что было и не было сделано и/или о том, к чему на данный момент система еще не готова.","by_record":false,"h":"61e91856"},{"id":"m4-ne-03-01","module":4,"topic":"Вмешательство как изменение границы","kind":"знание","question":"Руководитель группы сам запускает в ней программу изменений. Считает ли Эдвин Невис это вмешательством?","options":["Нет: это обычное рабочее поведение, вмешательство приходит извне","Да: это модель внутреннего консультанта с «пунктирной» ответственностью","Да: он внутри границы, но возвышает себя до особой роли"],"correct":2,"why_not":["Невис признаёт, что это можно считать нормальным рабочим поведением, но всё равно предлагает называть его вмешательством.","Внутренний консультант с «пунктирной» ответственностью у Невиса - отдельный, второй случай. Лидер или член группы, который проводит изменения, - третий.",null],"explanation":"Вмешательство, по Невису, - это пересечение или изменение границы системы. Лидер остаётся внутри обычных границ, но, возвышаясь до особой роли, действует с той же самоуверенностью, что и внешний консультант.","source":"Эдвин Невис, «Организационное консультирование», гл. 3, вмешательство как изменение границы","quote":"В таких случаях \"интервент\" четко занимает позицию внутри обычных границ системы, но, вместе с тем, возвышает себя до принятия особой роли.","by_record":false,"h":"ce843baf"},{"id":"m4-ne-03-02","module":4,"topic":"Пять направлений работы","kind":"знание","question":"Из пяти главных направлений работы гештальт-консультанта Эдвин Невис называет два краеугольными. Какие?","options":["Следить за энергией системы и помогать контакту между её членами","Замечать внешнее и своё внутреннее и выборочно этим делиться","Помогать завершать единицы работы и замыкать границы вокруг незаконченного"],"correct":1,"why_not":["Это третье и четвёртое направления. По Невису, они становятся возможны благодаря первым двум.",null,"Это пятое направление. Оно, как и третье с четвёртым, держится на наблюдении и выборочном раскрытии."],"explanation":"Первые два направления - наблюдать себя и других и выборочно делиться увиденным и пережитым. Для этого консультант должен стать хорошо настроенным инструментом наблюдения, поэтому Невис называет саморазвитие единственным путём повышения эффективности консультанта.","source":"Эдвин Невис, «Организационное консультирование», гл. 3, основные направления деятельности интервенциониста","quote":"Из вышеуказанных видов деятельности первые два — наблюдение за собой и другим, а также выборочное обнародование своего опыта — представляют собой краеугольные камни гештальтистски-ориентированного консультирования.","by_record":false,"h":"2e37037d"},{"id":"m4-ne-03-03","module":4,"topic":"Гештальт, Шайн и Аргирис","kind":"знание","question":"Эдвин Невис относит гештальт-подход к консультированию процессов по Шайну и сравнивает его с моделью Аргириса. В чём, по его словам, главное отличие гештальт-подхода?","options":["В высококонтактном стиле и использовании собственной личности","В том, что гештальт отвергает экспертную модель Шайна как бесполезную","В том, что перемены - задача консультанта, а у Аргириса - выбор клиента"],"correct":0,"why_not":[null,"Невис пишет, что для сложных технических задач «покупка экспертизы» уместна, а гештальт и другие процессуальные модели могут её дополнять.","Здесь гештальт с Аргирисом совпадает: ответственность за решение меняться остаётся на клиенте, а консультант помогает осознать силы, которые помогают переменам и мешают им."],"explanation":"Гештальт, консультирование процессов у Шайна и модель Аргириса сходятся в главном: важно осознавание, а решение меняться остаётся за клиентом. Разница - в том, насколько консультант включается лично: у Аргириса упор на когнитивную ясность и меньше «входа» в систему, в гештальте - на высококонтактное поведение и эмоциональное включение.","source":"Эдвин Невис, «Организационное консультирование», гл. 3, отношение гештальт-модели к моделям Шайна","quote":"основное различие между гештальтистским подходом и другими подходами в русле консультирования процессов состоит в степени использования тесновзаимодействующего стиля вмешательства.","by_record":false,"h":"9b656369"},{"id":"m4-ne-04-01","module":4,"topic":"Присутствие и стиль","kind":"знание","question":"Чем, по Эдвину Невису, присутствие консультанта отличается от его стиля?","options":["Присутствие рождается из полного выражения себя, «душа нараспашку»","Присутствие и есть стиль: голос, слова, жесты, манера держаться","Присутствие - интеграция знания и поведения, стиль - его поверхность"],"correct":2,"why_not":["Это популярное мнение Невис считает следствием того, что стиль не отличали от присутствия. Умение быть харизматичным или спонтанным так и не стало теорией изменений.","Стиль - важный, но более поверхностный аспект присутствия. Без внутренней системы знаний он может остаться лишь выставлением напоказ своего шарма.",null],"explanation":"Присутствие - это проживание своих ценностей так, что каждое профессиональное действие чему-то учит клиента. Консультант становится воплощением своей теории, а стиль лишь передаёт это послание.","source":"Эдвин Невис, «Организационное консультирование», гл. 4, определение присутствия","quote":"Присутствие подразумевает высокую степень интеграции знания и поведения.","by_record":false,"h":"a83ffa7a"},{"id":"m4-ne-04-02","module":4,"topic":"«Правота»","kind":"знание","question":"Эдвин Невис называет «правоту» фактором присутствия, которому труднее всего научить неопытного консультанта. Что он под ней понимает?","options":["Ощущение, что человек на своём месте и вправе быть собой","Опору на твёрдые факты, которая позволяет говорить нелицеприятное","Верность своей школе и доктрине, как у присутствия «священника»"],"correct":0,"why_not":[null,"Говорить нелицеприятное с опорой на «твёрдые» факты позволяет клинический метод - это четвёртый фактор присутствия, а не «правота».","Это коллективистский полюс третьего фактора, который Адельсон называет присутствием «священника»."],"explanation":"Люди с «правотой» кажутся теми, чьи поступки следуют предназначению: без оправданий, застенчивости и позёрства. Она помогает подняться над тревогой, выбирать момент и темп вмешательства по чувству, а ошибки воспринимать как часть процесса.","source":"Эдвин Невис, «Организационное консультирование», гл. 4, правота","quote":"Ни оправдания, ни застенчивость не свойственны их манере поведения, не пользуются они и преувеличениями притворщика или лицедея. ... в их присутствии заложено право быть теми, кем они являются.","by_record":false,"h":"054e751c"},{"id":"m4-ne-04-03","module":4,"topic":"Ясность против загадочности","kind":"знание","question":"Консультант учит через дилеммы и парадоксы, охотно работает с фантазиями, сновидениями и метафорами. К какому полюсу присутствия его отнёс бы Эдвин Невис?","options":["Гуру или мистик-целитель на полюсе загадочности","Мудрец-естествоиспытатель на полюсе ясности","Контактн
