ый полюс совместного путешествия, как у Роджерса"],"correct":0,"why_not":[null,"Мудрец-естествоиспытатель опирается на анализ, диагноз и проверенные временем решения. Примеры у Невиса - Шайн, Аргирис и Левинсон.","Контактный полюс относится к четвёртому фактору: эмоциональная вовлечённость и «совместное путешествие» с клиентом, а не обучение через парадоксы."],"explanation":"Второй фактор присутствия - ясность против загадочности. Мудрец учит через анализ и истолкование, гуру-мистик - через метафоры, дилеммы и парадоксы, и сильное присутствие возможно в любой точке этого континуума.","source":"Эдвин Невис, «Организационное консультирование», гл. 4, ясность в противовес загадочности","quote":"В отличие от линейноассоциативного метода преподавания мудреца/естествоиспытателя обучение проходит при помощи использования дилемм, парадоксов и загадок.","by_record":false,"h":"9870f28f"},{"id":"m4-ne-05-01","module":4,"topic":"Навык А: обучать, а не спасать","kind":"знание","question":"Среди навыков группы А («оставаться в настоящем») Эдвин Невис прямо называет, в чём задача консультанта. Как он её формулирует?","options":["Добиться, чтобы перемены в системе обязательно состоялись","Обучать, а не спасать, с позиции «творческого безразличия»","Стать «аутентичным», «тем, кто он есть», - в этом и эффективность"],"correct":1,"why_not":["В главе 3 Невис пишет прямо: задача не в том, чтобы удостовериться, что перемены имеют место, а в том, чтобы помочь системе осознать силы, которые помогают переменам и мешают им.",null,"Так, по Невису, думают неумелые практики: будто эффективность приходит, когда человек становится «аутентичным». Он предлагает видеть в навыках тактический выбор: какое поведение полезно в данный момент."],"explanation":"Навык А - терпение и доверие к естественному ходу событий: без «сильных ходов», уловок для ускорения и попыток решить давний конфликт с ходу. Консультант учит систему, а не вытаскивает её сам.","source":"Эдвин Невис, «Организационное консультирование», гл. 5, навык А: оставаться в настоящем","quote":"Принятие факта, что ваша задача состоит в обучении, а не спасении; способность работать с позиции \"творческого безразличия\".","by_record":false,"h":"fbdc2187"},{"id":"m4-ne-05-02","module":4,"topic":"Навык Г: данные и интерпретации","kind":"знание","question":"Консультанту кажется, что он понял, почему один из участников группы молчит. Как с такими догадками о чужих мотивах советует обращаться Эдвин Невис?","options":["Не высказывать: консультант ограничивается безоценочными наблюдениями","Сразу сказать группе как верное объяснение, чтобы она увидела суть","Держать как гипотезу для себя, предлагать, если клиент хочет услышать"],"correct":2,"why_not":["Безоценочные комментарии в навыке Г есть, но догадки о мотивах Невис не запрещает: их можно предлагать, когда клиент искренне заинтересован их услышать.","Невис советует держать такие догадки как гипотезы для себя, а не чтобы «изложить истину», обязательную для всех, и предлагать их, только когда клиент искренне хочет их услышать.",null],"explanation":"Навык Г - отделять данные от интерпретаций. Догадка о мотиве - интерпретация, поэтому она остаётся рабочей гипотезой, а клиенту лучше дать выбор из нескольких толкований.","source":"Эдвин Невис, «Организационное консультирование», гл. 5, навык Г: отделять данные от интерпретации","quote":"Обладать способностью высказывать догадки и приводить различные формулировки относительно чужой мотивации в качестве ориентационных гипотез для себя самого, а не для того, чтобы \"изложить истину\", обязательную для всех; ... только тогда, когда клиент кажется искренне заинтересованным в том, чтобы их услышать.","by_record":false,"h":"472b9a8c"},{"id":"m4-ne-05-03","module":4,"topic":"Навык Л: жёсткость и сочувствие","kind":"знание","question":"В списке навыков компетентного консультанта Эдвин Невис даёт определение конфронтации. Какое?","options":["Как жёсткий прямой контакт, а не агрессию и не любовь","Как агрессию, которую консультант дозирует ради отношений","Как поддразнивание и сарказм, которые снимают напряжение"],"correct":0,"why_not":[null,"Невис прямо отделяет конфронтацию от агрессии. Консультант может сильно давить, не «покупаясь» на хрупкость людей, и затем поддержать их ответ.","Поддразнивание, сарказм и насмешку Невис в навыке В описывает как способ избежать настоящих чувств и отличает их от прямой конфронтации."],"explanation":"Жёсткость и сочувствие у Невиса совместимы: можно открыто не соглашаться без придирок, выражать разочарование без «возмездия», сказать неприятное и затем поддержать ответ клиента.","source":"Эдвин Невис, «Организационное консультирование», гл. 5, навык Л: быть жёстким и сочувствующим","quote":"Осознание того, что конфронтация представляет собой жесткий, прямой контакт, а не агрессию или любовь.","by_record":false,"h":"8f14ff87"},{"id":"m4-ne-06-01","module":4,"topic":"Холмс и Коломбо","kind":"знание","question":"Эдвин Невис сравнивает два подхода к оцениванию организации с двумя сыщиками. Каким он описывает подход Коломбо?","options":["Как губка: погружается в обстановку и ждёт, пока улики придут сами","Как гончая: не успокаивается, пока не соберёт в уме цельную картину","Как аналитик: держит людей под контролем и избегает личных контактов"],"correct":0,"why_not":[null,"Это образ Холмса: Невис сравнивает его с натасканной гончей, которая не успокаивается, пока не соберёт картину из кусочков.","Так ведёт себя Холмс: он учится держать окружающих под контролем и редко вступает в близкий личный контакт со злодеем. Коломбо, наоборот, опирается на частые личные контакты и позволяет себя обучать."],"explanation":"Холмс олицетворяет направленное осознавание - активный поиск, логику и быстрые выводы. Коломбо - ненаправленное, открытое осознавание: он не знает заранее, на что смотреть, и даёт информации появиться самой.","source":"Эдвин Невис, «Организационное консультирование», гл. 6, направленное и ненаправленное осознавание","quote":"Можно сказать, что Коломбо действует как губка, погружаясь в окружающую обстановку и выжидая, пока важные улики сами не придут к нему.","by_record":false,"h":"29097f31"},{"id":"m4-ne-06-02","module":4,"topic":"Упор на открытое осознавание","kind":"знание","question":"Чем, по Эдвину Невису, консультант гештальт-ориентации отличается при оценивании от большинства организационных консультантов?","options":["Старается как можно раньше выдвинуть рабочую гипотезу","Отказывается от интервью и опросов в пользу наблюдения","Дольше смотрит открыто и не спешит закреплять гипотезу"],"correct":2,"why_not":["Это «модель Шерлока Холмса»: чем скорее возникает гипотеза, тем лучше. Гештальт-консультант, наоборот, пытается продлить период формирования гипотезы.","Невис пишет, что гештальт-консультант тоже использует эти процедуры - структурированное опрашивание членов системы, - но добавляет к ним открытое осознавание.",null],"explanation":"Направленное осознавание - прицельный поиск по заранее заданной схеме, ненаправленное - открытое восприятие без неё. Гештальт-консультант пользуется обоими, но делает на открытое осознавание больший упор, чем принято у большинства консультантов: это попытка снизить предвзятость.","source":"Эдвин Невис, «Организационное консультирование», гл. 6, процесс гештальт-осознавания","quote":"Консультант гештальтистской ориентации также использует эти процедуры, но, кроме того, делает сильный упор на открытое, ненаправленное осознавание и пытается продлить период формирования гипотезы подольше.","by_record":false,"h":"9e464e10"},{"id":"m4-ne-06-03","module":4,"topic":"Функции оценивания","kind":"знание","question":"Эдвин Невис перечисляет функции оценивания для гештальт-консультанта. Как, по его списку, определить потенциал для делового сотрудничества с клиентом?","options":["Сдать клиенту полный доклад с выводами и планом дальнейших действий","Попытаться завершить небольшой объём работы уже в ходе оценивания","Держаться безлично, чтобы клиент видел в консультанте эксперта"],"correct":1,"why_not":["Так строится контракт по «подходу Холмса»: исследование, доклад и план. По «модели Коломбо» обсуждается возможность взаимодействия с системой.",null,"Невис пишет обратное: одна из функций - выборочно делиться информацией и вести себя так, чтобы присутствие консультанта чувствовалось."],"explanation":"В списке шесть функций: искать то, что интересно консультанту и клиенту, укорениться в системе, учить систему давать данные, оценить её осознавание, выборочно делиться информацией и проверить сотрудничество на небольшой совместной работе. Оценивание здесь идёт всё время, пока консультант взаимодействует с системой.","source":"Эдвин Невис, «Организационное консультирование», гл. 6, сочетание двух моделей, функции оценивания","quote":"Определить потенциал для делового сотрудничества, попытавшись завершить небольшой объем работы, входящий в курс оценивания.","by_record":false,"h":"402e9f20"},{"id":"m4-ne-07-01-r","module":4,"topic":"Две цели воздействия","kind":"знание","question":"Эдвин Невис различает две цели вмешательства: добиться конкретного результата или сделать так, чтобы система заинтересовалась тем, что консультант считает важным. Как он соотносит эти цели?","options":["Взаимоисключающие: консультант выбирает одну на весь проект","Совместимы, но относятся к разным фазам цикла контакта","Обе относятся к стадии действия и различаются только нажимом"],"correct":1,"why_not":["Невис прямо пишет, что эти цели не являются взаимоисключающими.",null,"Нет: забота о результате направляет внимание консультанта на стадии действия и контакта, а забота об интересе - на стадию осознавания."],"explanation":"Цикл контакта - последовательность стадий, среди которых осознавание (система замечает, что происходит), действие и контакт. Забота о результате ведёт внимание консультанта к действию и контакту, забота об интересе - к осознаванию; если консультант переоценивает одну из целей, он, скорее всего, будет предпочитать и свои способы влияния.","source":"Эдвин Невис, «Организационное консультирование», гл. 7, значение воздействия","quote":"Эти цели не являются взаимоисключающими, но, тем не менее, относятся к разным фазам гештальтистского цикла контакта.","by_record":false,"h":"882f60ac"},{"id":"m4-ne-07-02","module":4,"topic":"Конфронтационная провокация","kind":"знание","question":"На двенадцатой встрече компаньонов Эдвин Невис встал и сказал, что это одни из худших собраний, какие он видел. Как он сам определяет этот ход?","options":["Элицитация: вопрос, который мягко привлекает внимание","Атакующая провокация: ход, на который нельзя не ответить","Конфронтационная провокация: давление есть, но можно не отвечать"],"correct":2,"why_not":["Элицитацией Невис во втором случае называет предложение помощи и «отзеркаливание» слов клиента. Здесь он прервал заседание и бросил вызов - это уже провокация.","Невис специально разводит эти виды: компаньоны могли проигнорировать его и продолжить заседание, а атака требует более насильственных мер, которые не могут остаться без ответа.",null],"explanation":"Конфронтационная провокация - прямой вызов, который давит, но оставляет выбор: можно не отвечать и продолжать своё. Невис предполагает, что ход сработал, потому что за месяцы тихого присутствия компаньоны начали его уважать и доверять ему.","source":"Эдвин Невис, «Организационное консультирование», гл. 7, примеры использования, случай первый","quote":"То, что для них не было невозможным продолжать дальше, позволяет нам обозначить этот случай как пример конфронтационной, а не атакующей провокации.","by_record":false,"h":"3729f757"},{"id":"m4-ne-07-03","module":4,"topic":"С чего начинать воздействие","kind":"знание","question":"В выводах главы 7 Эдвин Невис рассуждает, в каком порядке перебирать возможные вмешательства. С чего, по его предположению, стоит начинать?","options":["С эвокативного, а конфронтацию оставить для «разогретых» систем","С провокативного: он быстрее всего ускоряет ход событий","С конфронтации там, где в системе сильная тревога и замешательство"],"correct":0,"why_not":[null,"Невис признаёт, что провокация ускоряет события, но предупреждает: она может восприниматься как штурм и порождать противостояние и сопротивление.","Невис пишет обратное: там, где ощущается сильное замешательство или тревожность, успешнее создать атмосферу для спонтанного хода событий, а форсировать их неуместно."],"explanation":"Эвокация - «пробуждение»: консультант не форсирует события, а пробуждает осознавание системы. Невис допускает, что начинать стоит с неё, а прямой вызов оставлять для систем, которые уже заинтересованы.","source":"Эдвин Невис, «Организационное консультирование», гл. 7, выводы","quote":"Вполне может быть, что, перебирая ряд возможных вмешательств, в первую очередь следует начать с эвокативного метода, используя конфронтационную провокацию для работы с более «сознательными», заинтересованными и «разогретыми» системами.","by_record":false,"h":"10a6019f"},{"id":"m4-ne-08-03","module":4,"topic":"«Нет» и сопротивление","kind":"знание","question":"Эдвин Невис разводит два ответа на чужое предложение: сказать «нет» и сопротивляться. Чем, по нему, «нет» отличается от сопротивления?","options":["«Нет» - первый шаг сопротивления, за которым обычно следуют саботаж и срыв","«Нет» - эмоциональная реакция, а сопротивление - обработка информации","«Нет» - чёткий ответ равного равному, а сопротивление - косвенный протест"],"correct":2,"why_not":["Невис прямо пишет, что отвергать не значит сопротивляться, это разные вещи. А среди взрослых сознательное «нет» считается поступком зрелым и здравым, а не началом саботажа.","Невис не называет «нет» эмоциональной реакцией: сказать «нет» у него - дать чёткий ответ как равный равному. Мысль о сопротивлении как обработке информации у него есть, но разницу между «нет» и сопротивлением он проводит через равенство сил.",null],"explanation":"Людям с меньшей энергией трудно прямо отказать, поэтому несогласие выходит косвенно и выглядит размытым - это и называют сопротивлением. «Нет» звучит там, где стороны примерно равны, как на переговорах профсоюза и администрации.","source":"Эдвин Невис, «Организационное консультирование», гл. 8, о смысле сопротивления","quote":"Сказать чему-то «нет» означает дать четкий ответ, относясь к партнеру как равный к равному.","by_record":false,"h":"e4e96b01"},{"id":"m4-ne-08-02","module":4,"topic":"Парадоксальная теория изменений","kind":"знание","question":"Эдвин Невис выводит из парадоксальной теории изменений совет менеджерам, которые хотят перемен. Что им следует сделать сначала?","options":["Продвигать перемены настойчивее, пока сопротивление не окрепло","Потребовать от людей и выслушать все их возражения","Обойти возражения и опереться на тех, кто уже готов к новому"],"correct":1,"why_not":["Невис пишет обратное: насильственные перемены только укрепят сопротивление, потому что силы противодействия не смогут развернуться и уравновесить силы объединения.",null,"«Проскочить» сопротивление, обойти его, по Невису, значит отвергнуть возможность настоящего понимания и внутреннего роста."],"explanation":"Парадоксальная теория изменений - основа гештальт-подхода к переменам: человек или система не сменят состояние, пока текущее не прожито и не принято. Поэтому сначала выслушивают все «против», и только потом переходят к доводам, зачем перемены нужны.","source":"Эдвин Невис, «Организационное консультирование», гл. 8, что делать с сопротивлением","quote":"Для менеджеров это означает, что, прежде чем начинать работать, полагаясь на доводы в пользу желаемых перемен, им следует потребовать от людей, а затем и выслушать все их возражения.","by_record":false,"h":"a87d2bc8"},{"id":"m4-ne-09-01","module":4,"topic":"«Работа сидя» и «работа стоя»","kind":"знание","question":"Эдвин Невис сравнивает психотерапию и организационный консалтинг через метафоры «работа сидя» и «работа стоя». Что такое «работа стоя»?","options":["Выжидательная позиция, пока клиент сам движется к изменениям","Активный «показ товара» клиенту, который держится пассивнее","Тренинг вставания с места - одно из частых вмешательств"],"correct":1,"why_not":["Это «работа сидя» - позиция терапевта, который ждёт, пока клиент что-то делает и к чему-то движется.",null,"Невис лишь замечает, что название похоже на «тренинг вставания с места». Сама метафора - про стиль работы консультанта, а не про вид тренинга."],"explanation":"В терапии клиент сам ищет терапевта и старается доказать ему свою полезность. В организации наоборот: клиенты ждут, что консультант сам докажет свою полезность, поэтому ему приходится активно «показывать товар».","source":"Эдвин Невис, «Организационное консультирование», гл. 9, отличия консалтинга от психотерапии","quote":"многие организационные консультанты чувствуют, что их работа включает в себя не только проведение формальных «презентаций», но и, как правило, более активные в физическом и психическом отношении попытки показа товара более «пассивному» клиенту","by_record":false,"h":"8b9db6f6"},{"id":"m4-ne-09-02","module":4,"topic":"Присутствие при участии «по приказу»","kind":"знание","question":"Что, по Эдвину Невису, должен делать консультант, когда людям сверху «приказывают» с ним сотрудничать?","options":["Опереться на приказ: раз участие обязательно, интерес не нужен","Выжидать, пока люди сами придут к нему с запросом","Силой присутствия возбудить интерес к своим усилиям"],"correct":2,"why_not":["Невис пишет, что именно в таких случаях консультант должен силой присутствия возбудить интерес. Иначе колеблющиеся могут примкнуть к оппозиции.","Долгое выжидание может считаться хорошей техникой в терапии. В консалтинге, по выводу Невиса, оно вероятнее всего приведёт к дискомфорту и ухудшению отношений, если консультант не сможет ответить на раздражение клиента.",null],"explanation":"Здесь присутствие значит, что фигура консультанта настолько интересна, что привлекает внимание всё новых людей. Без него колеблющиеся между участием и неучастием могут примкнуть к оппозиции, и она станет доминирующей.","source":"Эдвин Невис, «Организационное консультирование», гл. 9, вступительная часть: присутствие","quote":"Даже тогда, когда людям сверху «приказывают» сотрудничать - на самом деле, особенно в таких случаях, - консультант должен использовать силу присутствия для того, чтобы возбудить интерес","by_record":false,"h":"009af30e"},{"id":"m4-ne-09-03","module":4,"topic":"Кто клиент","kind":"знание","question":"Эдвин Невис работал с латиноамериканским отделом корпорации по соглашению, что не отчитывается перед штаб-квартирой. Корпорация потребовала отчёт, и работу пришлось прекратить. Какой главный урок он вынес?","options":["Он пренебрёг важной частью системы-клиента - корпорацией вокруг отдела","Работа с отделом не дала сдвигов, и продолжать её не было смысла","Первое соглашение нужно было считать окончательным и твёрдо держаться его"],"correct":0,"why_not":[null,"Невис пишет обратное: за шесть месяцев были замечательные успехи, и группа хотела продолжать работу.","Вывод Невиса обратный: первоначальное соглашение не позволяло считать его окончательным, и наивно было ждать, что соседние части организации останутся спокойны."],"explanation":"В организационном консалтинге клиент - не один человек или отдел: перемены в одной части могут задеть соседние части системы и заставить их беспокоиться. Поэтому Невис называет консалтинг непрерывной серией переговоров и возвращается к вопросу, кто же клиент.","source":"Эдвин Невис, «Организационное консультирование», гл. 9, поясняющие примеры, случай второй","quote":"Главный урок, который я извлек из этого опыта, заключался в том, что я пренебрег важной частью системы-клиента.","by_record":false,"h":"97f42b34"},{"id":"m4-ne-10-01","module":4,"topic":"Маргинальность: равновесие","kind":"знание","question":"Эдвин Невис описывает маргинальность консультанта как равновесие между сходством с системой-клиентом и отличием от неё. Что грозит, если консультант отличается от системы минимально?","options":["Отношения окажутся полны непонимания или обернутся конфликтом","Отношения станут конфлюэнтными: консультант сольётся с системой","Консультант будет выглядеть надменным чужаком, оставляющим без поддержки"],"correct":1,"why_not":["Это обратная крайность: так Невис описывает отношения, когда консультант слишком сильно отличается от системы.",null,"Так выглядит консультант, который чрезмерно держится за независимость и проводит между собой и клиентом слишком жёсткие границы."],"explanation":"Конфлюэнция - слияние, когда граница между собой и другими стирается. Нужное равновесие Невис описывает так: консультант налаживает связи с системой, но ясно даёт понять, что не является её частью, - это и делает его влиятельной силой.","source":"Эдвин Невис, «Организационное консультирование», гл. 10, маргинальность и работа на границе","quote":"Если его отличие от системы минимально, отношения между клиентом и консультантом грозят стать в высокой степени конфлюэнтными.","by_record":false,"h":"900c5633"},{"id":"m4-ne-10-02","module":4,"topic":"Автономия и аффиляция","kind":"знание","question":"Эдвин Невис сравнивает «работу в одиночку» (потребность в автономии) и работу «в тесном союзе» (потребность в аффиляции). Что он относит к цене «работы в одиночку»?","options":["Мало поддержки, и сложнее охватить взглядом общую картину","Решения должны нравиться другим или одобряться ими","Мало что связывает, и своё время контролируешь сам"],"correct":0,"why_not":[null,"Это цена работы «в тесном союзе»: в таблице Невиса там же - меньше контроля над своим временем и давление приспосабливаться.","Это не цена, а то, что автономия даёт: свобода, свои планы и контроль над временем и выбором задач."],"explanation":"Аффиляция - потребность принадлежать к группе, автономия - потребность самому управлять своими делами. У каждой свои выгоды и своя цена, и, по Невису, некоторые недостатки одной могут быть компенсированы другой.","source":"Эдвин Невис, «Организационное консультирование», гл. 10, таблица 10-1","quote":"Возможное одиночество; вас мало поддерживают. ... Сложнее охватить взглядом общую картину.","by_record":false,"h":"30e38709"},{"id":"m4-ne-10-03","module":4,"topic":"Уход с границы","kind":"знание","question":"Эдвин Невис с партнёром годами вели семинар в крупной фирме. Клиент называл его лучшей программой и не хотел следующих шагов, и они продолжили семинар. Как Невис оценивает этот выбор с точки зрения работы на границе?","options":["Они сохранили маргинальную позицию, не порвав отношений с клиентом","Они ушли с границы и по сути стали частью системы-клиента","Они обошли препятствия и тем самым ещё сильнее нарушили границу"],"correct":1,"why_not":["Невис пишет обратное: после этого выбора они уже не находились на границе, и потенциал для перемен заметно снизился.",null,"Обойти препятствия они могли, но решили этого не делать и продолжили проводить семинар."],"explanation":"Работа на границе значит быть связанным с системой и при этом отделённым от неё. Оставшись с привычным семинаром, консультанты, по словам Невиса, перестали находиться на границе, и потенциал для перемен заметно снизился.","source":"Эдвин Невис, «Организационное консультирование», гл. 10, проблемы маргинальных ролей, случай второй","quote":"данный выбор привел к тому, что мы уже больше не находились на границе, а, в сущности, превратились в часть системы-клиента.","by_record":false,"h":"7e782cbf"},{"id":"m4-ne-ep-01","module":4,"topic":"Сожаление о выборе","kind":"знание","question":"В эпилоге Эдвин Невис предлагает учить менеджеров переживать сожаление о сделанном выборе. О каком сожалении он говорит?","options":["О чувстве вины, когда минусы решения приписываешь себе","О признании ошибки, когда последствия решения уже проявились","О понимании, что выбор отрезал достоинства отвергнутых вариантов"],"correct":2,"why_not":["Вину Невис ставит рядом с проекцией как защиту: ни то, ни другое не даёт пережить настоящее раскаяние.","Невис оговаривает, что говорит о переживании в момент решения или действия, а не о понимании, которое приходит, когда обнаружатся последствия.",null],"explanation":"У любой стратегии есть и выгоды, и ограничения, а у отвергнутых вариантов были свои плюсы. «Праведность» - уверенность, что свой путь единственно верный, - мешает это почувствовать. Невыносимость переживания раскаяния Невис называет одним из самых больших барьеров для перемен.","source":"Эдвин Невис, «Организационное консультирование», эпилог, «праведность» - враг раскаяния","quote":"Оно коренится в осознании и принятии на себя ответственности за выбор одного варианта, со всеми его недостатками, и отвержение другого, со всеми его достоинствами.","by_record":false,"h":"29bbead5"},{"id":"m4-st-01","module":4,"topic":"Определение стратегических взаимодействий","kind":"знание","question":"Как Соня Невис, Бэкман и Эдвин Невис определяют стратегические взаимодействия?","options":["Обмен влиянием ради конкретной задачи, где работает иерархия","Сближение через интерес к тому, что думает и чувствует каждый","Отказ от связи между людьми ради того, чтобы сделать дело"],"correct":0,"why_not":[null,"Так авторы определяют близкие взаимодействия: их цель - укрепить связанность как ценность саму по себе.","Авторы подчёркивают, что оба вида взаимодействия стремятся сохранить связь между участниками. В стратегическом режиме связанность по-прежнему желанна, но главное - сделать дело."],"explanation":"Стратегический режим - когда главное сделать дело: один ведёт, другой следует, и равенство заботит меньше. Близкий режим - когда люди на равных интересуются мыслями и чувствами друг друга.","source":"Соня Невис, Стефани Бэкман, Эдвин Невис, «Стратегические и близкие взаимодействия», введение","quote":"Стратегические взаимодействия - способы, которыми люди обмениваются влиянием, когда цель - выполнить конкретную задачу.","by_record":false,"h":"7432cfc6"},{"id":"m4-st-02","module":4,"topic":"Случай Си Джей и прессы","kind":"знание","question":"Пресс-секретарь Си Джей сначала шутит с журналистами о падении президента, а потом твёрдо отводит неудобный вопрос. Что она делает со своим «психологическим размером»?","options":["Сначала увеличивает, чтобы задать тон, потом уменьшает, чтобы смягчить отказ","Держит его прежним: меняется только тема разговора, а не режим","Сначала уменьшает, чтобы сблизиться, потом увеличивает, чтобы отвести вопрос"],"correct":2,"why_not":["Порядок обратный: рассказ о падении президента уменьшает её «размер» ради сближения, а отказ идёт из иерархической позиции.","Авторы пишут, что брифинг переходит из близкого режима в стратегический - меняется именно режим отношения к другим.",null],"explanation":"Уменьшая «психологический размер», Си Джей встаёт с журналистами на равных - это близкий режим. Увеличивая его, она занимает иерархическую позицию - это стратегический режим, и журналисты принимают её право так поступить.","source":"Соня Невис, Стефани Бэкман, Эдвин Невис, «Стратегические и близкие взаимодействия», введение, случай Си Джей","quote":"она занимает иерархическую позицию, увеличивает свой «психологический размер» и отводит вопрос.","by_record":false,"h":"a199fd45"},{"id":"m4-st-03","module":4,"topic":"Историческая справка","kind":"знание","question":"Авторы статьи оглядываются на ценности в человеческих отношениях с 1940-х годов. К чему они призывают сегодня?","options":["Дальше сглаживать иерархические различия ради доверия","Качнуть маятник обратно и признать ценность иерархического влияния","Признать движения за открытость и близость ошибкой"],"correct":1,"why_not":["Это господствующая доктрина, с которой авторы спорят: руководителей десятилетиями побуждали ослаблять свою иерархическую власть.",null,"Авторы называют влияние этих движений огромным, почти революционным: они научили людей ценить близкую связь, и отношения стали открытее."],"explanation":"Авторы не отменяют ценность близости, а добавляют противовес: бывает полезно, чтобы чьё-то влияние преобладало, когда это нужно для работы. Их главный тезис - близкие взаимодействия поддерживают иерархические, а иерархические - близкие.","source":"Соня Невис, Стефани Бэкман, Эдвин Невис, «Стратегические и близкие взаимодействия», историческая справка","quote":"Теперь нужно качнуть маятник обратно и признать ценность того, чтобы чьё-то влияние преобладало, когда это полезно или необходимо для выполнения работы - в семье или в бизнесе.","by_record":false,"h":"2e2788f3"},{"id":"m4-st-04","module":4,"topic":"Перекос в близость на работе","kind":"знание","question":"Что, по Соне Невис, Стефани Бэкман и Эдвину Невису, происходит с рабочими отношениями, слишком сосредоточенными на межличностной близости?","options":["Становятся продуктивнее: сильная связь вытягивает трудные решения","Становятся холодными и отчуждающими, теряют творчество","С трудом справляются с работой, особенно с трудными решениями"],"correct":2,"why_not":["Авторы пишут обратное: такие отношения с трудом справляются с работой, а неуместное близкое взаимодействие мешает высокой продуктивности.","Так авторы описывают неуместное стратегическое взаимодействие: оно создаёт холодную, отчуждающую среду и часто ведёт к потере творчества.",null],"explanation":"Близкие взаимодействия сближают через интерес к мыслям и чувствам друг друга, стратегические - обмен влиянием ради задачи с опорой на иерархию. Рабочей системе нужны оба режима: неуместная близость мешает продуктивности, неуместная стратегия создаёт холодную среду.","source":"Соня Невис, Стефани Бэкман, Эдвин Невис, «Стратегические и близкие взаимодействия», интегративный взгляд","quote":"рабочие отношения, слишком сосредоточенные на межличностной близости - на построении прочных близких союзов, - будут с трудом справляться с работой, особенно с трудными решениями.","by_record":false,"h":"4ccc8560"},{"id":"m4-st-05","module":4,"topic":"Случай Нэнси","kind":"знание","question":"Музыкальный терапевт Нэнси прекрасно строила близкий контакт с участниками группы, но ей было неловко «брать власть», например с мужчиной, который часто перебивал других. Что ей посоветовали?","options":["«Прослаивать» близкие взаимодействия стратегическими, как в сэндвиче","Ещё больше вкладываться в близкий контакт с этим участником","Перевести всю группу в стратегический режим и держать со всеми дистанцию"],"correct":0,"why_not":[null,"Близкие ходы у Нэнси и так получались хорошо. Не хватало другого - умения использовать эти связи для стратегических союзов.","Совет был не заменить близость, а чередовать: уже построенный близкий союз служил опорой, чтобы переключиться и ожидать другого поведения."],"explanation":"Раз близкий союз с участником уже есть, можно на время переключиться: сменить тон, говорить меньше слов и ожидать, что он последует. Потом снова вернуться к близкому контакту.","source":"Соня Невис, Стефани Бэкман, Эдвин Невис, «Стратегические и близкие взаимодействия», интегративный взгляд, случай Нэнси","quote":"Ей нужно по мере необходимости «прослаивать» близкие взаимодействия стратегическими, как в сэндвиче.","by_record":false,"h":"cf439f26"},{"id":"m4-st-06","module":4,"topic":"Случай пары юристов","kind":"знание","question":"Пара юристов быстро составила свод из десяти правил, но разговор всё равно пошёл к конфликту. Чего, по авторам, им не хватило?","options":["Стратегических навыков: правила не удержали фокус на цели","«Подушки» близости: умения спрашивать и подробно отвечать","Честности: полностью высказать друг другу, что чувствуешь"],"correct":1,"why_not":["Авторы пишут обратное: стратегические навыки у пары были хорошо развиты, и в стратегическом режиме они держались хорошо.",null,"Полное раскрытие без учёта того, как оно действует на другого, авторы называют «мифом о близости». Паре не хватало другого - вопросов и подробных ответов."],"explanation":"Когда понадобилась взаимность, пара не смогла переключиться из стратегического режима в близкий. Вопросы и подробные ответы настолько важны в близком режиме, что уместно спросить: «Я ответил на твой вопрос?».","source":"Соня Невис, Стефани Бэкман, Эдвин Невис, «Стратегические и близкие взаимодействия», интегративный взгляд, случай пары","quote":"У их хорошо развитых стратегических навыков не было «подушки» близкого взаимодействия в тот момент, когда она была так нужна.","by_record":false,"h":"96e624b4"},{"id":"m4-st-07","module":4,"topic":"Миф о стратегии","kind":"знание","question":"Авторы разбирают два распространённых мифа о взаимодействиях. В чём состоит «миф о стратегии»?","options":["Близкое взаимодействие требует честного и полного раскрытия","Иерархия уместна и нужна, когда есть работа, которую надо сделать","Действовать без полного обмена осознаванием - неуважение к людям"],"correct":2,"why_not":["Это второй миф - «миф о близости». Авторы советуют дозировать самораскрытие с учётом того, что другой способен воспринять.","Это не миф, а позиция самих авторов из выводов статьи.",null],"explanation":"Стратегические взаимодействия часто называют жёсткими и неподлинными. Авторы возражают: когда нужно действовать, важна экономия времени и сил, а умение изобретать действия, удерживающие энергию на цели, говорит о творческом союзе.","source":"Соня Невис, Стефани Бэкман, Эдвин Невис, «Стратегические и близкие взаимодействия», мифы о близких и стратегических взаимодействиях","quote":"Миф о стратегии: действие без полного и заботливого обмена осознаванием неуважительно к людям.","by_record":false,"h":"f3ce4b70"},{"id":"m4-st-08","module":4,"topic":"Качества стратегических взаимодействий","kind":"знание","question":"Что из этого авторы относят к качествам стратегических взаимодействий?","options":["Способность взять на себя длительный диалог","Делиться только той информацией, что нужна для действия","Обмен спонтанный, без заранее заданного результата"],"correct":1,"why_not":["Это качество близких взаимодействий. В стратегическом режиме, наоборот, нужна способность выдержать потерю полного диалога.",null,"Это тоже качество близких взаимодействий. Стратегический режим - намеренные действия ради желаемой цели."],"explanation":"В стратегическом режиме важна экономия времени: люди держат фокус на цели и не отвлекаются на эмоции. Длительный диалог и спонтанность - качества близкого режима.","source":"Соня Невис, Стефани Бэкман, Эдвин Невис, «Стратегические и близкие взаимодействия», качества стратегических взаимодействий","quote":"Способность всех делиться только той информацией, которая нужна для действия.","by_record":false,"h":"c391166a"},{"id":"m4-st-09","module":4,"topic":"Качества близких взаимодействий","kind":"знание","question":"Какое качество авторы относят к близким взаимодействиям?","options":["Обязательство не обвинять ни себя, ни других","Способность быть резким или дерзким ради экономии времени","Способность мобилизовать энергию перед лицом разочарования"],"correct":0,"why_not":[null,"Это качество стратегических взаимодействий: резкость ради экономии времени допустима по обе стороны иерархии.","Это тоже качество стратегических взаимодействий, где главное - удержаться на пути к цели."],"explanation":"Близкие взаимодействия держатся на взаимности и малой разнице в иерархии: интерес к другому, вопросы и ответы, юмор, готовность влиять и поддаваться влиянию, отказ от обвинений.","source":"Соня Невис, Стефани Бэкман, Эдвин Невис, «Стратегические и близкие взаимодействия», качества близких взаимодействий","quote":"Обязательство не обвинять ни себя, ни других.","by_record":false,"h":"b1578fa2"},{"id":"m4-st-10","module":4,"topic":"Случай А: интеграция режимов","kind":"знание","question":"В случае А консультант 15 часов разбирал с двумя руководителями трудные решения и по ходу говорил им сочувственные и ободряющие вещи. Зачем?","options":["Чтобы руководители согласились на переезд без лишних споров и возражений","Чтобы смягчить разговор и укреплять связь, на которую опиралась работа","Чтобы не говорить им прямо о слабых местах в управлении людьми"],"correct":1,"why_not":["Консультант пишет, что был уверен: руководители свободно могут с ним не согласиться. Сочувствие не было способом добиться согласия.",null,"Он говорил прямо: сказал обоим, что они плохо используют своих людей и слишком мягки в управлении."],"explanation":"Консультант всё время переходил между режимами: бросал вызов и задавал трудные вопросы (стратегический режим) и тут же поддерживал (близкий режим). Со стороны это выглядело как бесшовный процесс.","source":"Соня Невис, Стефани Бэкман, Эдвин Невис, «Стратегические и близкие взаимодействия», интеграция двух режимов, случай А","quote":"Я делал это, чтобы смягчить разговор и продолжать укреплять близкую связь, на которую мы опирались в трудной работе.","by_record":false,"h":"b4e31eaf"},{"id":"m4-st-11","module":4,"topic":"Случай Б: порядок режимов","kind":"знание","question":"Руководитель спрашивает консультанта, стоит ли снова выразить сочувствие подчинённому, у которого умер кто-то в семье. Она руководит им около года. Что советует консультант и почему?","options":["Не повторять: стратегическая связь с ним ещё недостаточно прочная","Не повторять: руководителю не стоит переходить в близкий режим с подчинёнными","Выразить: близкий обмен сам укрепит пока слабую рабочую связь"],"correct":0,"why_not":[null,"Совет другой: короткие близкие встречи с подчинённым ей допустимы, а начальнику с прочной рабочей связью сочувствие советуют выразить.","Совет обратный: раз рабочую связь нужно укреплять, лучше сначала поработать над ней, а уже потом уравновешивать её близким обменом."],"explanation":"С начальником, у которого она работает около семи лет и с которым у неё прочная стратегическая связь, сочувствие уместно. С подчинённым, которым она руководит около года, сначала стоит укрепить рабочую связь, а уже потом уравновешивать её близким обменом.","source":"Соня Невис, Стефани Бэкман, Эдвин Невис, «Стратегические и близкие взаимодействия», интеграция двух режимов, случай Б","quote":"Я сказал, что, судя по всему, стратегическая связь ещё недостаточно прочная.","by_record":false,"h":"1c87fd40"},{"id":"m4-st-12","module":4,"topic":"Выводы о лидерстве","kind":"знание","question":"Каким выводом о лидерстве авторы заканчивают статью?","options":["Лидеру стоит сокращать иерархическую дистанцию с теми, за кого он в ответе","Лидеру лучше держаться стратегического режима, а близость оставить семье","Разносторонний лидер лучше всего работает с разносторонними последователями"],"correct":2,"why_not":["Это призыв социологов и теоретиков организаций, с которым авторы спорят: иерархия уместна и необходима, когда у людей есть работа.","Авторы пишут, что рабочие системы не могут быть эффективны без близкого поведения, а стратегические взаимодействия эффективнее, когда в истории отношений есть близкие.",null],"explanation":"Модель касается важной стороны лидерства: уметь и вести, и сближаться. В случае А авторы добавляют, что она описывает и хорошее лидерство, и хорошее умение быть подчинённым.","source":"Соня Невис, Стефани Бэкман, Эдвин Невис, «Стратегические и близкие взаимодействия», выводы и следствия","quote":"разносторонний лидер лучше всего работает с разносторонними последователями.","by_record":false,"h":"a4c0ede4"}];

  let seen = 0, right = 0, wrong = 0;
  for (const q of list) { const r = rec(q); if (!r) continue; seen++; if (r.last) right++; else wrong++; }
  return { total: list.length, seen, right, wrong };
}
const byModule = n => BANK.filter(q => q.module === n);

// ---------- старт
function renderHome() {
  const all = statsFor(BANK);
  $('total').innerHTML = '';
  $('total').append('Видел ', el('b', null, `${all.seen} из ${all.total}`), ', сейчас верно ', el('b', null, String(all.right)));

  const cards = $('cards');
  cards.innerHTML = '';
  for (const m of MODULES) {
    const list = byModule(m.n);
    const s = statsFor(list);
    const c = el('div', 'card');
    c.dataset.module = m.n;
    c.append(el('div', 'when', m.when), el('div', 'title', m.title));
    if (m.note) c.append(el('div', 'note', m.note));
    if (!list.length) { c.append(el('div', 'quiet', 'Вопросов пока нет')); cards.append(c); continue; }

    const st = el('div', 'stats');
    const a = el('span'); a.append('видел ', el('b', null, `${s.seen} из ${s.total}`));
    const b = el('span'); b.append('сейчас верно ', el('b', null, String(s.right)));
    st.append(a, b);
    const bar = el('div', 'bar');
    const iSeen = el('i', 'seen'); iSeen.style.width = (s.seen / s.total * 100) + '%';
    const iRight = el('i', 'right'); iRight.style.width = (s.right / s.total * 100) + '%';
    bar.append(iSeen, iRight);

    const act = el('div', 'actions');
    const label = s.seen === 0 ? 'Начать' : s.seen < s.total ? 'Продолжить' : 'Ещё раунд';
    const start = el('button', 'btn primary', label);
    start.dataset.act = 'start';
    start.onclick = () => startRound({ kind: 'module', module: m.n });
    act.append(start);
    if (s.wrong) {
      const eb = el('button', 'btn errors', `Разобрать ошибки (${s.wrong})`);
      eb.dataset.act = 'errors';
      eb.onclick = () => startRound({ kind: 'errors', module: m.n });
      act.append(eb);
    } else if (s.seen) {
      act.append(el('span', 'quiet', 'ошибок пока нет'));
    }
    act.append(el('span', 'spacer'));
    if (s.seen) act.append(resetControl(`Сбросить модуль`, () => { for (const q of list) delete state.q[q.id]; save(); renderHome(); }));
    c.append(st, bar, act);
    cards.append(c);
  }

  const me = $('mixedErrors');
  me.innerHTML = '';
  if (all.wrong) {
    const eb = el('button', 'btn errors', `Все ошибки (${all.wrong})`);
    eb.id = 'mixedErrorsBtn';
    eb.onclick = () => startRound({ kind: 'errors', module: null });
    me.append(eb);
  } else if (all.seen) {
    me.append(el('span', 'quiet', 'ошибок пока нет'));
  }
  $('mixedStart').textContent = all.seen === 0 ? 'Начать' : all.seen < all.total ? 'Продолжить' : 'Ещё раунд';

  const box = $('resetAllBox');
  box.innerHTML = '';
  if (all.seen || Object.keys(state.q).length) box.append(resetControl('Сбросить весь прогресс', () => { state = { v: 1, q: {} }; save(); renderHome(); }));
  renderStorageNote();
}

// сброс в два шага: ссылка, затем «Да / Нет» на месте
function resetControl(text, onYes) {
  const span = el('span');
  const link = el('button', 'link', text);
  link.dataset.act = 'reset';
  link.onclick = () => {
    span.innerHTML = '';
    const box = el('span', 'confirm', 'Точно сбросить?');
    const yes = el('button', 'btn', 'Да'); yes.dataset.act = 'reset-yes';
    const no = el('button', 'btn', 'Нет'); no.dataset.act = 'reset-no';
    yes.onclick = onYes;
    no.onclick = () => { span.innerHTML = ''; span.append(link); };
    box.append(yes, no);
    span.append(box);
    no.focus();
  };
  span.append(link);
  return span;
}

function renderStorageNote() {
  $('storageNote').textContent = storageOk
    ? 'Прогресс сохраняется в этом браузере'
    : 'Браузер не даёт сохранять данные: прогресс живёт, пока открыта вкладка';
}

// ---------- раунд
let round = null;

function pickRound(mode) {
  const pool = mode.module ? byModule(mode.module) : BANK;
  if (mode.kind === 'errors') return shuffle(pool.filter(q => { const r = rec(q); return r && !r.last; })).slice(0, ROUND);
  const unseen = shuffle(pool.filter(q => !rec(q)));
  const wrong = shuffle(pool.filter(q => { const r = rec(q); return r && !r.last; }));
  const right = shuffle(pool.filter(q => { const r = rec(q); return r && r.last; }));
  return unseen.concat(wrong, right).slice(0, ROUND);
}

function modeLabel(mode) {
  const where = mode.module ? `Модуль ${mode.module}` : 'Все модули';
  return mode.kind === 'errors' ? `${where}: работа над ошибками` : `${where}: раунд`;
}

function startRound(mode) {
  const list = pickRound(mode);
  if (!list.length) { renderHome(); return; }
  round = { mode, list, i: 0, results: [] };
  show('quiz');
  renderQuestion();
}

let cur = null; // текущий показ: вопрос, порядок вариантов, ответ

function renderQuestion() {
  const q = round.list[round.i];
  cur = { q, order: shuffle([0, 1, 2]), answered: false };
  $('modeLabel').textContent = modeLabel(round.mode);
  $('count').innerHTML = '';
  $('count').append('Вопрос ', el('b', null, String(round.i + 1)), ` из ${round.list.length}`);
  $('qbar').style.width = (round.i / round.list.length * 100) + '%';

  const tags = $('tags');
  tags.innerHTML = '';
  tags.append(el('span', 'tag', `Модуль ${q.module}`));
  if (q.kind === 'применение') tags.append(el('span', 'tag apply', 'Применение к моей работе'));

  $('question').textContent = q.question;
  const opts = $('opts');
  opts.innerHTML = '';
  cur.order.forEach((orig, pos) => {
    const b = el('button', 'opt');
    b.dataset.orig = orig;
    b.append(el('span', 'num', String(pos + 1)), el('span', null, q.options[orig]));
    b.onclick = () => answer(orig);
    opts.append(b);
  });
  $('feedback').classList.add('hidden');
  $('next').classList.add('hidden');
  window.scrollTo(0, 0);
}

function answer(orig) {
  if (!cur || cur.answered) return;
  cur.answered = true;
  const q = cur.q;
  const ok = orig === q.correct;
  const prev = state.q[q.id] && state.q[q.id].h === q.h ? state.q[q.id] : null;
  state.q[q.id] = { h: q.h, last: ok, n: (prev ? prev.n : 0) + 1 };
  save();
  round.results.push({ q, ok, chosen: orig });

  for (const b of $('opts').children) {
    const o = Number(b.dataset.orig);
    b.disabled = true;
    if (o === q.correct) b.classList.add('is-right');
    else if (o === orig) b.classList.add('is-wrong');
    else b.classList.add('is-dim');
  }
  const topicTag = el('span', 'tag', 'Тема: ' + q.topic); // тему показываем после ответа: она может подсказывать
  topicTag.id = 'topicTag';
  $('tags').append(topicTag);
  const v = $('verdict');
  v.textContent = ok ? 'Верно' : 'Неверно';
  v.className = 'verdict ' + (ok ? 'ok' : 'bad');
  const ra = $('rightAns');
  ra.innerHTML = '';
  if (!ok) ra.append('Правильный ответ: ', el('b', null, q.options[q.correct]));
  ra.classList.toggle('hidden', ok);
  $('expl').textContent = q.explanation;
  const wn = $('whynot');
  if (!ok && q.why_not[orig]) {
    wn.innerHTML = '';
    wn.append(el('span', null, 'Почему не этот вариант: '), q.why_not[orig]);
    wn.classList.remove('hidden');
  } else wn.classList.add('hidden');
  $('src').textContent = 'Источник: ' + q.source;
  $('record').classList.toggle('hidden', !q.by_record);
  $('quote').textContent = (/^[a-zа-яё]/.test(q.quote) ? '… ' : '') + q.quote; // фрагмент с середины фразы
  $('quote').classList.add('hidden');
  $('quoteToggle').textContent = 'Показать место в тексте';
  $('feedback').classList.remove('hidden');

  const last = round.i === round.list.length - 1;
  const nx = $('next');
  nx.textContent = last ? 'Итог раунда' : 'Дальше';
  nx.classList.remove('hidden');
  $('qbar').style.width = ((round.i + 1) / round.list.length * 100) + '%';
  nx.focus({ preventScroll: true });
}

function next() {
  if (!cur || !cur.answered) return;
  cur = null;
  round.i++;
  if (round.i >= round.list.length) finishRound();
  else renderQuestion();
}

function finishRound() {
  const r = round.results;
  const right = r.filter(x => x.ok).length;
  const score = $('doneScore');
  score.innerHTML = '';
  score.append('Верно ', el('em', null, `${right} из ${r.length}`));
  const misses = r.filter(x => !x.ok);
  $('doneNote').textContent = misses.length
    ? `${misses.length} ${plural(misses.length, 'вопрос ушёл', 'вопроса ушли', 'вопросов ушли')} в работу над ошибками. Ответишь верно - уйдут оттуда.`
    : (round.mode.kind === 'errors' ? 'Все ошибки этого раунда исправлены.' : 'Ни одной ошибки в раунде.');
  const ul = $('misses');
  ul.innerHTML = '';
  for (const m of misses) {
    const li = el('li');
    li.append(el('div', 'q', m.q.question), el('div', 'a', 'Верно: ' + m.q.options[m.q.correct]));
    ul.append(li);
  }
  const again = $('again');
  const left = pickRound(round.mode).length;
  again.classList.toggle('hidden', left === 0);
  again.textContent = round.mode.kind === 'errors' ? 'Ещё раз по ошибкам' : 'Ещё раунд';
  show('done');
  again.classList.contains('hidden') ? $('toHome').focus() : again.focus();
}

function show(id) {
  for (const s of ['home', 'quiz', 'done']) $(s).classList.toggle('hidden', s !== id);
  if (id === 'home') { round = null; cur = null; renderHome(); }
  window.scrollTo(0, 0);
}

// ---------- события
$('mixedStart').onclick = () => startRound({ kind: 'module', module: null });
$('exit').onclick = () => show('home');
$('toHome').onclick = () => show('home');
$('again').onclick = () => startRound(round.mode);
$('next').onclick = () => next();
$('quoteToggle').onclick = () => {
  const qe = $('quote');
  const open = qe.classList.toggle('hidden') === false;
  $('quoteToggle').textContent = open ? 'Скрыть место в тексте' : 'Показать место в тексте';
};
document.addEventListener('keydown', e => {
  if ($('quiz').classList.contains('hidden') || !cur || e.ctrlKey || e.metaKey || e.altKey) return;
  if (!cur.answered && ['1', '2', '3'].includes(e.key)) {
    e.preventDefault();
    answer(cur.order[Number(e.key) - 1]);
  } else if (cur.answered && e.key === 'Enter') {
    e.preventDefault(); // иначе Enter на кнопке «Дальше» даст второй клик
    next();
  }
});

show('home');
</script>
</body>
</html>
