<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Управление группой - викторина</title>
<style>
:root {
  --bg: #121419;
  --surface: #1a1d24;
  --surface-2: #22262f;
  --line: #2e333e;
  --text: #e9e6df;
  --muted: #9ba1ab;
  --faint: #6c727d;
  --accent: #d9a55b;
  --accent-ink: #1a1408;
  --ok: #72c08f;
  --ok-bg: rgba(114, 192, 143, .12);
  --bad: #e2806f;
  --bad-bg: rgba(226, 128, 111, .12);
  --radius: 12px;
  --serif: Georgia, "Cambria", "Times New Roman", serif;
  --sans: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font: 16px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
.wrap { max-width: 900px; margin: 0 auto; padding: 40px 24px 64px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, .opt:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.hidden { display: none !important; }

/* шапка */
header.top { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 32px; flex-wrap: wrap; }
h1 { font: 600 28px/1.2 var(--serif); margin: 0; letter-spacing: .2px; }
.sub { color: var(--muted); font-size: 14px; margin-top: 6px; }
.total { color: var(--muted); font-size: 14px; text-align: right; }
.total b { color: var(--text); font-weight: 600; }

/* секции */
h2 { font: 600 13px/1 var(--sans); letter-spacing: 1.4px; text-transform: uppercase; color: var(--muted); margin: 0 0 14px; }
section { margin-bottom: 36px; }

/* карточки модулей */
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px 20px 16px; display: flex; flex-direction: column; gap: 12px; }
.card .when { font-size: 12px; letter-spacing: .6px; text-transform: uppercase; color: var(--faint); }
.card .title { font: 600 19px/1.3 var(--serif); }
.card .note { font-size: 13px; color: var(--accent); opacity: .85; }
.stats { display: flex; gap: 18px; font-size: 14px; color: var(--muted); flex-wrap: wrap; }
.stats b { color: var(--text); font-weight: 600; }
.bar { position: relative; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; }
.bar .seen { background: #3a404c; }
.bar .right { background: var(--ok); }
.actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 2px; }
.btn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 9px; padding: 8px 14px; font-size: 14px; transition: border-color .15s, background .15s; }
.btn:hover { border-color: #4a5160; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.errors { border-color: rgba(226, 128, 111, .45); color: var(--bad); background: transparent; }
.btn.errors:hover { background: var(--bad-bg); }
.quiet { font-size: 13px; color: var(--faint); }
.link { background: none; border: 0; padding: 4px 2px; font-size: 13px; color: var(--faint); text-decoration: underline; text-underline-offset: 3px; }
.link:hover { color: var(--muted); }
.spacer { flex: 1; }
.confirm { font-size: 13px; color: var(--bad); display: inline-flex; gap: 8px; align-items: center; }
.confirm .btn { padding: 4px 10px; font-size: 13px; }

.mixed { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.mixed .title { font: 600 18px/1.3 var(--serif); }
.foot { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 18px; }

/* экран вопроса */
.qhead { display: flex; align-items: center; gap: 8px 16px; margin-bottom: 18px; flex-wrap: wrap; }
.qhead .mode { font-size: 14px; color: var(--muted); }
.qhead .count { font-size: 14px; color: var(--muted); margin-left: auto; }
.qhead .count b { color: var(--text); }
.qbar { height: 4px; border-radius: 2px; background: var(--surface-2); margin-bottom: 28px; overflow: hidden; }
.qbar i { display: block; height: 100%; background: var(--accent); transition: width .25s; }
.tags { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.tag { font-size: 12px; padding: 3px 9px; border-radius: 99px; background: var(--surface-2); color: var(--muted); }
.tag.apply { color: var(--accent); background: rgba(217, 165, 91, .12); }
.question { font: 500 23px/1.45 var(--serif); margin: 0 0 24px; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { display: flex; gap: 14px; align-items: flex-start; text-align: left; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; font-size: 17px; line-height: 1.45; transition: border-color .15s, background .15s; }
.opt:not(:disabled):hover { border-color: #525a6a; background: #1e222a; }
.opt .num { flex: none; width: 26px; height: 26px; border-radius: 7px; background: var(--surface-2); color: var(--muted); font-size: 13px; display: grid; place-items: center; margin-top: 1px; }
.opt:disabled { cursor: default; }
.opt.is-right { border-color: var(--ok); background: var(--ok-bg); }
.opt.is-right .num { background: var(--ok); color: #0d1a12; }
.opt.is-wrong { border-color: var(--bad); background: var(--bad-bg); }
.opt.is-wrong .num { background: var(--bad); color: #1f0f0b; }
.opt.is-dim { opacity: .55; }

.feedback { margin-top: 22px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; }
.verdict { font: 600 18px/1.3 var(--sans); margin-bottom: 8px; }
.verdict.ok { color: var(--ok); }
.verdict.bad { color: var(--bad); }
.expl { font: 16.5px/1.6 var(--sans); margin: 0 0 12px; }
.rightans { font-size: 15.5px; color: var(--ok); margin: 0 0 10px; }
.rightans b { font-weight: 600; }
.whynot { font-size: 15px; color: var(--text); background: var(--bad-bg); border-radius: 9px; padding: 10px 12px; margin: 0 0 12px; }
.whynot span { color: var(--bad); }
.src { font-size: 14px; color: var(--muted); }
.record { font-size: 13px; color: var(--accent); margin-top: 4px; }
.quote { margin: 12px 0 0; padding: 10px 14px; border-left: 3px solid var(--line); color: var(--muted); font: italic 15px/1.55 var(--serif); }
.qfoot { display: flex; align-items: center; gap: 16px; margin-top: 22px; flex-wrap: wrap; }
.keys { font-size: 12px; color: var(--faint); }

/* итог раунда */
.result { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 28px 24px; }
.result .big { font: 600 34px/1.2 var(--serif); margin: 0 0 6px; }
.result .big em { font-style: normal; color: var(--accent); }
.misses { margin: 22px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
.misses li { border-top: 1px solid var(--line); padding-top: 10px; font-size: 15px; }
.misses .q { color: var(--muted); }
.misses .a { color: var(--ok); }
@media (max-width: 520px) {
  .wrap { padding: 24px 16px 48px; }
  .question { font-size: 20px; }
  .opt { font-size: 16px; }
  h1 { font-size: 24px; }
}
@media (hover: none) { .keys { display: none; } }
</style>
</head>
<body>
<div class="wrap">

  <!-- старт -->
  <main id="home">
    <header class="top">
      <div>
        <h1>Управление группой</h1>
        <div class="sub">Викторина по материалам сессий 1-4 перед пятой сессией 04-06.12.2026</div>
      </div>
      <div class="total" id="total"></div>
    </header>

    <section>
      <h2>Модули</h2>
      <div class="grid" id="cards"></div>
    </section>

    <section>
      <h2>Все модули вперемешку</h2>
      <div class="mixed">
        <div>
          <div class="title">Смешанный раунд</div>
          <div class="quiet">15 вопросов из всех модулей, сначала те, что ещё не встречались</div>
        </div>
        <span class="spacer"></span>
        <span id="mixedErrors"></span>
        <button class="btn primary" id="mixedStart">Начать</button>
      </div>
    </section>

    <div class="foot">
      <span class="quiet" id="storageNote"></span>
      <span class="spacer"></span>
      <span id="resetAllBox"><button class="link" id="resetAll">Сбросить весь прогресс</button></span>
    </div>
  </main>

  <!-- вопрос -->
  <main id="quiz" class="hidden">
    <div class="qhead">
      <button class="btn" id="exit">К модулям</button>
      <span class="mode" id="modeLabel"></span>
      <span class="count" id="count"></span>
    </div>
    <div class="qbar"><i id="qbar"></i></div>
    <div class="tags" id="tags"></div>
    <p class="question" id="question"></p>
    <div class="opts" id="opts"></div>
    <div class="feedback hidden" id="feedback">
      <div class="verdict" id="verdict"></div>
      <p class="rightans hidden" id="rightAns"></p>
      <p class="expl" id="expl"></p>
      <p class="whynot hidden" id="whynot"></p>
      <div class="src" id="src"></div>
      <div class="record hidden" id="record">По записи сессии, в статьях не проверено</div>
      <button class="link" id="quoteToggle">Показать место в тексте</button>
      <blockquote class="quote hidden" id="quote"></blockquote>
    </div>
    <div class="qfoot">
      <button class="btn primary hidden" id="next">Дальше</button>
      <span class="keys">Клавиши: 1, 2, 3 - ответ; Enter - дальше</span>
    </div>
  </main>

  <!-- итог раунда -->
  <main id="done" class="hidden">
    <div class="result">
      <p class="big" id="doneScore"></p>
      <div class="quiet" id="doneNote"></div>
      <ul class="misses" id="misses"></ul>
      <div class="actions" style="margin-top:24px">
        <button class="btn primary" id="again">Ещё раунд</button>
        <button class="btn" id="toHome">К модулям</button>
      </div>
    </div>
  </main>

</div>
<script>
const BANK = [{"id":"m1-pv-02-01","module":1,"topic":"Модель «сломанного колеса»","kind":"знание","question":"Ранние группы Перлза прозвали моделью «сломанного колеса». Что в этой модели было осью, а что спицами?","options":["Ось - терапевт, спицы - клиенты, которые по одному сменяются на горячем стуле","Ось - группа в роли греческого хора, спицы - роли, которые клиент озвучивает на пустом стуле","Ось - принцип «здесь-и-сейчас», спицы - гештальт-психология, дзен-буддизм, феноменология, экзистенциализм"],"correct":0,"why_not":[null,"Хор и пустой стул в модели были, но хор - это роль остальной группы, а пустой стул - техника диалога. Осью колеса Павлов называет терапевта.","Из этих четырёх источников Перлз собрал свой синтез, на нём держался его натиск. К образу колеса Павлов их не относит."],"explanation":"Павлов объясняет название так: терапевт в центре, как ось, а клиенты по одному выходят к нему на горячий стул, как спицы. Остальная группа откликается на происходящее своими чувствами, как хор в греческом театре.","source":"Павлов, «Много часов для себя», раздел 2: гештальт-группы в прошлом","quote":"Имеется в виду центральная роль терапевта – «оси колеса» – при последовательно сменяющейся роли «спиц» - индивидуальных клиентов, принимающих участие в сессиях.","by_record":false,"h":"9e8b1ba4"},{"id":"m1-zp-01","module":1,"topic":"Четыре вопроса Сидоренко","kind":"знание","question":"В записи сессии разбирали четыре вопроса Сидоренко к тому, кто работает с людьми. Какой из них про личный драйв и источник энергии?","options":["«Чего я хочу делать с людьми?»","«Чего я могу делать с людьми?»","«Чего им нужно, чтобы было сделано с ними?»"],"correct":0,"why_not":[null,"«Я могу» - это зона компетенций и навыков. На сессии предупреждали, что застревание в «я могу» ведёт к выгоранию.","Это вопрос про настоящую потребность клиента, которая может не совпадать с его запросом."],"explanation":"«Я хочу» - зона личного драйва: отсюда берётся энергия и движение. Совет с сессии - не оставлять эту зону в тумане и записывать свои желания, даже если они кажутся недостижимыми.","source":"Запись сессии 14.12.2025, раздел про вопросы Сидоренко","quote":"**Чего я хочу делать с людьми?** Это зона личного драйва, источник энергии.","by_record":true,"h":"50cf271d"},{"id":"m2-ya-01-01","module":2,"topic":"Универсальность","kind":"знание","question":"Ялом годами просил участников групп анонимно записать главный секрет, которым они не хотели бы делиться. Какой секрет встречался чаще всего?","options":["Убеждение в своей неадекватности: узнают настоящего меня - откроется некомпетентность","Чувство отчуждения: я не умею по-настоящему заботиться о других и любить их","Сексуальный секрет, например страх перед гомосексуальными наклонностями"],"correct":0,"why_not":[null,"Отчуждение тоже частый секрет, но в конспекте оно идёт вторым: встречается чуть реже.","Сексуальные секреты у Ялома на третьем месте."],"explanation":"Секреты людей оказались удивительно похожи, и чаще всего это страх, что тебя раскроют как некомпетентного. На этом держится универсальность: человек видит, что он не один такой, и ему становится легче.","source":"Ялом, «Групповая психотерапия», гл. 1, универсальность, с. 11 - по конспекту","quote":"Самый распространённый - глубокое убеждение в своей неадекватности","by_record":false,"h":"9bfcc6ae"},{"id":"m2-pa-02-01","module":2,"topic":"Принцип единовременности","kind":"знание","question":"Как гештальт-терапевт по принципу единовременности работает с тяжёлым прошлым клиентки, например с пережитым насилием?","options":["Интересуется, как это событие вспоминается и что оно значит для неё сейчас","Ищет в этом событии причину, которая определяет её поведение сегодня","Оставляет историю в стороне и работает только с тем, что происходит в кабинете"],"correct":0,"why_not":[null,"Так смотрят многие другие системы. Парлетт пишет, что у принципа единовременности нет особой причинной связи с прошлым, которое будто бы предопределяет настоящее.","Парлетт прямо оговаривает: терапевт не хочет игнорировать историю клиентки, он смотрит на то, как прошлое живёт в настоящем."],"explanation":"Поведение объясняют факторы, которые действуют сейчас. Прошлое входит в них как прошлое, которое человек помнит сегодня, поэтому терапевту важно, как событие вспоминается и какой смысл имеет теперь.","source":"Парлетт, «Раздумья о теории поля», принцип единовременности","quote":"наше внимание направлено, в случае насилия, в первую очередь, на то, как оно вспоминается, или какое оно имеет сейчас значение","by_record":false,"h":"17c975c3"},{"id":"m3-op-01","module":3,"topic":"Из чего состоит оптимизм","kind":"знание","question":"Из каких двух компонентов, по Джозефу Мельнику и Соне Невис, состоит оптимизм, если смотреть на него как на процесс?","options":["Надежда и мужество","Предрасположенность и ожидание","Когниции и физическая ориентация"],"correct":0,"why_not":[null,"Эти слова авторы вычитывают из словарного определения оптимизма, чтобы показать сложность понятия. Процессные компоненты они называют отдельно.","Это стороны оптимистической ориентации: что я себе говорю и как держу тело. Компонентами процесса авторы их не называют."],"explanation":"Надежда помогает сформулировать желания и увидеть будущее, но сама по себе не толкает к действию. Мужество превращает её энергию в действие, поэтому оптимизму нужны оба компонента.","source":"Джозеф Мельник, Соня Невис, «Оптимизм», раздел об определении оптимизма","quote":"С точки зрения процесса, оптимизм состоит из двух компонентов - надежды и мужества.","by_record":false,"h":"a754a4e6"},{"id":"m4-ne-08-01","module":4,"topic":"Как смотреть на сопротивление","kind":"знание","question":"Эдвин Невис предлагает упразднить термин «сопротивление». Как, по его словам, лучше смотреть на людей, которые будто бы отказываются сотрудничать?","options":["Как на разнонаправленную энергию: много сил сразу","Как на защитников, которые отстаивают традиции организации","Как на нехватку энергии, которую консультанту надо восполнить"],"correct":0,"why_not":[null,"Роль «защитника» ввёл Кляйн, и Невис считает его взгляд более приемлемым. Но собственный термин он предлагает другой.","Невис пишет обратное: все виды сопротивления - это мобилизация энергии, а не её недостаток."],"explanation":"Слово «сопротивление» стало значить противостояние и одностороннюю реакцию. Невис предлагает видеть в отказе много сил сразу, часть которых тянет в разные стороны.","source":"Эдвин Невис, «Организационное консультирование», гл. 8, о смысле сопротивления","quote":"Я предлагаю вообще упразднить термин \"сопротивление\", поскольку он стал обозначать противостояние или одностороннюю реакцию.","by_record":false,"h":"8df9555c"},{"id":"m1-pv-01-01","module":1,"topic":"Как понять поведение группы","kind":"знание","question":"Павлов разбирает поведение болельщиков «Зенита» и «Бенфики» на матче. Как, по его словам, это поведение можно понять и предсказать?","options":["Разобрав психику каждого отдельного болельщика и сложив из этого картину группы","С учётом культур городов, стран и субкультур, к которым относятся болельщики","Наблюдая только за тем, что происходит с группой здесь-и-сейчас на стадионе"],"correct":1,"why_not":["Павлов пишет, что в XX веке проявилась недостаточность попыток объяснять социальные явления, отталкиваясь от анализа индивидуальной психики.",null,"Для этого примера Павлов называет знание о культурах Петербурга, России и Португалии, о молодёжных субкультурах и мужских сообществах, то есть более крупные уровни системы, а не одну ситуацию на стадионе."],"explanation":"Гештальтист сначала ищет место явления в системе: группу видно и как объединение людей, и как часть большего сообщества - организации, города, нации. На этом фоне смысл явления становится понятен.","source":"Павлов, «Много часов для себя», раздел 1: группа как уровень системы","quote":"поведение и взаимодействие групп, скажем, болельщиков футбольных клубов «Зенит» и «Бенфика» до, после и во время матча может быть понято, проанализировано и, если нужно, - предсказано только с учетом знания о культурах Санкт-Петербурга, России и Португалии","by_record":false,"h":"d2425f68"},{"id":"m1-pv-01-02","module":1,"topic":"Откуда вырос тренинг","kind":"знание","question":"Из чьего наследия, по Павлову, выросло всё многообразие активных форм обучения, которые называют «тренингом»?","options":["Из трудов Тарда, Лебона и Бехтерева о психологии группы и толпы","Из психодрамы Якоба Морено с её театральностью и драматизмом","Из National Training Laboratories, где работал Курт Левин"],"correct":2,"why_not":["Эти труды Павлов называет одними из первых условно научных и «довольно наивных» попыток разобрать психологию группы. Тренинг он с ними не связывает.","У Морено, по Павлову, Перлз взял театральность своих групп. Происхождение тренинга Павлов связывает с другой школой.",null],"explanation":"В 40-е годы Курт Левин в National Training Laboratories создал теорию поля в прикладном варианте для социальных систем - взгляд, по которому явление нельзя понять в отрыве от его среды. Из наследия NTL выросли активные формы обучения, а Левин показал, что группа как «живой организм» сильно влияет на поведение участников, порой меняя его до неузнаваемости.","source":"Павлов, «Много часов для себя», раздел 1: история работы с группами","quote":"Именно из наследия NTL выросло всё то многообразие специфических активных форм обучения, за которыми закрепилось общее название «тренинг».","by_record":false,"h":"90f2410c"},{"id":"m1-pv-01-03","module":1,"topic":"Тематические и процессные группы","kind":"знание","question":"В какой группе, по Павлову, опыт и знания участников не слишком, а порой и вовсе не интересуют ведущего?","options":["В эксперт-центрированной тематической группе","Во взаимообогащающей тематической группе","В процессной группе без заранее заданной темы"],"correct":0,"why_not":[null,"Здесь, наоборот, опыт участников важен для результата, а ведущий организует обмен опытом.","В процессной группе материал для роста даёт сам участник: его поведение в группе, обратные связи других, внимание к чувствам и телу."],"explanation":"В эксперт-центрированной группе ведущий - безусловный носитель знания, его задача - передать экспертизу участникам. Классический пример Павлова - школьный учитель, который обязан передать ученикам таблицу умножения.","source":"Павлов, «Много часов для себя», раздел 1: тематические и процессные группы","quote":"В данном варианте опыт и знания участников группы не слишком интересуют ведущего, а, порой - вовсе не интересуют.","by_record":false,"h":"105e57f0"},{"id":"m1-pv-01-04","module":1,"topic":"Идея процессной группы","kind":"знание","question":"На каком предположении, по Павлову, строится вся модель процессной работы с группой?","options":["Ведущий передаёт группе проверенные знания и алгоритмы по заданной теме","Участник в группе отчасти повторяет свои способы общаться с миром","Чем ярче и необычнее опыт участников в упражнениях, тем больше от него пользы"],"correct":1,"why_not":["Так устроена тематическая группа с экспертом во главе. В процессной группе заранее заданной темы нет.",null,"Это ценность экспериентального течения, которое Павлов описывает в разделе о гештальт-группах сегодня. К основе процессной модели он её не относит."],"explanation":"Павлов формулирует это так: «макропроцесс повторяется в микропроцессах». В том, как человек ведёт себя в группе здесь-и-теперь, видны его устойчивые привычки общения с людьми, поэтому группа даёт материал, чтобы эти привычки осознать.","source":"Павлов, «Много часов для себя», раздел 1: тематические и процессные группы","quote":"Считается, что те процессы, которые происходят с каждым из участников, повторяют в определенной степени характерные способы взаимодействия человека с миром ... Именно на данном теоретическом предположении строится вся модель процессной работы с группой.","by_record":false,"h":"0979b5f6"},{"id":"m1-pv-01-05","module":1,"topic":"Откуда осознанность в процессной группе","kind":"знание","question":"Из чего, по Павлову, в процессной группе вырастает у участника новая осознанность своих привычных реакций?","options":["Из теоретических блоков ведущего о типичных паттернах поведения","Из обмена опытом, который ведущий организует между участниками","Из обратных связей участников и точечных замечаний ведущего"],"correct":2,"why_not":["Большие теоретические блоки ведущего Павлов описывает у прагматизма. В процессной группе ведущий говорит точечно о том, что видит у конкретного участника.","Организация обмена опытом - задача ведущего во взаимообогащающей тематической группе, а не в процессной.",null],"explanation":"Ведущий процессной группы точечно говорит о том, что наблюдает у конкретного человека, о его типичных паттернах, а другие участники дают обратную связь. Ещё помогает принятая в группе культура внимания к своим чувствам и телесным ощущениям, а не только к мыслям.","source":"Павлов, «Много часов для себя», раздел 1: тематические и процессные группы","quote":"Данная осознанность базируется на обратных связях от участников группы, а также на точечных интервенциях ведущего о наблюдаемых феноменологических проявлениях участника, о типовых паттернах поведения, присущих данному члену процессной группы.","by_record":false,"h":"7f1297e2"},{"id":"m1-pv-01-06","module":1,"topic":"Экспертное и процессное консультирование","kind":"знание","question":"Чем, по Павлову, процессный консультант отличается от экспертного?","options":["Делает акцент на активной позиции клиента, который вырабатывает свои решения","Отрицает, что бывают типовые механизмы обучения и решения проблем","Верит в оптимальные алгоритмы и умеет передавать свою экспертизу клиенту"],"correct":0,"why_not":[null,"Павлов прямо оговаривает: в процессном подходе не отрицают возможность помыслить «типовые механизмы», акцент просто сделан на другом.","Это вера экспертного консультанта. Его метафоры у Павлова - «врач - больной» и «автомеханик - автолюбитель со сломанной машиной»."],"explanation":"Считается, что решение, найденное самим человеком при поддержке, прочнее прямого совета и воспринимается как личное достижение. Типичные слова такого клиента: «Я - сам! Я - могу! Это - мой опыт!»","source":"Павлов, «Много часов для себя», раздел 1: экспертное и процессное консультирование","quote":"Скорее, в процессном подходе акцентируют внимание на важности активной позиции консультируемого в выработке собственных алгоритмов решения жизненных сложностей.","by_record":false,"h":"732e0a64"},{"id":"m1-pv-02-02","module":1,"topic":"Самолёт из веток","kind":"знание","question":"Павлов вспоминает дикарей, которые сделали самолёт из коры и веток и расстроились, что он не летит. Что он этим объясняет?","options":["Почему модель «сломанного колеса» перестала работать в больших группах","Почему яркость Перлза у подражателей без опыта дала «бум-бум терапию»","Почему академическая психология не признавала у гештальта стройной теории"],"correct":1,"why_not":["Павлов, наоборот, пишет, что многие гештальтисты и сегодня работают преимущественно по этой модели. Метафора самолёта - про копирование формы.",null,"Спор с академиками Павлов разбирает в разделе о маргинальности гештальта, и метафоры самолёта там нет."],"explanation":"Скопировав форму, не скопируешь содержание и функцию. Подражатели перенимали яркость и драматизм Перлза без его клинического опыта и глубины, и получалось шумное и малополезное шоу - Роберт Резник назвал его «бум-бум терапией».","source":"Павлов, «Много часов для себя», раздел 2: гештальт-группы в прошлом","quote":"Разумеется, не следует думать, что, скопировав форму, непременно скопируешь и содержание, и функцию!","by_record":false,"h":"5a867a7b"},{"id":"m1-pv-02-03","module":1,"topic":"Быстрота интервенций Перлза","kind":"знание","question":"На чём, по Павлову, держалась быстрота интервенций Перлза?","options":["На многолетнем клиническом опыте, в том числе в своём институте в ЮАР","На театральности, которую он взял у Морено и из увлечения театром","На вере в мощь синтеза, который он собрал из нескольких учений"],"correct":0,"why_not":[null,"Театральность и драматизм Перлз, по Павлову, взял для сеттинга горячего стула. Быстроту интервенций Павлов объясняет другим.","На этой вере, по Павлову, держались натиск и решительность Перлза, а не быстрота."],"explanation":"Перлз создал первый в ЮАР психоаналитический институт и много лет там работал. Поэтому он реагировал на то, что действительно актуально для клиента в его истории, и, как сказали бы позже, «выбирал верную, наиболее энергетически насыщенную, фигуру» - ту часть истории, в которой у клиента сейчас больше всего энергии.","source":"Павлов, «Много часов для себя», раздел 2: быстрота, точность и яркий натиск","quote":"Быстрота интервенций Ф.Перлза базировалась на многолетнем клиническом опыте (он был создателем первого в ЮАР психоаналитического института, где и проработал много лет).","by_record":false,"h":"31903967"},{"id":"m1-pv-02-04","module":1,"topic":"«Молитва гештальтиста»","kind":"знание","question":"Что, по Павлову, подчёркивала «молитва гештальтиста» («Я - это я. Ты - это ты...»)?","options":["Взаимозависимость людей и их ответственность друг перед другом","Ценность принадлежности к группе и общих для всех ожиданий","Личную ответственность за ясность в отношениях и свой выбор"],"correct":2,"why_not":["Как раз о месте взаимозависимости и социальной ответственности, по Павлову, возникают вопросы к «молитве», и ранний гештальт на них не отвечает.","«Молитва» говорит обратное: «Я пришел в этот мир не для того, чтобы соответствовать твоим ожиданиям».",null],"explanation":"«Молитва» отвечала на размытые границы между людьми: каждый сам отвечает за прояснение отношений и за выбор поведения и ценностей. Павлов называет её заряд эготическим, то есть сосредоточенным на себе, а Прохазка и Норкросс замечают, что идеальный человек по этой «молитве» - «чудовище какое-то».","source":"Павлов, «Много часов для себя», раздел 2: эготический индивидуализм","quote":"подчеркивала личную ответственность за прояснение отношений с окружающими и за самостоятельный выбор вариантов поведения и ценностей","by_record":false,"h":"31bcec9a"},{"id":"m1-pv-03-01","module":1,"topic":"Три течения современного гештальта","kind":"знание","question":"Ведущий группы порой до 70% времени излагает теорию, а групповую динамику считает помехой для раскрытия темы. К какому течению современного гештальта это относит Павлов?","options":["К романтизму","К прагматизму","К экспериентальности"],"correct":1,"why_not":["В романтизме тем нет совсем, динамика разворачивается «сама собой», а интервенции ведущего нечасты и скупы.",null,"Там главное - яркий опыт участников в упражнениях и экспериментах, а не теоретические блоки ведущего."],"explanation":"Прагматики стремятся быть «внятно полезными» и соответствовать модели «Ваши проблемы - наши технологии решения проблем!». Их группа часто выглядит как расширенный семинар, а ведущий - как эксперт, который знает, что правильно.","source":"Павлов, «Много часов для себя», раздел 3: прагматизм","quote":"Групповая динамика обычно не приветствуется, не становится предметом для обсуждения и осознавания, но, скорее, рассматривается в качестве препятствия для реализации цели – освещения темы. Ведущий занимает, порой, при освещении теоретических блоков, до 70% рабочего времени группы.","by_record":false,"h":"030c4670"},{"id":"m1-pv-03-02","module":1,"topic":"Критика прагматизма","kind":"знание","question":"В чём, по Павлову, главная критика прагматизма в гештальте?","options":["Риск потерять процессуальность и опору на организмическую саморегуляцию","Склонность к опытам ради опытов: чувства ценят, не утруждаясь осмыслением","Непрактичность, претенциозность и оторванность от реальной жизни"],"correct":0,"why_not":[null,"Это упрёк экспериентальному течению.","Так, по Павлову, критикуют романтизм."],"explanation":"Когда гештальт растворяется в экспертизе, почти неизбежен риск потерять внимание к процессу, а с ним самый действенный элемент подхода - опору на организмическую саморегуляцию, то есть на способность человека или группы регулировать себя самим, следуя своим потребностям. Ещё Павлов пишет, что сильно экспертный ведущий, с позиций теории Диалога, не может рассчитывать на диалог с клиентом.","source":"Павлов, «Много часов для себя», раздел 3: прагматизм","quote":"Критика данного направления, условно названного нами «прагматизмом», преимущественно заключается в указании на практически неизбежный риск утраты собственно процессуальности, а вместе с процессуальности и самого эффективного элемента Гештальт-подхода – опоры на организмическую саморегуляцию","by_record":false,"h":"ae2e42c5"},{"id":"m1-pv-03-03","module":1,"topic":"Экспериентальность","kind":"знание","question":"Какой ярлык, по Павлову, недоброжелатели и клинически ориентированные люди дадут экспериентальной субкультуре гештальта?","options":["«Обсессивная»","«Психастеническая»","«Истероидная»"],"correct":2,"why_not":["Так, по Павлову, назовут прагматизм с его склонностью к интеллектуализации и рационализации.","Так назовут романтизм, который упрекают в непрактичности и оторванности от жизни.",null],"explanation":"В экспериентальном течении главная ценность - сам опыт участников, и чем он необычнее, ярче и эмоциональнее, тем ценнее. Его критикуют за опыты ради опытов и за то, что чувства ценят, почти не осмысляя.","source":"Павлов, «Много часов для себя», раздел 3: экспериентальность","quote":"Недоброжелатели и критичные, клинически-ориентированные люди, вероятно, назовут эту субкультуру «истероидной».","by_record":false,"h":"2505f8c6"},{"id":"m1-pv-03-04","module":1,"topic":"Гештальт в сочетании с другими методами","kind":"знание","question":"Гештальт сочетают с десятками других методов. Какое сочетание, по Павлову, скорее всего признак романтической субкультуры?","options":["Гештальт и организационное развитие","Гештальт и теория личностных расстройств","Гештальт и танцедвигательная терапия"],"correct":0,"why_not":[null,"Теория объектных отношений или личностных расстройств, по Павлову, позволяет предположить скорее прагматическую ориентацию группы.","Плейбек-театр и танцедвигательная терапия с гештальтом дают, по Павлову, что-то из экспериентального направления."],"explanation":"Для темы статьи Павлову достаточно понять, к какому полюсу (экспертному или процессному) и к какому течению относится такое сочетание. Экзистенциализм, социализм XXI века и организационное развитие, по Павлову, скорее всего признаки романтизма.","source":"Павлов, «Много часов для себя», раздел 3: комбинации с «негештальтом»","quote":"а экзистенциализм, социализм XXI века, организационное развитие – скорее всего, являются признаками «романтической» субкультуры.","by_record":false,"h":"eca2f721"},{"id":"m1-pv-03-05","module":1,"topic":"Феноменология в гештальте и в «расстановках»","kind":"знание","question":"Павлов противопоставляет гештальт «расстановкам» по пониманию феноменологии. Что делает в группе феноменолог-гештальтист?","options":["Строит для участников структуру, в которой проявятся скрытые феномены","Комментирует наблюдения и факты, но не объясняет их «чудесный» смысл","Всерьёз толкует реакции исполнителей ролей как феномены поля"],"correct":1,"why_not":["Павлов пишет, что гештальтист обращает внимание на события, которые разворачиваются естественно, и не предлагает специально заведённую структуру.",null,"Так поступают в «расстановках»: проективные реакции актёров там называют «феноменами» и объясняют «теорией поля». Павлов это критикует."],"explanation":"Для гештальтиста приоритет в определении того, что важно, остаётся за клиентом. Феноменолог поддерживает участников в их собственных выводах и не сообщает им о правильном порядке вещей.","source":"Павлов, «Много часов для себя», раздел 3: разные «феноменологии»","quote":"комментирует наблюдения и факты, но не разъясняет их «чудесный» смысл","by_record":false,"h":"ba717d78"},{"id":"m1-pv-03-06","module":1,"topic":"Движение гештальта в мейнстрим","kind":"знание","question":"Гештальт долго был «неудобным», маргинальным подходом. Чем Павлов объясняет его нынешнее «движение в мейнстрим»?","options":["Гештальтисты отказались от своего мировоззрения ради учёных степеней","Гештальт наконец создал теорию личности, которой ждали академики","Сам мир движется к саморегуляции и сетевым формам организаций"],"correct":2,"why_not":["Павлов пишет обратное: гештальтисты получают учёные степени, «не отказываясь от собственного мировоззрения».","Павлов не пишет, что такая теория появилась. Наоборот, мысль о невозможности понять явление в отрыве от среды, по его словам, ставит под сомнение саму плодотворность теорий «личности».",null],"explanation":"В обществе растёт саморегуляция, появляются сетевые организации, у людей всё больше возможностей связываться друг с другом поверх границ. На этом фоне рост влияния гештальт-идеологии Павлов считает понятным: мы, по его словам, «попросту движемся в «Гештальтмир»!».","source":"Павлов, «Много часов для себя», раздел 3: маргинальность или мейнстрим","quote":"Натурально, при нарастании тенденций к саморегулируемости в обществе, при возникновении новых, сетевых форм построения организаций ... нарастание влияния Гештальт-идеологии становится вполне понятным.","by_record":false,"h":"980a3887"},{"id":"m1-pv-03-07","module":1,"topic":"Ответ Лоры Перлз","kind":"знание","question":"Лору Перлз спросили, почему она не занимается политикой или общественной деятельностью. Что она ответила?","options":["Что занимается: работа с каждым клиентом - весомое политическое влияние","Что политика мешает терапевту держаться того, что с клиентом сейчас","Что уже работает с общественными организациями и проектами ООН"],"correct":0,"why_not":[null,"Лора Перлз не противопоставляла терапию и политику: свою ежедневную работу с клиентами она сама назвала политическим влиянием.","Работа с НКО, проектами ООН и гражданскими инициативами - это, по Павлову, то, чем занимаются гештальтисты сегодня, когда им уже мало ответа Лоры Перлз."],"explanation":"Павлов приводит эту историю, когда пишет о том, как гештальт учитывает социальный контекст: явление здесь не мыслят в отрыве от среды. Сегодня гештальтисты всё чаще считают, что есть и более мощные способы влиять, и работают с общественными организациями, проектами ООН, гражданскими инициативами.","source":"Павлов, «Много часов для себя», раздел 3: как мы учитываем социальный контекст","quote":"Тогда из ее уст прозвучало: «А я занимаюсь! Моя повседневная работа с каждый индивидуальным клиентом – это весомое политическое влияние!»","by_record":false,"h":"6b819c65"},{"id":"m1-pv-04-01","module":1,"topic":"Главная граница расхождения школ","kind":"знание","question":"Какую границу Павлов называет главной для расходящихся тенденций внутри гештальта?","options":["Гештальт или психоанализ","Индивидуальное или полевое","Лечить или помогать расти"],"correct":1,"why_not":["Павлов пишет, что разные гештальт-субкультуры порой различаются между собой сильнее, чем гештальт и психоанализ. А между гештальтом и психоанализом он видит сближение.",null,"Этот вопрос Павлов тоже ставит, но отвечает на него через «континуум самоподдержки» в Реконструкции Качества Жизни. Главной границей расхождения он его не называет."],"explanation":"Как и при рождении метода, главная граница - между взглядом на человека как на отдельного индивида и взглядом на него как на часть поля, то есть среды и связей. Пока не ясно, когда уместен какой взгляд, внутри подхода будут рождаться новые расходящиеся течения.","source":"Павлов, «Много часов для себя», раздел 4: конвергенция и дивергенция","quote":"Главной границей, определяющей дивергентные тенденции внутри подхода, на мой взгляд, является, как и при рождении метода, идеологическая граница «индивидуальное/контекстное, полевое».","by_record":false,"h":"61bfdb4f"},{"id":"m1-pv-04-02","module":1,"topic":"Что объединяет гештальт","kind":"знание","question":"Что, по Павлову, остаётся «цементом», который удерживает разные школы гештальта вместе?","options":["Свобода, осознанность и ответственность","Диалог терапевта и клиента","Феноменология и теория поля"],"correct":2,"why_not":["Эти привычные лозунги раннего гештальта Павлов считает слишком общими: их готовы поднять на знамёна не только гештальтисты, и они не выдерживают проверки вопросом «индивидуальное или полевое».","Диалог, по Павлову, «мигрирует» в романтический гештальт и удаляется от прагматизма и экспериентальности. Общим цементом Павлов его не называет.",null],"explanation":"Феноменология (внимание к тому, что человек сам переживает и замечает) и теория поля (человека не понять без его среды) остаются основой общей культуры подхода.","source":"Павлов, «Много часов для себя», раздел 4: конвергенция и дивергенция","quote":"то Феноменология и Теория Поля сохраняют за собой роль «цементирующей» теории, составляя основу объединяющей культуры и идеологии.","by_record":false,"h":"19ad7e01"},{"id":"m1-pv-04-03","module":1,"topic":"Сближение гештальта и психоанализа","kind":"знание","question":"Павлов описывает сближение гештальта и психоанализа. Какой шаг навстречу сделали некоторые гештальтисты?","options":["Взяли клиническую модель трёх типов организации опыта","Признали важность отношений терапевта и клиента и контрпереноса","Заговорили о малоинтерпретативном и неинтерпретативном подходе"],"correct":0,"why_not":[null,"Это шаг аналитиков: важность отношений признал Столороу, а в психоанализе заговорили об «Эре Контрпереноса».","Публикации о «малоинтерпретативном» и «неинтерпретативном» психоанализе тоже появились у аналитиков."],"explanation":"В некоторых экспертно-ориентированных кругах гештальтистов заговорили о «Гештальт-анализе» и заимствовали клиническую типологию: нарциссический, невротический и шизоидный способы организации опыта. Это дало обучающимся диагностический инструмент и сблизило их рассуждения с клиницистами и аналитиками.","source":"Павлов, «Много часов для себя», раздел 4: «Вперед в прошлое», гештальт-анализ","quote":"Основной отличительной особенностью данного синтетического теоретического конструкта являлось заимствование клинической модели трех типичных способов организации опыта в поле (нарциссический, невротический, шизоидный).","by_record":false,"h":"b82709a1"},{"id":"m1-zp-02","module":1,"topic":"Сочетание экспертного и процессного","kind":"знание","question":"Какой способ сочетать экспертный и процессный подходы в работе с клиентом предлагали на сессии?","options":["Начать с чистой феноменологии, а экспертизу давать только по просьбе","Зайти через экспертное знание, получить доверие и перейти к процессу","Выбрать один из подходов и держаться его, чтобы не сбивать клиента"],"correct":1,"why_not":["На сессии говорили, что «люди не тянут феноменологию в чистом виде», поэтому её надо «разбавлять».",null,"Там же подчёркивали: вопрос не в выборе одного из подходов, а в их гармоничном сочетании."],"explanation":"Экспертное знание помогает завоевать доверие клиента, а затем можно плавно перейти в процессную работу и учить его феноменологии - замечать, что с ним происходит. Каждый профессионал находит своё сочетание, на сессии это назвали «барменством».","source":"Запись сессии 14.12.2025, раздел про экспертный и процессный подходы","quote":"Можно «зайти» к клиенту через экспертное знание, завоевав доверие, а затем плавно перейти в процессную работу, обучая его феноменологии.","by_record":true,"h":"e34ed1b8"},{"id":"m1-zp-03","module":1,"topic":"Развитийная модель","kind":"знание","question":"На сессии сравнивали клиническую и развитийную модели. Почему развитийная модель менее востребована в начале работы?","options":["Она ищет «поломки» и ставит диагнозы, а это пугает клиентов","Специалист в ней активно вмешивается, как хирург, и встречает отпор","Клиенты часто ждут от специалиста готовых решений"],"correct":2,"why_not":["Диагностика и поиск «сбоев» - черта клинической модели. Развитийная диагнозов не ставит, а интересуется, «как оно работает».","Активное вмешательство, как у хирурга, и риск «борьбы» с сопротивлением системы на сессии относили к клинической модели.",null],"explanation":"Развитийная модель отдаёт ответственность клиенту и сопровождает его, не вмешиваясь напрямую, а клиенты сначала хотят ответов. Зато для долгого роста она эффективна: если специалист слишком часто даёт готовые решения, система может привыкнуть их ждать и перестать развиваться сама.","source":"Запись сессии 14.12.2025, раздел про клиническую и развитийную модели","quote":"Менее востребована в начале, так как клиенты часто ожидают готовых решений, но очень эффективна для долгосрочного роста.","by_record":true,"h":"07669c33"},{"id":"m2-pa-01","module":2,"topic":"Холизм и целостная ситуация","kind":"знание","question":"Что, по Левину, на которого опирается Парлетт, составляет ядро теории поля?","options":["Последовательный анализ переменных, из которых складывается поведение","Взгляд на всю ситуацию целиком, а не по частям и не пункт за пунктом","Набор строгих законов, по которым можно предсказать поведение человека"],"correct":1,"why_not":["Именно такому разбору - «по частям, или пункт за пунктом, или последовательный анализ переменных» - Парлетт противопоставляет ядро теории поля.",null,"Левин пишет: «Теория поля едва ли может быть названа теорией в обычном смысле». По словам Парлетта, это скорее набор принципов, подход и способ мышления."],"explanation":"Теория поля смотрит на человека вместе с его средой: обществом, организациями, культурой. Сложное явление не дробят на части, а видят целиком, со всеми связями.","source":"Малкольм Парлетт, «Раздумья о теории поля», раздел о холизме, контексте и «целостной ситуации»","quote":"Ядром теории поля, по словам Левина, является скорее «взгляд на всю ситуацию целиком» (Левин, 1952, стр. 288), чем по частям, или пункт за пунктом, или последовательный анализ переменных.","by_record":false,"h":"a41c1f3a"},{"id":"m2-pa-02","module":2,"topic":"Принцип организации","kind":"знание","question":"Парлетт просит представить: во время лекции рядом взрывается бомба, зал становится госпиталем, столы - носилками. Что он показывает этим примером?","options":["Свойства вещей устойчивы, а меняется только то, как люди к ним относятся","Структура помещения и его функция строго разделены и меняются независимо","Значение вещи задаёт контекст её использования, то есть поле как целое"],"correct":2,"why_not":["Парлетт пишет обратное: едва ли имеет смысл думать о свойствах объектов как о чём-то устойчивом и неизменном.","По тексту «структура» и «функция» не строго разделены: обе выражают свойства взаимосвязанного целого.",null],"explanation":"Это принцип организации: всё взаимосвязано, и значение получается из всей целостной ситуации. Изменилось поле - и стул, и стол, и комната получили другой смысл.","source":"Малкольм Парлетт, «Раздумья о теории поля», принцип организации","quote":"Свойства вещей определены контекстом их использования.","by_record":false,"h":"e43c677e"},{"id":"m2-pa-03","module":2,"topic":"Принцип сингулярности","kind":"знание","question":"Новичок спрашивает: «Как в гештальте работают с анорексией?» Что по принципу сингулярности ему отвечают?","options":["Общей процедуры нет: терапевт смотрит на обстоятельства этого человека","Сначала находят общее с похожими случаями, затем подбирают под него метод","Терапевт изучает все стороны ситуации клиента, ничего не оставляя в стороне"],"correct":0,"why_not":[null,"Такое обобщение Парлетт называет путём к преждевременному структурированию опыта: так легко «обнаружить» то, что ищешь.","Парлетт пишет, что из множества аспектов ситуации терапевт может сосредоточиться лишь на некоторых, имеющих отношение к делу."],"explanation":"Принцип сингулярности (единственности): каждая ситуация «человек - ситуация» своя. Терапевт смотрит на самоподдержку клиента, его осознанность, сопротивления, срочные потребности и то, как он прерывает контакт.","source":"Малкольм Парлетт, «Раздумья о теории поля», принцип сингулярности","quote":"нет общих процедур, которые вывели бы из состояния анорексии. Вместо этого терапевт будет обращать внимание на индивидуальные обстоятельства","by_record":false,"h":"fcb0afe1"},{"id":"m2-pa-04","module":2,"topic":"Принцип изменяющегося процесса","kind":"знание","question":"Как, по Парлетту, гештальтисты смотрят на ретрофлексию?","options":["Как на тип личности: люди делятся на ретрофлектов и неретрофлектов","Как на процесс: он порой бывает у каждого при определённых условиях","Как на диагноз, от которого лучше отказаться: категории гештальту не нужны"],"correct":1,"why_not":["Парлетт прямо пишет, что вместо деления людей на «ретрофлектов» и «неретрофлектов» гештальтисты рассматривают ретрофлексию как процесс.",null,"Парлетт предупреждает и против этой крайности: не надо создавать новую дихотомию, в которой мы «никогда не используем диагностические категории»."],"explanation":"Ретрофлексия - когда импульс не выходит наружу, а разворачивается на самого человека. По принципу изменяющегося процесса поле всё время меняется, поэтому жёсткие ярлыки вроде «либо ты ассертивный человек, либо нет» не описывают опыт: даже тот, кто ретрофлексирует, делает это не всегда.","source":"Малкольм Парлетт, «Раздумья о теории поля», принцип изменяющегося процесса","quote":"мы предпочитаем рассматривать ретрофлексию как процесс, свойственный всем нам порой при определенных обстоятельствах.","by_record":false,"h":"d5a896ff"},{"id":"m2-pa-05","module":2,"topic":"Способы познания и доминирующая эпистемология","kind":"знание","question":"Что, по Парлетту, легло в основу доминирующей эпистемологии нашего времени - привычного способа познавать мир, которому оппонирует теория поля?","options":["Организменное мировоззрение тесных сообществ, где общее важнее личного","Системный взгляд, который описывает явление в его контексте и окружении","Расщепление между миром, который я переживаю, и миром «на самом деле»"],"correct":2,"why_not":["Это мировоззрение Европы до 1500 года по Капре. Научная революция как раз сменила его моделью «мир-машина».","Теорию систем Парлетт ставит рядом с теорией поля: оба подхода описывают сложное явление в его контекстах, а не в изоляции.",null],"explanation":"С ростом научного взгляда, измерений и «объективности» человек стал отделять свой опыт от мира, который будто бы существует независимо от него. Теория поля возвращает целостность: субъект и объект не противопоставлены.","source":"Малкольм Парлетт, «Раздумья о теории поля», раздел о доминирующей эпистемологии нашего времени","quote":"произошла фундаментальная сепарация между миром, который я естественным образом переживаю, и миром, который (согласно доминирующей в науке гипотезе) «существует на самом деле». ... легло в основу доминирующей эпистемологии нашего времени.","by_record":false,"h":"9ddd1826"},{"id":"m2-pa-06","module":2,"topic":"Self","kind":"знание","question":"Как Парлетт вслед за Хантером Бомонтом понимает self на языке теории поля?","options":["Как то, что группирует и организует поле: процесс, а не застывшая сущность","Как устойчивое ядро личности, которое сохраняется при любых обстоятельствах","Как совместное поле, которое два человека создают в контакте друг с другом"],"correct":0,"why_not":[null,"Парлетт пишет, что self в гештальт-терапии - это процесс, а не статичная, абстрактная умозрительная сущность.","Совместное поле - это со-творённая реальность двоих, их «общий коммуникативный дом». Self у Парлетта - функция, которая создаёт личное пространство и личную реальность человека."],"explanation":"Self организует поле: одни части моего опыта становятся фигурой (главным, заметным), другие уходят в фон. Поэтому Парлетт называет self процессом: он всё время формирует поле опыта.","source":"Малкольм Парлетт, «Раздумья о теории поля», раздел The Self","quote":"под self мы можем понимать нечто, что группирует, организует поле.","by_record":false,"h":"61e78aa0"},{"id":"m2-pa-07","module":2,"topic":"Два человека, две личности","kind":"знание","question":"Двое молча сидят в приёмной стоматолога и смотрят друг на друга. Что, по Парлетту, происходит с пространством между ними?","options":["Оно уже стало общим полем, ведь двое находятся в одной ситуации","В нём складывается сумма переживаний обоих, просто без слов","Оно остаётся бесформенным, заполненным проекциями и догадками"],"correct":2,"why_not":["Общее пространство, по Парлетту, начинает оживать, когда появляется контакт: взгляд, слова, мимика. Без коммуникации общность реальностей очень мала.","Парлетт пишет, что даже совместное поле не является просто суммой переживаний двоих: это нечто новое, функция их обоих.",null],"explanation":"Общее поле создаётся в контакте, а не само по себе. Как говорил Карл Ходжес, «контакт организует поле», и между людьми возникает совместная реальность.","source":"Малкольм Парлетт, «Раздумья о теории поля», раздел «Два человека, две личности»","quote":"пространство между ними остается не дифференцированным и бесформенным, и общность их реальностей будет очень мала.","by_record":false,"h":"f62ea1bf"},{"id":"m2-pa-08","module":2,"topic":"Построение реальностей Другого","kind":"знание","question":"Социолог брала у Парлетта интервью монотонным голосом и не показывала эмоций, чтобы не повлиять на его ответы. Какой вывод он делает?","options":["Нейтральность интервьюера помогает получить более чистые ответы","«Чистого» интервью без влияния личности интервьюера не бывает","Влияния можно избежать, если чётко выстроить границы беседы"],"correct":1,"why_not":["После такого интервью Парлетт был «полностью изможден» и пишет, что интервьюер следовала старой эпистемологии с её верой в «объективную» науку.",null,"Границы, по Парлетту, важны для безопасности и доверия, но влияния не убирают: даже молчание аналитика - такое же значимое сообщение, как обычный диалог."],"explanation":"Создавая общее поле, каждый участвует в построении реальности другого. Поэтому идею, что можно быть «объективным наблюдателем» и не участвовать в процессе, Парлетт считает сомнительной.","source":"Малкольм Парлетт, «Раздумья о теории поля», раздел «Мы участвуем в построении реальностей Другого»","quote":"Не существует «чистого» интервью, свободного от роли и влияния личности интервьюера, а с точки зрения теории поля, такого и вовсе не может быть.","by_record":false,"h":"e7216516"},{"id":"m2-pa-09","module":2,"topic":"Игнорирование очевидного","kind":"знание","question":"Парлетт пишет, что гештальтисты порой считают часть поля неважной: групповой процесс, обстановку, отношения ведущих. Как он смотрит на такие стороны группы?","options":["Их нельзя заранее считать неважными: люди реагируют на всё поле целиком","Их стоит разобрать по одной и настроить каждую как отдельный фактор","Они второстепенны: на результат влияет сама работа, а не её окружение"],"correct":0,"why_not":[null,"Парлетт пишет, что всё это влияет на жизнь группы не как отдельно взятый фактор, а как часть взаимосвязанного целого.","Так рассуждают врачи из примера Парлетта, для которых важна только форма лечения. Он возражает: люди реагируют на весь контекст деятельности, равно как и на саму деятельность."],"explanation":"Это принцип возможной значимости: ни одну часть поля нельзя заранее исключить как неважную. Когда гештальтисты всё же так делают, это, по Парлетту, показывает, что теорию поля они ещё не усвоили полностью.","source":"Малкольм Парлетт, «Раздумья о теории поля», раздел «Игнорирование очевидного»","quote":"люди реагируют на все поле в целом, а не на отдельные факторы или некие отсепарированные свойства","by_record":false,"h":"6a5ff4af"},{"id":"m2-pa-10","module":2,"topic":"Терапевтическое поле","kind":"знание","question":"Почему, по Парлетту, терапевту важны постоянная супервизия и ежедневное внимание к «качеству готовности к клиенту»?","options":["Терапевт так держит дистанцию и не вносит в работу своих чувств","Терапевт так точнее подбирает технику под каждую клиническую цель","Терапевт, меняя себя, участвует и в изменении клиента"],"correct":2,"why_not":["Парлетт пишет обратное: хорошему терапевту нужно становиться более включённым, а способ его жизни нельзя полностью отделить от работы.","Парлетт прямо говорит, что гештальт-терапия - не набор средств, которые запускают для одной клинической цели и заменяют другим для другой.",null],"explanation":"Поле встречи создают двое, поэтому то, как терапевт относится к клиенту и что к нему чувствует, влияет на поле «между», а через него на клиента. Отсюда и вывод про супервизию и готовность к встрече.","source":"Малкольм Парлетт, «Раздумья о теории поля», раздел «Терапевтическое поле»","quote":"терапевт, изменяя себя, участвует в изменении клиента.","by_record":false,"h":"a7b3120b"},{"id":"m2-zp-01","module":2,"topic":"Вижу, слышу, чувствую","kind":"знание","question":"На сессии разбирали три канала феноменологической интервенции: «вижу, слышу, чувствую». Какая фраза ведущего - феноменологическая интервенция, а не интерпретация?","options":["«Я вижу, что вам всё равно, что скажет группа»","«Я чувствую растерянность, когда вы говорите так»","«Я чувствую, что вы сейчас злитесь на группу»"],"correct":1,"why_not":["Глазами можно увидеть скрещённые руки, но не «всё равно»: это уже трактовка. На сессии предупреждали отслеживать, где кончается описание факта и начинается трактовка.",null,"В канале «чувствую» говорят о своих чувствах, а не приписывают их другому. Приписать чувство другому - уже интерпретация."],"explanation":"Феноменологическая интервенция - это то, что ведущий видит глазами, слышит ушами (включая интонацию и паузы) и чувствует сам. Такие высказывания нельзя опровергнуть, в отличие от догадок о том, что происходит внутри у другого.","source":"Запись сессии 21.02.2026, раздел про три канала «вижу, слышу, чувствую»","quote":"Важно говорить о СВОИХ чувствах, а не приписывать их другому. ... Правильно будет: «Я чувствую растерянность, когда вы говорите так».","by_record":true,"h":"2df3f288"},{"id":"m2-zp-02","module":2,"topic":"Тема, проблема, дилемма","kind":"знание","question":"На сессии различали тему, проблему и дилемму. Чем дилемма отличается от проблемы?","options":["С дилеммой обходятся, выбирая из неприятных вариантов, а проблему решают","Дилемма - это проблема, на решение которой у человека пока не хватает ресурсов","Дилемма даёт общее название тому, что разворачивается в группе"],"correct":0,"why_not":[null,"Нехватка ресурсов - это как раз определение проблемы: требования ситуации превышают ресурсы организма, и её можно решить.","Так на сессии описывали тему: инструмент, близкий к метафоре, который помогает увидеть общий смысл происходящего."],"explanation":"Проблему можно решить, как аппендицит решается операцией. Дилемма - выбор между неприятными вариантами: её не решают, а с ней обходятся. Пример с сессии - «не могу перестать работать».","source":"Запись сессии 21.02.2026, раздел про тему, проблему и дилемму","quote":"**Дилемма:** Это ситуация, где есть **выбор** между несколькими неприятными вариантами, и ей нужно **обходиться**, а не решать.","by_record":true,"h":"833f9a4b"},{"id":"m2-ya-01-02","module":2,"topic":"Сообщение информации: советы","kind":"знание","question":"Участники интеракционной группы то и дело советуют друг другу: «Почему бы вам...», «Я думаю, вы должны...». Как Ялом смотрит на такие советы?","options":["Это черта молодой группы; ценен не сам совет, а то, что его дали","Это ведущий фактор: оглядываясь назад, пациенты ценят советы выше всего","Это помеха работе, и терапевт должен сразу запрещать советы в группе"],"correct":0,"why_not":[null,"Ялом пишет обратное: оглядываясь на пройденный путь, и терапевты, и пациенты оценивают сообщение информации невысоко.","Запрещать их Ялом не предлагает: советы характерны для ранней стадии группы и иногда полезны."],"explanation":"Частые советы, по Ялому, - знак молодой группы или временного отката в зрелой. Польза не в содержании совета: в самом факте видны взаимный интерес и забота.","source":"Ялом, «Групповая психотерапия», гл. 1, сообщение информации, с. 14 - по конспекту","quote":"Советы характерны для ранней стадии; иногда они полезны. Главное: «важен не сам совет, а важно то, что его дали»","by_record":false,"h":"dca45a43"},{"id":"m2-ya-02-01","module":2,"topic":"Группа как социальный микрокосм","kind":"знание","question":"Ялом называет свободную интерактивную группу «социальным микрокосмом». Что это значит для работы с проблемами участника?","options":["Группе стоит подробно разбирать трудности участника во внешней жизни, например его брак","Группа - искусственная среда, и поведение в ней мало говорит о жизни участника за её стенами","Участник со временем ведёт себя в группе как в жизни, и описывать свои проблемы ему не нужно"],"correct":2,"why_not":["Так работала прежняя группа миссис Кейп: бесконечно обсуждали её брак, и тщетно. По Ялому, такой подход сводит на нет потенциал группы и деморализует её.","Искусственной Ялом признаёт группу только в одном смысле: участники не живут и не работают вместе. Психологически, пишет он, группа может быть гораздо более реальной, чем внешний мир.",null],"explanation":"Социальный микрокосм - уменьшенная модель мира участника. Рано или поздно он показывает в группе то же поведение, которое мешает ему в жизни, и с ним можно работать прямо на встрече. Это понимание Ялом называет краеугольным камнем своего учения.","source":"Ялом, «Групповая психотерапия», гл. 2, группа как социальный микрокосм, с. 33 - по конспекту","quote":"они взаимодействуют в группе так же, как в своём окружении, и рано или поздно выносят на обозрение своё дезадаптивное поведение; описывать свою патологию им не нужно","by_record":false,"h":"d8528704"},{"id":"m2-ya-02-02","module":2,"topic":"Дуальная природа изменений","kind":"знание","question":"Участников групп встреч просили отметить, что на них повлияло сильнее всего. Эмоциональный опыт высоко оценили и те, кто изменился, и те, кто нет. Что отличало успешных?","options":["Более сильное выражение чувств и более глубокое самораскрытие на встречах","Когнитивная часть: усвоили информацию или сами пришли к пониманию","Генетический инсайт: понимание детских истоков своих проблем"],"correct":1,"why_not":["Выражение сильного аффекта и самораскрытие высоко оценивали все, даже те, у кого произошли деструктивные изменения. Успешных это не отличает.",null,"Генетический инсайт Ялом в этой главе ставит под сомнение: изменения часто идут без него, и связи между ним и устойчивостью изменений не выявлено."],"explanation":"Ялом называет терапию дуальным процессом: нужно сильно пережить и разумом понять, что из этого следует. Одного переживания мало, решает «петля саморефлексии» - взгляд на только что пережитое.","source":"Ялом, «Групповая психотерапия», гл. 2, коррективный эмоциональный опыт, с. 32-33 - по конспекту","quote":"Отличал успешных когнитивный компонент: они усвоили информацию или дошли до неё сами","by_record":false,"h":"0b45d384"},{"id":"m2-ya-03-01","module":2,"topic":"Определение сплочённости","kind":"знание","question":"Как Ялом определяет групповую сплочённость, если сказать проще?","options":["Привлекательность группы для её членов","Взаимная привязанность и взаимопонимание участников","Качество отношений каждого участника с ведущим"],"correct":0,"why_not":[null,"Ялом прямо оговаривает: сплочённость - не синоним привязанности и взаимопонимания, хотя и связана с ними.","Отношение к терапевту - лишь часть сплочённости. Ялом включает в неё отношение пациента к терапевту, к другим членам группы и к группе в целом."],"explanation":"Полное определение - «результирующая всех сил», которые удерживают членов в группе; проще - насколько группа притягивает тех, кто в ней. Ялом уточняет, что сплочённость «сама по себе не является лечебным фактором», а служит предпосылкой эффективной терапии - так же, как «отношение лечит» в индивидуальной терапии: оно создаёт условия для самораскрытия, проверки и изучения себя и отношений.","source":"Ялом, «Групповая психотерапия», гл. 3, определение сплочённости, с. 54 - по конспекту","quote":"или проще - «привлекательность группы для ее членов»","by_record":false,"h":"566fb5a6"},{"id":"m2-ya-03-02","module":2,"topic":"Сплочённость и враждебность","kind":"знание","question":"Как, по Ялому, сплочённость связана с враждебностью в группе?","options":["Сплочённая группа избегает ссор: сплочённость и есть комфорт","В сплочённой группе враждебность можно выражать открыто, и это лечит","Открытая враждебность к ведущему - признак слабой сплочённости"],"correct":1,"why_not":["Ялом прямо пишет: «Было бы ошибкой отождествлять сплоченность с комфортом». Сплочённые группы он сравнивает с семьями, где идут междоусобные войны, но сохраняется преданность семье.",null,"Всё наоборот: сплочённые группы способнее выражать враждебность к лидеру. В опыте с сотрудником, который оскорблял группы, открытее возмущались как раз сильно сплочённые."],"explanation":"Невыраженная враждебность тлеет и мешает участникам узнавать друг друга. Сплочённость удерживает людей в группе, пока они проходят через конфликт, - как Сьюзан и Джин, которые в итоге поняли, как много значат друг для друга.","source":"Ялом, «Групповая психотерапия», гл. 3, сплочённость и выражение враждебности, с. 71-74 - по конспекту","quote":"«Было бы ошибкой отождествлять сплоченность с комфортом» (с. 71); в сплоченных группах можно развивать и выражать враждебность, и это терапевтично.","by_record":false,"h":"391952a9"},{"id":"m2-ya-04-01","module":2,"topic":"Q-сортировка лечебных факторов","kind":"знание","question":"Двадцать успешных пациентов долгосрочной групповой терапии раскладывали 60 карточек - по пять пунктов на каждый из 12 лечебных факторов - по степени пользы. Какой фактор по сумме своих пунктов оказался на первом месте?","options":["Катарсис: возможность выговориться и научиться выражать чувства","Сплочённость: принадлежность к группе и принятие ею","Входящая информация: что другие честно думают обо мне"],"correct":2,"why_not":["Катарсис занял второе место из двенадцати категорий.","Сплочённость оказалась на третьем месте.",null],"explanation":"Выше всего пациенты поставили межличностное научение - понимание того, как их воспринимают другие. Ниже всего оказались воспроизведение семьи, руководство и идентификация.","source":"Ялом, «Групповая психотерапия», гл. 4, Q-сортировка лечебных факторов, с. 88-94 - по конспекту","quote":"Порядок 12 категорий ... 1. Входящая интерперсональная информация 2. Катарсис 3. Сплоченность","by_record":false,"h":"8ced5ccb"},{"id":"m2-ya-04-02","module":2,"topic":"Экзистенциальные факторы: одиночество","kind":"знание","question":"На примере пациентки Гейл Ялом различает два вида одиночества - социальное и экзистенциальное (базовое). Что группа может сделать с каждым?","options":["Социальное легко прорабатывается в группе, базовое устранить нельзя - о нём можно только знать","Базовое одиночество - та же нехватка навыков общения, и группа снимает его обратной связью","Социальное одиночество - дело внешней жизни, а в группе работают только с базовым одиночеством"],"correct":0,"why_not":[null,"Это как раз ошибка, о которой предупреждает Ялом: переводить экзистенциальное одиночество в социальное.","Ялом пишет обратное: именно социальное одиночество, невозможность «быть с» другими, легко прорабатывается в группе."],"explanation":"Социальное одиночество - неумение быть рядом с другими, и группа с ним справляется. Базового одиночества избежать нельзя, его можно только признать: Гейл перестала прятаться от него в роли ребёнка и начала принимать решения.","source":"Ялом, «Групповая психотерапия», гл. 4, экзистенциальные факторы, с. 99-100 - по конспекту","quote":"Социальное легко прорабатывается в группе; базовое нельзя устранить, о нем можно только знать.","by_record":false,"h":"f515bf51"},{"id":"m2-ya-04-03","module":2,"topic":"Лечебные факторы и стадии","kind":"знание","question":"Какие лечебные факторы, по Ялому, особенно важны на ранней стадии группы, пока решаются вопросы адаптации и сохранения членства?","options":["Глубокое самораскрытие, конфронтация и открытый конфликт","Внушение надежды, руководство и универсальность","Альтруизм в форме заботливости и «совместного бытия»"],"correct":1,"why_not":["Глубокое самораскрытие, конфронтация и конфликт, по Ялому, возможны только после того, как сложилась сплочённость.",null,"Заботливость и «совместное бытие» - поздняя форма альтруизма. В начале он проще: предложение помощи и разговоры на подходящие темы."],"explanation":"Первые двенадцать встреч Ялом называет периодом высокого риска ухода, поэтому на старте важно пробуждать надежду. Значимость факторов меняется по ходу курса: важное в начале позже может отойти на второй план.","source":"Ялом, «Групповая психотерапия», гл. 4, лечебные факторы и стадии терапии, с. 112 - по конспекту","quote":"На ранних стадиях - адаптация, границы, сохранение членства; важны внушение надежды, руководство, универсальность","by_record":false,"h":"32bd17e9"},{"id":"m2-ya-05-01","module":2,"topic":"Культурное строительство","kind":"знание","question":"Что Ялом считает главной движущей силой изменения в терапевтической группе?","options":["Терапевта как директивного агента изменения","Саму группу, то есть её участников","Подобранные ведущим техники и упражнения"],"correct":1,"why_not":["Единоличный директивный агент изменения - роль терапевта в индивидуальной терапии. В группе он действует гораздо менее директивно.",null,"Техники, или «групповые трюки», по Ялому, - «слуги, а не хозяева». Лидер, который увлекался трюками без ясной концепции своей роли, получил «чрезвычайно бедный» результат."],"explanation":"Поддержку, обратную связь, надежду и возможность помогать дают остальные участники. Поэтому задача терапевта - культурное строительство: создать в группе такие правила общения, при которых участники могут так работать друг с другом.","source":"Ялом, «Групповая психотерапия», гл. 5, культурное строительство, с. 120 - по конспекту","quote":"обеспечивают остальные члены группы: «именно группа является движущей силой для изменения»","by_record":false,"h":"5a0d9b3a"},{"id":"m2-ya-05-02","module":2,"topic":"Устойчивость норм","kind":"знание","question":"Что показал эксперимент Джакобса и Кемпбелла, где участники в тёмной комнате оценивали движение световых точек?","options":["Норма сохранилась, даже когда весь состав группы постепенно заменили","Норма быстро сменилась, как только в группу пришли новые участники","Каждый видел своё число точек, и общая норма так и не сложилась"],"correct":0,"why_not":[null,"Всё наоборот: экспериментаторы меняли участников, пока состав не обновился полностью, а норма осталась прежней.","Норма в группе установилась, и после отклонений отдельных участников она быстро восстанавливалась."],"explanation":"Отсюда вывод Ялома: нормы складываются рано и потом меняются с трудом. Терапевт сильно влияет на нормы и избежать этой функции не может, поэтому выполнять её стоит взвешенно с первых встреч.","source":"Ялом, «Групповая психотерапия», гл. 5, конструирование норм, с. 123 - по конспекту","quote":"норма, установленная людьми задолго до их выведения из группы, осталась неизменной","by_record":false,"h":"71b20d24"},{"id":"m2-ya-05-03","module":2,"topic":"Как лидер формирует нормы","kind":"знание","question":"В каких двух ролях, по Ялому, лидер формирует нормы группы?","options":["Проводник и куратор, который оберегает участников от перенапряжения","Технический эксперт и эталонный участник","Групповой историк и хранитель времени"],"correct":1,"why_not":["«Проводник» и «кураторские функции» - из задачи создания и поддержания группы: в начале участники связаны через терапевта, и он следит, чтобы они не перенапрягались.",null,"Эти слова в главе есть, но про другое: «групповой историк» - о разъяснении процесса, «хранитель времени» - о том, как терапевт связывает события разных встреч."],"explanation":"Как эксперт терапевт открыто объясняет правила и подкрепляет нужное поведение кивком, улыбкой, вниманием. Как эталонный участник он сам показывает нужное поведение, например неосуждающее принятие, и группа берёт с него пример.","source":"Ялом, «Групповая психотерапия», гл. 5, как лидер формирует нормы, с. 124-130 - по конспекту","quote":"терапевт формирует нормы в двух ролях - технического эксперта (технического специалиста) и эталонного участника","by_record":false,"h":"f45465b6"},{"id":"m2-ya-05-04","module":2,"topic":"Здесь-и-сейчас: две задачи","kind":"знание","question":"У терапевта в здесь-и-сейчас две задачи: погрузить группу в здесь-и-сейчас и разъяснять процесс. Как, по Ялому, они со временем делятся с участниками?","options":["Погружение со временем берёт на себя группа, разъяснение процесса - больше за терапевтом","Разъяснение процесса передаётся группе, а погружать в здесь-и-сейчас продолжает терапевт","Обе задачи остаются за терапевтом: комментировать процесс участникам не по силам"],"correct":0,"why_not":[null,"Наоборот: погружение становится нормой, и участники помогают терапевту. А комментирующий процесс участник занимает отстранённую позицию, и к нему относятся с подозрением: «он не один из нас».","Ялом пишет, что участники вполне способны комментировать процесс и их взгляд часто принимают лучше, чем мнение терапевта. Но основная часть этой работы всё же остаётся за терапевтом."],"explanation":"Здесь-и-сейчас - разговор о том, что происходит между людьми прямо на встрече. Разъяснение процесса - взгляд на то, что между ними только что произошло. Без второго шага первый быстро исчерпывает свою пользу.","source":"Ялом, «Групповая психотерапия», гл. 5, задачи терапевта в здесь-и-сейчас, с. 144-147 - по конспекту","quote":"терапевт решает две задачи - погружает группу в здесь-и-сейчас (эту задачу группа со временем берёт на себя) и разъясняет процесс (это в большей мере остаётся за терапевтом)","by_record":false,"h":"a769e3f5"},{"id":"m2-ya-05-05","module":2,"topic":"Активация здесь-и-сейчас","kind":"знание","question":"В начале курса участник уверяет, что ко всем в группе относится одинаково тепло. Как Ялом работает с таким ответом?","options":["Принимает его как признак сплочённости и переходит к другой теме","Не спорит: мелкие различия в чувствах неважны, стоит ждать заметных","Считает это выдумкой, повторяет вопросы и помогает найти различия"],"correct":2,"why_not":["Ялом видит во «всеобщем равенстве» форму сопротивления, а не сплочённость: «Не ошибайтесь на этот счет. Это все выдумки».","Мелкие различия, по Ялому, как раз важны и ведут к погружению во взаимодействие: «никто еще не говорил, что разница в чувствах должна быть колоссальной».",null],"explanation":"Активация здесь-и-сейчас - перевод разговора на живые отношения внутри группы. Даже небольшая разница в чувствах к разным людям, если её назвать, втягивает участника во взаимодействие.","source":"Ялом, «Групповая психотерапия», гл. 5, активация здесь-и-сейчас, с. 151 - по конспекту","quote":"Сопротивление в облике «всеобщего равенства» ... «Не ошибайтесь на этот счет. Это все выдумки». Терапевт повторяет вопросы и помогает дифференцировать","by_record":false,"h":"7bc6598d"},{"id":"m2-ya-05-06","module":2,"topic":"Комментарий процесса: рубеж","kind":"знание","question":"Ялом разбирает серию комментариев процесса одному пациенту. Какой из них, по его словам, можно обесценить или проигнорировать, но нельзя отрицать?","options":["«Я думаю, вы догадываетесь, что соперничаете со мной и пытаетесь меня обесценить»","«Когда вы так поступаете, я чувствую свой гнев, угрозу и часто - страх»","«Я думаю, что вы настолько озабочены своей сексуальной привлекательностью для женщин, что в мужчинах вы видите только соперников»"],"correct":1,"why_not":["Это пятый комментарий в серии - догадка о намерениях и мотивах. Такие комментарии гораздо сильнее вызывают защиту, и их часто отвергают.",null,"Это восьмой комментарий, он построен на логических заключениях. Чем дальше по списку, тем больше комментарии опираются на выводы комментатора, а не на его прямой опыт."],"explanation":"Первые четыре комментария идут из чувственного опыта комментатора: что он видел и что почувствовал. Рубеж проходит между четвёртым и пятым - дальше начинаются догадки о чужих мотивах.","source":"Ялом, «Групповая психотерапия», гл. 5, комментарии процесса, с. 171-173 - по конспекту","quote":"Первые четыре проистекают из чувственного опыта комментатора: их можно обесценить или игнорировать, но «нельзя отрицать»","by_record":false,"h":"5159bd4d"},{"id":"m2-ya-05-07","module":2,"topic":"Комментарий на уровне всей группы","kind":"знание","question":"Когда, по Ялому, терапевту стоит комментировать происходящее на уровне всей группы - через «мы», «группа»?","options":["Почти всегда: любое сообщение лидера лучше строить как интерпретацию всей группы","Когда нужно развить сплочённость: для неё это главный путь","Когда что-то тормозит всю группу: пугающая тема или вредная норма"],"correct":2,"why_not":["Так считают, например, в Тавистокской школе. Ялом поддерживает такие вмешательства «только в малом проценте случаев».","Сплочённость, по Ялому, развивают другими путями: отбором и подготовкой участников, подкреплением самораскрытия, связью групповых целей с личными.",null],"explanation":"Цель интерпретации на уровне группы, по Ялому, - убрать препятствие, которое задерживает всех. Обычно это «групповое бегство» от пугающей темы или антитерапевтические нормы, например когда каждую встречу по очереди отдают одному участнику.","source":"Ялом, «Групповая психотерапия», гл. 5 (продолжение), комментарий процесса с позиции групповой массы, с. 189-193 - по конспекту","quote":"«целью интерпретации групповой массы является устранение некоторых препятствий, задерживающих прогресс всей группы»","by_record":false,"h":"875c00af"},{"id":"m2-ya-06-01","module":2,"topic":"Работа с переносом","kind":"знание","question":"Ялом пишет, что перенос на терапевта возникнет что бы тот ни делал. Какие два главных подхода он предлагает, чтобы пациент распознал и изменил искажённое мнение о лидере?","options":["Сверка впечатлений с группой и большая прозрачность терапевта","Позиция «чистого экрана» и интерпретация переноса как главная техника","Толкование любого поведения группы как переноса на терапевта"],"correct":0,"why_not":[null,"Это базовые принципы классического психоанализа. Ялом пишет, что групповой терапевт не может ограничиться работой с переносом.","По Ялому, терапевт, который видит только перенос, посягает на автономию пациентов. К тому же далеко не все мнения о терапевте основаны на переносе - многие соответствуют реальности."],"explanation":"Перенос - когда человек переносит на терапевта чувства к важным людям из прошлого. Если большинство видит терапевта так же, реакция скорее реалистична; если взгляд особый, пациенту помогают исследовать свою искажающую призму. Прозрачный терапевт даёт иметь с ним дело как с реальным человеком.","source":"Ялом, «Групповая психотерапия», гл. 6, перенос в терапевтической группе, с. 226-227 - по конспекту","quote":"Два главных подхода: 1) совместная оценка (консенсуальная проверка) ... 2) увеличение прозрачности терапевта","by_record":false,"h":"aecde541"},{"id":"m2-ya-06-02","module":2,"topic":"Прозрачность: страх эскалации","kind":"знание","question":"Против прозрачности терапевта часто возражают: стоит ему раскрыться, и группа будет требовать всё больше. Что отвечает Ялом?","options":["Верно: раскрывшись, лидер безвозвратно теряет роль ведущего группы","Беспочвенно: участники хотят, чтобы терапевт оставался неведомым и властным","Беспочвенно: личность терапевта участникам неинтересна, они заняты собой"],"correct":1,"why_not":["Так предсказали наблюдатели, когда Ялом на 29-й встрече ответил группе откровенностью. Предсказание не сбылось: группа углубилась в работу и не требовала от него ещё раскрытия.",null,"Ялом пишет обратное: члены группы любопытны. Страх беспочвенен по другой причине - им важно, чтобы терапевт оставался неведомым и властным."],"explanation":"По наблюдениям Ялома, группы никогда не требовали от него большего раскрытия. Участники любопытны, но им важно, чтобы терапевт оставался для них неведомым и влас
